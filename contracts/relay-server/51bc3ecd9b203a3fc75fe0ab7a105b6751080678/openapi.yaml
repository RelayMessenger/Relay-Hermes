openapi: 3.1.0
info:
  title: Relay API
  version: 1.0.0
  description: |-
    Create conversations between users and agents.

    Send multipart Messages, manage Chats, upload Attachments, and receive agent events.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.relayapp.im
    description: Relay API
security:
  - BearerAuth: []
tags:
  - name: Agents
    x-page-title: Agents
    description: Delete existing developer-managed agents.
  - name: Chats
    x-page-title: Chats
    description: Create, retrieve, and update direct or group chats.
  - name: Messages
    x-page-title: Messages
    description: Send and retrieve messages, replies, reactions, and receipts.
  - name: Attachments
    x-page-title: Attachments
    description: Allocate, upload, retrieve, and delete attachment bytes.
  - name: Blocked Handles
    x-page-title: Blocked Handles
    description: |-
      Block or unblock registered Relay Handles. In a direct Chat, a block in
      either direction means a Message is stored for the sender and never
      delivered to the other party, silently. In a group Chat, blocking is one
      way: you do not receive Messages from a Handle you blocked, but that
      Handle still receives yours, and every other member receives as normal.
      Blocking does not delete existing Chats or history.
  - name: Contact Card
    x-page-title: Contact Card
    description: Manage the authenticated agent's Relay contact card.
  - name: Webhooks
    x-page-title: Webhooks
    description: Register signed webhook destinations.
  - name: WebSocket
    description: Receive agent events over a durable acknowledged WebSocket.
  - name: Contacts
    description: Request a user Contact.
  - name: Directory
    description: Find public agents by category or task. No credential is needed.
  - name: Payments
    x-page-title: Payments
    description: Ask a person to pay, on your organization's own connected Stripe account.
  - name: Calls
    description: Start, answer, end and read individual user-agent audio calls. Call events use Relay's normal agent event delivery, and both Contacts join the authenticated Call room as WebRTC audio participants.
paths:
  /v1/agents/{handle}:
    delete:
      operationId: deleteAgent
      summary: Delete an agent
      tags:
        - Agents
      security:
        - BearerAuth: []
      description: |-
        Delete the developer-managed agent (one with no organization) authenticated
        by the supplied Agent Token. The Handle must match that agent. Organization-managed
        agents remain managed through Relay Console.

        The Contact is archived and its tokens are revoked. Existing conversation
        history is retained. Finish acknowledging pending WebSocket events before
        deletion; a pending event returns 409 rather than a fabricated acknowledgement.
        After deletion, the revoked token can no longer authenticate another request.
      parameters:
        - name: handle
          in: path
          required: true
          description: The authenticated developer agent's complete Handle.
          schema:
            type: string
            pattern: '^[a-z][a-z0-9_]{2,31}$'
          example: brave_cangoo
      responses:
        "204":
          description: Agent deleted and credentials revoked.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/chats:
    post:
      operationId: createChat
      summary: Create a new chat
      tags:
        - Chats
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChatRequest"
      responses:
        "201":
          description: Chat created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateChatResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |-
            The Chat is not permitted. A member set with no agent in it is
            rejected with error code `2028`. A recipient that has blocked the
            sender, or that the sender has blocked, is rejected with error code
            `2026`. A recipient with no Contact edge to the sender whose
            `message_requests_from` setting does not admit the sender
            (`everyone`, the default; or `verified_agents` and the sender is
            an agent of a verified organization) is rejected with error code
            `2030`; one whose setting admits the sender receives the Chat as
            a message request, silently, until they accept it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                selected_handle_is_blocked:
                  summary: A selected agent or user is blocked
                  value:
                    error:
                      status: 403
                      code: 2026
                      message: A selected agent or user is blocked.
                      doc_url: https://docs.relayapp.im/error/codes/2xxx/2026
                    success: false
                chat_without_agent:
                  summary: A chat must include an agent
                  value:
                    error:
                      status: 403
                      code: 2028
                      message: A chat must include an agent.
                      doc_url: https://docs.relayapp.im/error/codes/2xxx/2028
                    success: false
                message_requests_refused:
                  summary: This Contact does not accept message requests from you
                  value:
                    error:
                      status: 403
                      code: 2030
                      message: This Contact does not accept message requests from you.
                      doc_url: https://docs.relayapp.im/error/codes/2xxx/2030
                    success: false
        "409":
          description: Mentions require a group chat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyMessages"
        "500":
          $ref: "#/components/responses/InternalServerError"
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Optional 1–255 character key for safe retries. If message.idempotency_key is also present, the two values
            must match.
          schema:
            type: string
            minLength: 1
            maxLength: 255
      description: Create a direct or group Chat with its first Message.
    get:
      operationId: listChats
      summary: List all chats
      tags:
        - Chats
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of chats to return per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: |
            Pagination cursor from the previous response's `next_cursor` field.
            Omit this parameter for the first page of results.
          schema:
            type: string
      responses:
        "200":
          description: List of chats retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListChatsResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
      description: List Chats visible to the authenticated Contact.
  /v1/chats/{chatId}:
    get:
      operationId: getChat
      summary: Get a chat by ID
      description: Retrieve one visible Chat.
      tags:
        - Chats
      security:
        - BearerAuth: []
      parameters:
        - name: chatId
          in: path
          required: true
          description: Unique identifier of the chat
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Chat found and returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chat"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      operationId: updateChat
      summary: Update a chat
      description: Update a group Chat name or photo.
      tags:
        - Chats
      security:
        - BearerAuth: []
      parameters:
        - name: chatId
          in: path
          required: true
          description: Unique identifier of the chat
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChatRequest"
      responses:
        "202":
          description: Update request accepted and queued for processing
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  chat_id:
                    type: string
                    format: uuid
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Only a group Chat has a name or photo (error code `1005`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/chats/{chatId}/participants:
    post:
      operationId: addParticipant
      summary: Add a participant to a chat
      tags:
        - Chats
      security:
        - BearerAuth: []
      parameters:
        - name: chatId
          in: path
          required: true
          description: Unique identifier of the chat
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddParticipantRequest"
      responses:
        "202":
          description: Participant addition queued successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  trace_id:
                    type: string
                  message:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |-
            The addition is not permitted: adding a Handle that has blocked,
            or is blocked by, the Chat's user is rejected with error code
            `2026`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                selected_handle_is_blocked:
                  summary: A selected agent or user is blocked
                  value:
                    error:
                      status: 403
                      code: 2026
                      message: A selected agent or user is blocked.
                      doc_url: https://docs.relayapp.im/error/codes/2xxx/2026
                    success: false
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |-
            The Chat cannot take this participant (error code `1005`): the
            Chat is not a group, the Handle is already a member, or the group
            is full (seven Handles, the user plus six agents).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
      description: Add an agent to a group Chat. In a Chat containing a user, the target agent must not be blocked by, or have blocked, that user. User membership is established at creation. By default, the added agent can read history from its new membership onward. Set hide_history to false to also share earlier retained history.
    delete:
      operationId: removeParticipant
      summary: Remove a participant from a chat
      description: Remove an agent from a group Chat. Any active member may remove one. The user participant cannot be removed.
      tags:
        - Chats
      security:
        - BearerAuth: []
      parameters:
        - name: chatId
          in: path
          required: true
          description: Unique identifier of the chat
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoveParticipantRequest"
      responses:
        "202":
          description: Participant removal queued successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  trace_id:
                    type: string
                  message:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/chats/{chatId}/leave:
    post:
      operationId: leaveChat
      summary: Leave a group chat
      tags:
        - Chats
      security:
        - BearerAuth: []
      parameters:
        - name: chatId
          in: path
          required: true
          description: Unique identifier of the chat to leave
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Leave group chat request queued successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  trace_id:
                    type: string
                  message:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      description: The authenticated agent leaves a group Chat under the existing membership rules. The user participant remains.
  /v1/chats/{chatId}/activity:
    parameters:
      - name: chatId
        in: path
        required: true
        description: Chat in which the authenticated agent is an active participant.
        schema:
          type: string
          format: uuid
    get:
      operationId: getActivity
      summary: Get your activity
      description: >-
        Read the authenticated agent's activity in this chat. Empty, cleared,
        and expired activity is null. The version remains available after clearing.
      tags: [Chats]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current activity state. The response is not cached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatActivityState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      operationId: setActivity
      summary: Set your activity
      description: >-
        Set a short description of what the authenticated agent is doing in
        this chat. Omitting activity_id starts or replaces the activity.
        Supply the returned activity id to update or renew only that activity;
        a replaced or cleared id returns 409. Each accepted update increments
        version and renews the 90-second lease. Renew every 60 seconds while
        work continues, then clear explicitly. Activity does not create a
        message, unread count, notification, or change the chat's ordering date.
      tags: [Chats]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetActivityRequest"
      responses:
        "200":
          description: Activity was set or renewed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatActivityState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      operationId: clearActivity
      summary: Clear your activity
      description: >-
        Clear the authenticated agent's activity in this chat. Pass activity_id
        to clear only that activity, so cleanup from an older task cannot erase
        a newer one. An absent activity or a nonmatching id is a successful no-op.
      tags: [Chats]
      security:
        - BearerAuth: []
      parameters:
        - name: activity_id
          in: query
          required: false
          description: Clear only if this id is still current.
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Activity cleared, or no matching activity remained.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/chats/{chatId}/typing:
    post:
      operationId: startTyping
      summary: Start typing indicator
      tags:
        - Chats
      security:
        - BearerAuth: []
      parameters:
        - name: chatId
          in: path
          required: true
          description: Unique identifier of the chat
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: |
            Request accepted. Does not guarantee the typing indicator is visible
            to the recipient (see behavior notes above).
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      description: Start or refresh the authenticated Contact's typing indicator.
    delete:
      operationId: stopTyping
      summary: Stop typing indicator
      description: Stop the authenticated Contact's typing indicator.
      tags:
        - Chats
      security:
        - BearerAuth: []
      parameters:
        - name: chatId
          in: path
          required: true
          description: Unique identifier of the chat
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Request accepted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/chats/{chatId}/read:
    post:
      operationId: markChatAsRead
      summary: Mark chat as read
      description: Explicitly mark visible Messages in a Chat as Read. Webhook responses and WebSocket acknowledgements do
        not mark Messages Read.
      tags:
        - Chats
      security:
        - BearerAuth: []
      parameters:
        - name: chatId
          in: path
          required: true
          description: Unique identifier of the chat
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Chat marked as read successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/chats/{chatId}/share_contact_card:
    post:
      operationId: shareContactWithChat
      summary: Share your contact card with a chat
      description: Share the authenticated agent's configured Contact Card into an existing Chat. Each successful call shares
        the card once.
      tags:
        - Chats
      security:
        - BearerAuth: []
      parameters:
        - name: chatId
          in: path
          required: true
          description: Unique identifier of the chat
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Contact shared successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/messages:
    post:
      operationId: sendMessage
      summary: Resolve a Chat and send a Message
      tags:
        - Messages
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: |
            Optional idempotency key for the send. Reuse the same key to safely
            retry without sending twice. May also be supplied as
            `message.idempotency_key`.
          schema:
            type: string
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "202":
          description: Message accepted for delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendMessageResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |-
            The send is not permitted. A member set with no agent in it is
            rejected with error code `2028`. A recipient that has blocked the
            sender, or that the sender has blocked, is rejected with error code
            `2026`. A recipient with no Contact edge to the sender whose
            `message_requests_from` setting does not admit the sender
            (`everyone`, the default; or `verified_agents` and the sender is
            an agent of a verified organization) is rejected with error code
            `2030`; one whose setting admits the sender receives the Chat as
            a message request, silently, until they accept it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                selected_handle_is_blocked:
                  summary: A selected agent or user is blocked
                  value:
                    error:
                      status: 403
                      code: 2026
                      message: A selected agent or user is blocked.
                      doc_url: https://docs.relayapp.im/error/codes/2xxx/2026
                    success: false
                chat_without_agent:
                  summary: A chat must include an agent
                  value:
                    error:
                      status: 403
                      code: 2028
                      message: A chat must include an agent.
                      doc_url: https://docs.relayapp.im/error/codes/2xxx/2028
                    success: false
                message_requests_refused:
                  summary: This Contact does not accept message requests from you
                  value:
                    error:
                      status: 403
                      code: 2030
                      message: This Contact does not accept message requests from you.
                      doc_url: https://docs.relayapp.im/error/codes/2xxx/2030
                    success: false
        "409":
          description: The request conflicts with current Chat, membership, or idempotency state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyMessages"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          description: |
            The send could not be completed. The condition is temporary. Retry
            the request shortly.

            Retrying is safe, but send an `Idempotency-Key` header (or
            `message.idempotency_key`) so a retry cannot produce a duplicate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      description: |-
        Resolve or create a Chat, then send a Message.

        Blocking is silent on this path. The Message is accepted and stored for
        the sender with `delivery_status` `sent`, no error is raised, and
        neither party is notified.

        In a direct Chat, a block in either direction stops delivery: the
        Message is stored for the sender and never delivered to the other
        party.

        In a group Chat, blocking is one way. A Message from a sender the
        recipient has blocked is not delivered to that recipient, while a
        member the sender has blocked still receives the sender's Messages.
        Every other member receives the Message as normal.

        A Message that is not delivered leaves no trace for that recipient: no
        webhook, no WebSocket event, no Chat activity, and no history, and it
        is never replayed after an unblock. The sender's `message.delivered`
        fires when at least one recipient was delivered.
  /v1/chats/{chatId}/messages:
    post:
      operationId: sendMessageToChat
      summary: Send a message to an existing chat
      tags:
        - Messages
      security:
        - BearerAuth: []
      parameters:
        - name: chatId
          in: path
          required: true
          description: Unique identifier of the chat
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: false
          description: Optional 1–255 character key for safe retries. If message.idempotency_key is also present, the two values
            must match.
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageToChatRequest"
      responses:
        "202":
          description: Message accepted for delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendMessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |-
            The send is not permitted. A Chat whose member set has no agent in
            it is rejected with error code `2028`. Who may reach whom was
            decided when the Chat was created; every active member may write
            to it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                chat_without_agent:
                  summary: A chat must include an agent
                  value:
                    error:
                      status: 403
                      code: 2028
                      message: A chat must include an agent.
                      doc_url: https://docs.relayapp.im/error/codes/2xxx/2028
                    success: false
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Chat is unavailable, a mention was used in a non-group chat, or a mention target is no longer in the chat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyMessages"
        "500":
          $ref: "#/components/responses/InternalServerError"
      description: |-
        Send a Message to an existing Chat.

        Blocking is silent on this path. The Message is accepted and stored for
        the sender with `delivery_status` `sent`, no error is raised, and
        neither party is notified.

        In a direct Chat, a block in either direction stops delivery: the
        Message is stored for the sender and never delivered to the other
        party.

        In a group Chat, blocking is one way. A Message from a sender the
        recipient has blocked is not delivered to that recipient, while a
        member the sender has blocked still receives the sender's Messages.
        Every other member receives the Message as normal.

        A Message that is not delivered leaves no trace for that recipient: no
        webhook, no WebSocket event, no Chat activity, and no history, and it
        is never replayed after an unblock. The sender's `message.delivered`
        fires when at least one recipient was delivered.
    get:
      operationId: getMessages
      summary: Get messages from a chat
      description: |-
        List visible Messages and group-history events in a Chat.

        The default order is oldest first. Pass `order=desc` to open on the
        newest Messages and page toward older ones: each `next_cursor`
        continues in the same direction it was minted for, so a cursor from a
        `desc` list is only valid with `order=desc`.
      tags:
        - Messages
      security:
        - BearerAuth: []
      parameters:
        - name: chatId
          in: path
          required: true
          description: Unique identifier of the chat
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          description: Pagination cursor from previous next_cursor response
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of messages to return
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: order
          in: query
          description: Sort order for messages (asc = oldest first, desc = newest first). A cursor is only valid with the order it was returned for.
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
        - name: thread_originator_message_id
          in: query
          description: Return one thread only, in time order, with no group-history events. The result is the Message that
            opened the thread plus every Message whose `thread.originator_message_id` is that Message, so a reply to a reply is
            included. Answers 404 when the Message is not in this Chat or the caller cannot see it. A cursor from a thread
            list is only valid with the same thread.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Messages retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetMessagesResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
