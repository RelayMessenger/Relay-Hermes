          items:
            $ref: "#/components/schemas/Message"
        next_cursor:
          type:
            - string
            - "null"
          description: |
            Cursor for fetching the next page of results.
            Null if there are no more results to fetch.
            Pass this value as the `cursor` parameter in the next request.
    GetThreadResponse:
      type: object
      description: Response containing messages in a thread with pagination
      required:
        - messages
      properties:
        messages:
          type: array
          description: Messages in the thread, ordered by the specified order parameter
          items:
            $ref: "#/components/schemas/Message"
        next_cursor:
          type:
            - string
            - "null"
          description: Cursor for fetching the next page of results (null if no more results)
    ButtonItem:
      type: object
      description: |
        One button in a `buttons` part. A tap on a plain button sends its
        `label` back as the person's next message: one `text` part whose value
        is the label, with `reply_to` naming the `buttons` part. A `url`
        button opens the page in the browser and sends nothing.
      required:
        - label
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          description: The page a link button opens instead of sending its label.
        label:
          type: string
          minLength: 1
          maxLength: 80
          description: The button's visible text, and what a tap sends
    ButtonItemResponse:
      type: object
      description: One button as read back
      required:
        - label
      properties:
        url:
          type: string
        label:
          type: string
    ButtonsPart:
      type: object
      description: |
        A vertical stack of 1 to 5 buttons drawn under the message. Only an
        agent can send one, and a message carries at most one. Send a `text`
        part beside it that asks the question. Reactions to this part return
        422. The only reply it accepts is a tap: one `text` part equal to one
        of its plain buttons' labels, sent by the user. The group disappears
        once the person taps a plain button, the way a quick reply does; a
        `url` button never puts it away, since its tap sends nothing.
      required:
        - type
        - items
      properties:
        type:
          type: string
          enum:
            - buttons
        items:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: "#/components/schemas/ButtonItem"
    ButtonsPartResponse:
      type: object
      description: A buttons part as read back
      required:
        - type
        - items
        - reactions
      properties:
        type:
          type: string
          enum:
            - buttons
        items:
          type: array
          items:
            $ref: "#/components/schemas/ButtonItemResponse"
        reactions:
          type:
            - array
            - "null"
          description: Reactions on this message part
          items:
            $ref: "#/components/schemas/Reaction"
    SelectionOption:
      type: object
      additionalProperties: false
      required: [value, label]
      properties:
        value:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
          description: Stable case-sensitive value, unique within the selection.
        label:
          type: string
          minLength: 1
          maxLength: 80
          description: Visible label, trimmed before storage.
    SelectionPart:
      type: object
      additionalProperties: false
      description: Agent-only multiselect prompt. One selection per Message, with nonblank text and no buttons. The text is the prompt's title. The person opens the prompt, checks any number of options and submits them once; checking sends nothing and only the submit does. A person answers a given selection once, and reopening it afterwards shows what they chose without letting them change it.
      required: [type, options]
      properties:
        type:
          type: string
          enum: [selection]
        options:
          type: array
          minItems: 1
          maxItems: 25
          items:
            $ref: "#/components/schemas/SelectionOption"
    SelectionPartResponse:
      type: object
      required: [type, options, has_responded, selected_values, reactions]
      properties:
        type:
          type: string
          enum: [selection]
        options:
          type: array
          items:
            $ref: "#/components/schemas/SelectionOption"
        selected_values:
          type: [array, "null"]
          readOnly: true
          items:
            type: string
          description: The values the authenticated viewer chose, in source-option order, identical on every one of that user's devices; null until the viewer answers, when the answer Message no longer exists, and always for an agent viewer.
        has_responded:
          type: boolean
          readOnly: true
          description: Whether the authenticated viewer has durably answered this part. Claims are scoped to the responding user, never to an agent viewer. Existing Chat admission rules still apply, including at most one user per Chat. Acceptance advances this viewer's Message updated_at and sends a message.upserted for the source prompt to this user's devices.
        reactions:
          type: "null"
    SelectionResponsePart:
      type: object
      additionalProperties: false
      description: User-only metadata, exactly the second part after plain text. Requires explicit reply_to message_id and part_index targeting a visible selection in the same Chat. Values are unique, nonempty, known and in source-option order. Canonical new text is literal '• ' + each selected source label joined with '\n'. The server also accepts exact legacy source labels joined with ', ' only for compatibility; arbitrary label parsing is never accepted. selected_values and source-option order remain authoritative. iOS may draw a checkmark in place of each bullet, and repeat the prompt's title above the lines, as presentation only; portable text remains the bullets. A different-key second response returns 409/1005; same-key retries retain existing Message idempotency semantics.
      required: [type, selected_values]
      properties:
        type:
          type: string
          enum: [selection_response]
        selected_values:
          type: array
          minItems: 1
          maxItems: 25
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 100
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
    SelectionResponsePartResponse:
      allOf:
        - $ref: "#/components/schemas/SelectionResponsePart"
      description: Persisted selection metadata; contributes no fallback text and cannot receive reactions.
    PaymentRecurring:
      type: object
      additionalProperties: false
      description: A subscription's renewal cadence, read from its Stripe Price.
      required: [interval, interval_count]
      properties:
        interval:
          type: string
          enum: [day, week, month, year]
        interval_count:
          type: integer
          minimum: 1
          description: Intervals per renewal (3 with `month` is quarterly).
    PaymentStatus:
      type: string
      description: A payment request's lifecycle. It leaves `requested` exactly once, and only on Stripe's word or your cancel.
      enum: [requested, succeeded, canceled, expired]
    PaymentPart:
      type: object
      additionalProperties: false
      description: "A request to pay, drawn as a card. `checkout_url` is the only field: pass back exactly what `POST /v1/payment_requests` returned. The card's amount and title are read from that request, never from the message, so a card cannot show a figure its checkout will not charge. Sent only by the agent that created the request, while it is `requested`; must be the only part of its message. Another sender gets 403 (error code `2003`); a checkout_url that is not one of your requests gets 404; a request that is no longer `requested` gets 409. A request with `category=digital_goods` sent to a person whose devices report only storefronts outside the United States returns 422 (error code `2006`)."
      required: [type, checkout_url]
      properties:
        type:
          type: string
          enum: [payment]
        checkout_url:
          type: string
          maxLength: 2048
    PaymentPartResponse:
      type: object
      description: A payment card as every reader sees it, read from the payment request. `status` changes in place.
      required: [type, payment_request_id, checkout_url, amount, currency, description, category, mode, status, reactions]
      properties:
        type:
          type: string
          enum: [payment]
        payment_request_id:
          type: string
          format: uuid
        checkout_url:
          type: string
        amount:
          type: integer
          description: In the currency's minor units. For a subscription, what the first period costs.
        currency:
          type: string
        description:
          type: string
          description: The card's title line.
        category:
          $ref: "#/components/schemas/PaymentCategory"
        mode:
          type: string
          enum: [payment, subscription]
        recurring:
          $ref: "#/components/schemas/PaymentRecurring"
        image_url:
          type: string
          description: The request's product picture, when it has one; the card shows it.
        status:
          $ref: "#/components/schemas/PaymentStatus"
        reactions:
          type:
            - array
            - "null"
          description: Reactions on this message part. Only a person can react to a payment.
          items:
            $ref: "#/components/schemas/Reaction"
    PaymentReceiptPartResponse:
      type: object
      description: "The payer's receipt. When a payment request succeeds, Relay adds one message from the person who paid at the bottom of the chat, a reply to the `payment` card, carrying this part; your agent receives it as `message.received` like any message. The payer is the person who opened the payment in the Relay app, or, when Relay does not know who paid, the one person in a chat that holds the card. A group chat with no known payer gets no receipt. Expired and canceled requests add no message. Only Relay writes this part; sending one returns 400."
      required: [type, payment_request_id, description, amount, currency, mode, reactions]
      properties:
        type:
          type: string
          enum: [payment_receipt]
        payment_request_id:
          type: string
          format: uuid
        description:
          type: string
        amount:
          type: integer
          description: What was paid, in the currency's minor units. For a subscription, what the first period cost.
        currency:
          type: string
        mode:
          type: string
          enum: [payment, subscription]
        recurring:
          $ref: "#/components/schemas/PaymentRecurring"
        reactions:
          type:
            - array
            - "null"
          description: Reactions on this message part
          items:
            $ref: "#/components/schemas/Reaction"
    PaymentCategory:
      type: string
      enum: [physical_goods, digital_goods, donation]
      description: |-
        What is being paid for, the same three values as PayPal Orders v2 `items[].category` (PHYSICAL_GOODS, DIGITAL_GOODS, DONATION; developer.paypal.com/docs/api/orders/v2/). The App Store Review Guidelines (developer.apple.com/app-store/review/guidelines/) decide where each can be paid:
        - `physical_goods`: physical goods, and services used in the real world, such as a haircut or a ride (3.1.3(e)). Payable anywhere.
        - `digital_goods`: anything used in an app or online. A person pays by opening the link in Safari, and only on the United States storefront (3.1.1(a)); sending one to a person whose devices report only other storefronts returns 422 (error code `2006`). A tip to an agent or a creator is `digital_goods` (3.1.1: tips to digital content providers use In-App Purchase).
        - `donation`: money for a charity or a fundraiser. Collected outside the app, on any storefront (3.2.2(iv): such apps "may only collect funds outside of the app, such as via Safari…").
    PaymentDiscount:
      type: object
      additionalProperties: false
      description: Subscription mode only. One coupon or one promotion code from your connected Stripe account, never both.
      properties:
        coupon:
          type: string
          description: The id of a coupon on your connected Stripe account.
        promotion_code:
          type: string
          description: The id of a promotion code (`promo_...`), not the code a customer types.
        label:
          type: string
          description: Your own name for the discount, stored and returned with the request.
    CreatePaymentRequestRequest:
      type: object
      additionalProperties: false
      required: [description, category]
      properties:
        amount:
          type: integer
          description: Payment mode (required there). What to charge, in the currency's minor units; Stripe's minimum and maximum apply. Omit in subscription mode.
        currency:
          type: string
          pattern: '^[A-Za-z]{3}$'
          description: Payment mode (required there). A 3-letter ISO 4217 code, returned lowercase. Omit in subscription mode; the price carries it.
        description:
          type: string
          minLength: 1
          maxLength: 32
          description: The card's title line and the checkout's product name. Trimmed; 1 to 32 characters.
        category:
          $ref: "#/components/schemas/PaymentCategory"
        metadata:
          type: object
          maxProperties: 49
          additionalProperties:
            type: string
          description: Up to 49 keys of your own, returned on the request and on every `payment.*` event, and stamped on the Stripe objects created on your account. Keys starting with `relay_` are reserved; Relay adds `relay_payment_request_id`.
        mode:
          type: string
          enum: [payment, subscription]
          default: payment
          description: "`payment` collects one charge of `amount` in `currency`. `subscription` starts an auto-renewing subscription from a recurring `price_id` on your connected Stripe account; the person pays the first period at checkout and Stripe renews it from then on."
        price_id:
          type: string
          description: Subscription mode (required there). An active recurring Price on your connected Stripe account.
        quantity:
          type: integer
          minimum: 1
          description: Subscription mode only. Units of the price. Defaults to 1.
        customer_id:
          type: string
          description: An existing Customer on your connected Stripe account (`cus_...`) to attach the request to.
        discount:
          $ref: "#/components/schemas/PaymentDiscount"
        image_url:
          type: string
          maxLength: 2048
          description: "Optional product picture, an HTTPS address, like Telegram sendInvoice `photo_url` (core.telegram.org/bots/api#sendinvoice). Relay copies it into its own image store, the way it stores agent pictures, and returns Relay's address. Shown on the card and on the pay page."
    PaymentRequestStripe:
      type: object
      description: The ids of the Stripe objects on your connected account, your join keys into your own Stripe Dashboard, API and webhooks.
      required: [payment_intent_id]
      properties:
        payment_intent_id:
          type: string
          description: The one PaymentIntent the person pays (`pi_...`).
        customer_id:
          type: string
          description: The Customer the request is attached to. Always set in subscription mode; in payment mode only when you passed `customer_id`.
        subscription_id:
          type: string
          description: Subscription mode (`sub_...`).
    PaymentRequest:
      type: object
      required: [id, object, status, mode, amount, currency, description, category, checkout_url, expires_at, metadata, stripe, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        object:
          type: string
          enum: [payment_request]
        status:
          $ref: "#/components/schemas/PaymentStatus"
        mode:
          type: string
          enum: [payment, subscription]
        amount:
          type: integer
          description: What the person is charged at checkout, in minor units. In subscription mode, what the first period costs after any discount.
        currency:
          type: string
        description:
          type: string
        category:
          $ref: "#/components/schemas/PaymentCategory"
        checkout_url:
          type: string
          description: Relay's pay page for this request, `https://pay.relayapp.im/<token>`. Anyone holding it can pay the request. Send it back unchanged in a `payment` part.
        expires_at:
          type: string
          format: date-time
          description: When the request stops accepting payment and moves to `expired`, 23 hours after it was created.
        metadata:
          type: object
          additionalProperties:
            type: string
        image_url:
          type: string
          description: The product picture, on Relay's image host. Absent without one.
        price_id:
          type: string
          description: Subscription mode.
        quantity:
          type: integer
          description: Subscription mode.
        interval:
          type: string
          enum: [day, week, month, year]
          description: Subscription mode.
        interval_count:
          type: integer
          description: Subscription mode.
        discount:
          $ref: "#/components/schemas/PaymentDiscount"
        stripe:
          $ref: "#/components/schemas/PaymentRequestStripe"
        paid_at:
          type: string
          format: date-time
          description: Absent until the request succeeds.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PaymentRequestList:
      type: object
      required: [payment_requests, next_cursor]
      properties:
        payment_requests:
          type: array
          items:
            $ref: "#/components/schemas/PaymentRequest"
        next_cursor:
          type:
            - string
            - "null"
    PaymentSucceededWebhook:
      allOf:
        - $ref: "#/components/schemas/WebhookEnvelopeBase"
        - type: object
          required:
            - event_type
            - data
