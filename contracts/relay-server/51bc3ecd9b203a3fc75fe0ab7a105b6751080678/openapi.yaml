        display_name:
          type:
            - string
            - "null"
          description: "Display name for the chat. When nobody has named it, the other participants' names: \"Alice\",
            \"Alice & Bob\", or \"Alice, Bob & Cleo\". Can be updated for group chats."
        group_chat_icon:
          type:
            - string
            - "null"
          format: uri
