    SetActivityRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 1024
          x-max-graphemes: 21
          x-max-utf8-bytes: 1024
          description: One line of 1 to 21 visible characters, at most 1024 UTF-8 bytes. Surrounding whitespace is removed.
          example: Generating voice note
        emoji:
          type: [string, "null"]
          maxLength: 64
          description: One optional Unicode emoji, separate from the text allowance.
          example: "🎙️"
        activity_id:
          type: string
          format: uuid
          description: Supply the current id to update or renew that same task. Omit to start or replace.
    ChatActivity:
      type: object
      required: [id, text, emoji, updated_at, expires_at]
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of this activity, retained when it is renewed.
        text:
          type: string
          description: Current short activity description.
        emoji:
          type: [string, "null"]
          description: Optional Unicode emoji.
        updated_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: Hide the activity at this time unless a newer renewal has arrived.
    ChatActivityState:
      type: object
      required: [chat_id, agent_id, version, activity]
      properties:
        chat_id:
          type: string
          format: uuid
        agent_id:
          type: string
          format: uuid
          description: Agent Contact that owns the activity in this chat.
        version:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          description: Monotonically increasing state version, retained after clearing.
        activity:
          anyOf:
            - $ref: "#/components/schemas/ChatActivity"
            - type: "null"
    ChatHandle:
      type: object
      required:
        - id
        - handle
        - joined_at
        - kind
        - display_name
        - image_url
        - image_color
        - subtitle
        - verified
        - is_contact
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for this handle
        handle:
          type: string
          description: Relay Handle.
        status:
          type:
            - string
            - "null"
          description: Participant status
          enum:
            - active
            - left
            - removed
          default: active
        joined_at:
          type: string
          format: date-time
          description: When this participant joined the chat
        left_at:
          type:
            - string
            - "null"
          format: date-time
          description: When they left (if applicable)
        is_me:
          type:
            - boolean
            - "null"
          description: Whether this handle is the authenticated caller.
        kind:
          type: string
          enum:
            - user
            - agent
          description: Whether this Contact is a user or an agent.
        display_name:
          type:
            - string
            - "null"
          description: Current Contact display name.
        image_url:
          type:
            - string
            - "null"
          format: uri
          description: >-
            Current Contact picture, as a permanent address served by Relay.
            It does not expire and may be cached indefinitely.
        image_color:
          type:
            - string
            - "null"
          pattern: ^[0-9A-F]{6}$
          description: >-
            Dominant colour of the picture at image_url, six uppercase hex
            digits, computed by Relay once when the picture is set. Null when
            Relay could not read the picture.
        subtitle:
          type:
            - string
            - "null"
          maxLength: 60
          description: The one line under an agent's name. User Contacts return null.
        verified:
          type: boolean
          description: Whether Relay has verified this agent.
        is_contact:
          type: boolean
          description: >-
            Whether the caller holds this member as a Contact. A person's reply
            or adding the agent makes it a Contact. Removing a Contact keeps
            an existing conversation in Chats until another incoming message
            makes it a message request.
        activity_version:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          description: Activity state version for this participant in this chat. Older versions must not replace newer state.
        activity:
          description: Current activity in this chat. Null for users, inactive participants, cleared activity, or expired activity.
          anyOf:
            - $ref: "#/components/schemas/ChatActivity"
            - type: "null"
    ChatInfo:
