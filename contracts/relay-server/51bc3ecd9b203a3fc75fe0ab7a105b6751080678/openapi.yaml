  /v1/payment_requests/{paymentRequestId}/cancel:
    post:
      operationId: cancelPaymentRequest
      summary: Cancel a payment request
      description: |
        Cancel a request that has not been paid: its PaymentIntent is
        canceled (in subscription mode, the first-period invoice is voided and
        the incomplete Subscription canceled), the request moves to
        `canceled`, every card that carries it changes in place, and your
        agent gets `payment.canceled`. A request that is already `succeeded`,
        `canceled` or `expired`, or that was paid before the cancel reached
        Stripe, returns 409.
      tags:
        - Payments
      security:
        - BearerAuth: []
      parameters:
        - name: paymentRequestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The canceled payment request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AgentOnly"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
