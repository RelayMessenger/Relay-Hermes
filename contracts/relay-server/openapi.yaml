              $ref: "#/components/schemas/PaymentRequest"
    PaymentCanceledWebhook:
      allOf:
        - $ref: "#/components/schemas/WebhookEnvelopeBase"
        - type: object
          required:
            - event_type
            - data
          properties:
            event_type:
              type: string
              const: payment.canceled
            data:
              $ref: "#/components/schemas/PaymentRequest"
    PaymentExpiredWebhook:
      allOf:
        - $ref: "#/components/schemas/WebhookEnvelopeBase"
        - type: object
          required:
            - event_type
            - data
          properties:
            event_type:
              type: string
              const: payment.expired
            data:
              $ref: "#/components/schemas/PaymentRequest"
    LinkPart:
      type: object
      required:
        - type
        - value
      properties:
        type:
          type: string
          enum:
            - link
          description: Indicates this is a rich link preview part
        value:
          type: string
          format: uri
          description: |
            URL to send with a rich link preview. The recipient will see an inline card
            with the page's title, description, and preview image (when available).

            A `link` part must be the **only** part in the message. To send a URL as plain
            text (no preview card), use a `text` part instead.
          minLength: 1
          maxLength: 2048
    LinkPartResponse:
      type: object
      description: A rich link preview part
      required:
        - type
        - value
        - reactions
      properties:
        type:
          type: string
          enum:
            - link
          description: Indicates this is a rich link preview part
        value:
          type: string
          description: The URL
        reactions:
          type:
            - array
            - "null"
          description: Reactions on this message part
          items:
            $ref: "#/components/schemas/Reaction"
    AgentAccessRule:
      type: string
      description: "`allow` is Always Allow; `deny` is Never Allow."
      enum:
        - allow
        - deny
    OAuth2Scope:
      type: string
      description: >-
        An OpenID Connect scope a Log in with Relay client may ask for.
        `birthdate` asks for the person's birthday as the OpenID `birthdate`
        claim (YYYY-MM-DD, or 0000-MM-DD when they gave no year).
      enum:
        - openid
        - profile
        - email
        - phone
        - birthdate
    OAuth2Client:
      type: object
      additionalProperties: false
      required: [client_id, redirect_uris, scopes, created_at, updated_at]
      properties:
        client_id:
          type: string
          description: The agent's ID.
        redirect_uris:
          type: array
          items:
            type: string
            format: uri
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/OAuth2Scope"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    OAuth2ClientResponse:
      type: object
      additionalProperties: false
      required: [client]
      properties:
        client:
          $ref: "#/components/schemas/OAuth2Client"
        client_secret:
          type: string
          description: The client secret, starting `rel_cs_`. Present only when the client was just made or its secret was just reset.
    AgentAccessLists:
      type: object
      additionalProperties: false
      required:
        - allow
        - deny
      properties:
        allow:
          type: array
          description: Always Allow, newest first.
          items:
            $ref: "#/components/schemas/ContactLookup"
        deny:
          type: array
          description: Never Allow, newest first.
          items:
            $ref: "#/components/schemas/ContactLookup"
    ListBlockedHandlesResult:
      type: object
      required:
        - blocked_handles
      properties:
        blocked_handles:
          type: array
          description: Contacts blocked by the authenticated Contact, newest first.
          items:
            $ref: "#/components/schemas/BlockedHandleEntry"
    ListChatsResult:
      type: object
      required:
        - chats
      properties:
        chats:
          type: array
          description: List of chats
          items:
            $ref: "#/components/schemas/Chat"
        next_cursor:
          type:
            - string
            - "null"
          description: |
            Cursor for fetching the next page of results.
            Null if there are no more results to fetch.
            Pass this value as the `cursor` parameter in the next request.
    ListWebhookSubscriptionsResult:
      type: object
      required:
        - subscriptions
      properties:
        subscriptions:
          type: array
          description: List of webhook subscriptions
          items:
            $ref: "#/components/schemas/WebhookSubscriptionResponse"
    MediaPart:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - media
          description: Indicates this is a media attachment part
        url:
          type: string
          format: uri
          description: Public HTTPS media URL. Relay blocks non-public networks and validates every redirect, response status,
            and declared and actual size. Any file type is accepted; a host that declares no usable Content-Type
            is stored as application/octet-stream.
          pattern: ^https://
        attachment_id:
          type: string
          format: uuid
          description: Reference an Attachment allocated through POST /v1/attachments. Use either url or attachment_id, not both.
    MediaPartResponse:
      type: object
      description: A media attachment part
      required:
        - type
        - id
        - url
        - filename
        - mime_type
        - size_bytes
        - reactions
      properties:
        type:
          type: string
          enum:
            - media
          description: Indicates this is a media attachment part
        id:
          type: string
          format: uuid
          description: Unique attachment identifier
        url:
          type: string
          format: uri
          description: Opaque Relay download URL for the Attachment.
        filename:
          type: string
          description: Original filename
        mime_type:
          type: string
          description: MIME type of the file
        size_bytes:
          type: integer
          description: File size in bytes
        reactions:
          type:
            - array
            - "null"
          description: Reactions on this message part
          items:
            $ref: "#/components/schemas/Reaction"
        duration_ms:
          type:
            - integer
            - "null"
          minimum: 0
          description: Audio or video duration in milliseconds when known.
        width:
          type:
            - integer
            - "null"
          minimum: 1
          description: Pixel width when known. Width and height are supplied together.
        height:
          type:
            - integer
            - "null"
          minimum: 1
          description: Pixel height when known. Width and height are supplied together.
    Message:
      type: object
      required:
        - id
        - chat_id
        - is_from_me
        - delivery_status
        - created_at
        - updated_at
        - is_system_message
      properties:
        id:
          type: string
          description: Unique identifier for the message
          format: uuid
        chat_id:
          type: string
          description: ID of the chat this message belongs to
          format: uuid
        from:
          deprecated: true
          type:
            - string
            - "null"
          description: Use from_handle instead.
        from_handle:
          description: The sender of this message as a full handle object
          oneOf:
            - $ref: "#/components/schemas/ChatHandle"
            - type: "null"
        parts:
          type:
            - array
            - "null"
          description: Message parts in order (text, media, and link)
          items:
            oneOf:
              - $ref: "#/components/schemas/TextPartResponse"
              - $ref: "#/components/schemas/MediaPartResponse"
              - $ref: "#/components/schemas/LinkPartResponse"
              - $ref: "#/components/schemas/ButtonsPartResponse"
              - $ref: "#/components/schemas/SelectionPartResponse"
              - $ref: "#/components/schemas/FormPartResponse"
              - $ref: "#/components/schemas/FormResponsePartResponse"
              - $ref: "#/components/schemas/SelectionResponsePartResponse"
              - $ref: "#/components/schemas/RichCardPartResponse"
              - $ref: "#/components/schemas/CarouselPartResponse"
              - $ref: "#/components/schemas/SuggestionResponsePartResponse"
              - $ref: "#/components/schemas/PaymentPartResponse"
              - $ref: "#/components/schemas/PaymentReceiptPartResponse"
              - $ref: "#/components/schemas/LocationRequestPartResponse"
              - $ref: "#/components/schemas/RatingRequestPartResponse"
              - $ref: "#/components/schemas/LocationPartResponse"
              - $ref: "#/components/schemas/PlacePartResponse"
              - $ref: "#/components/schemas/SystemPartResponse"
        reply_to:
          oneOf:
            - $ref: "#/components/schemas/ReplyTo"
            - type: "null"
        thread:
          description: The thread this Message belongs to, or null when it is not a reply.
          oneOf:
            - $ref: "#/components/schemas/ThreadOriginator"
            - type: "null"
        is_from_me:
          type: boolean
          description: Whether this message was sent by the authenticated user
        delivery_status:
          $ref: "#/components/schemas/DeliveryStatus"
        created_at:
          type: string
          format: date-time
          description: When the message was created
        updated_at:
          type: string
          format: date-time
          description: When the message was last updated
        sent_at:
          type:
            - string
            - "null"
          format: date-time
          description: When the message was sent
        delivered_at:
          type:
            - string
            - "null"
          format: date-time
          description: When Relay accepted and stored the Message. For a committed Message, this is the same instant as
            created_at.
        read_at:
          type:
            - string
            - "null"
          format: date-time
          description: When the message was read
        silent:
          type: boolean
          description: Whether the sender sent this Message silently, so the recipient's device showed no banner and played
            no sound.
        deliveries:
          type: array
          items:
            $ref: "#/components/schemas/MessageDelivery"
          description: Per-recipient Delivered and Read truth for direct and group Chats. Relay derives this because it controls
            every recipient endpoint.
        is_system_message:
          type: boolean
          description: Whether this timeline item is a visible Chat event.
        system_event:
          oneOf:
            - $ref: "#/components/schemas/SystemEvent"
            - type: "null"
    MessageContent:
      type: object
      description: One message containing 1–100 ordered parts. A link must be the only part. A selection needs no text part; it carries its own `title`, and a text part beside it is an ordinary message. Selection responses contain exactly plain text then selection_response metadata and require an explicit reply target. A message carries at most one rich_card or carousel; a card reply is exactly plain text then suggestion_response, replying to the card part. Form responses contain exactly Form sent plain text then form_response metadata with answers keyed by field id, and require an explicit reply target.
      properties:
        parts:
          x-go-type-skip-optional-pointer: true
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/MessagePart"
        reply_to:
          $ref: "#/components/schemas/ReplyTo"
          description: Reply to another message to create a threaded conversation
        idempotency_key:
          type: string
          description: Optional key for a safe retry. The same authenticated sender, key, and Message body return the original
            Message. Reusing the key with a different body returns a conflict.
          maxLength: 255
        silent:
          type: boolean
          default: false
          description: Send the Message with no banner and no sound on the recipient's device. The Message still arrives,
            still counts as unread, and still moves the Chat to the top of the list.
      required:
        - parts
    MessageDeliveredWebhook:
      description: Complete webhook payload for message.delivered events (2026-08-30 format)
      allOf:
        - $ref: "#/components/schemas/WebhookEnvelopeBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/MessageEvent"
    MessageDelivery:
      type: object
      additionalProperties: false
      required:
        - contact
        - delivered_at
        - read_at
      properties:
        contact:
          $ref: "#/components/schemas/ChatHandle"
          description: Message recipient whose commit-time Delivered timestamp and explicit Read timestamp this row records.
        delivered_at:
          type:
            - string
            - "null"
          format: date-time
          description: When Relay accepted and stored the Message. Relay stamps the same Message commit time for every
            recipient.
        read_at:
          type:
            - string
            - "null"
          format: date-time
          description: When this recipient marked the Chat Read. Read implies Delivered.
    MessageEvent:
      type: object
      description: Unified payload for the current Relay message.sent, message.received, message.delivered, and message.read
        webhooks. direction is relative to the receiving agent.
      required:
        - chat
        - id
        - direction
        - sender_handle
        - parts
      properties:
        chat:
          type: object
          description: The chat this message belongs to. id equals chat_id; is_group tells a direct chat from a group.
          required:
            - id
          properties:
            id:
              type: string
              format: uuid
              description: Chat identifier
            is_group:
              type:
                - boolean
                - "null"
              description: Whether this is a group chat
            owner_handle:
              oneOf:
                - $ref: "#/components/schemas/ChatHandle"
                - type: "null"
        id:
          type: string
          format: uuid
          description: Message identifier
        idempotency_key:
          type:
            - string
            - "null"
          description: Idempotency key for deduplication of outbound messages.
        direction:
          type: string
          description: Message direction - "outbound" if sent by you, "inbound" if received
          enum:
            - inbound
            - outbound
        sender_handle:
          deprecated: true
          description: The handle that sent this message. Use from_handle instead, which matches the Message object.
          oneOf:
            - $ref: "#/components/schemas/ChatHandle"
            - type: "null"
        chat_id:
          type: string
          description: ID of the chat this message belongs to
          format: uuid
        from:
          deprecated: true
          type:
            - string
            - "null"
          description: Use from_handle instead.
        from_handle:
          description: The sender of this message as a full handle object
          oneOf:
            - $ref: "#/components/schemas/ChatHandle"
            - type: "null"
        is_from_me:
          type: boolean
          description: Whether the agent receiving this event sent this message. Same value as the Message object's is_from_me.
        parts:
          type: array
          description: Message parts (text and/or media)
          items:
            oneOf:
              - $ref: "#/components/schemas/schemas-TextPartResponse"
              - $ref: "#/components/schemas/schemas-MediaPartResponse"
              - $ref: "#/components/schemas/schemas-LinkPartResponse"
              - $ref: "#/components/schemas/ButtonsPartResponse"
              - $ref: "#/components/schemas/SelectionPartResponse"
              - $ref: "#/components/schemas/FormPartResponse"
              - $ref: "#/components/schemas/FormResponsePartResponse"
              - $ref: "#/components/schemas/SelectionResponsePartResponse"
              - $ref: "#/components/schemas/RichCardPartResponse"
              - $ref: "#/components/schemas/CarouselPartResponse"
              - $ref: "#/components/schemas/SuggestionResponsePartResponse"
              - $ref: "#/components/schemas/PaymentPartResponse"
              - $ref: "#/components/schemas/PaymentReceiptPartResponse"
              - $ref: "#/components/schemas/LocationRequestPartResponse"
              - $ref: "#/components/schemas/RatingRequestPartResponse"
              - $ref: "#/components/schemas/LocationPartResponse"
              - $ref: "#/components/schemas/PlacePartResponse"
            discriminator:
              propertyName: type
              mapping:
                text: "#/components/schemas/schemas-TextPartResponse"
                media: "#/components/schemas/schemas-MediaPartResponse"
                link: "#/components/schemas/schemas-LinkPartResponse"
                buttons: "#/components/schemas/ButtonsPartResponse"
                selection: "#/components/schemas/SelectionPartResponse"
                form: "#/components/schemas/FormPartResponse"
                form_response: "#/components/schemas/FormResponsePartResponse"
                selection_response: "#/components/schemas/SelectionResponsePartResponse"
                rich_card: "#/components/schemas/RichCardPartResponse"
                carousel: "#/components/schemas/CarouselPartResponse"
                suggestion_response: "#/components/schemas/SuggestionResponsePartResponse"
                payment: "#/components/schemas/PaymentPartResponse"
                payment_receipt: "#/components/schemas/PaymentReceiptPartResponse"
                location_request: "#/components/schemas/LocationRequestPartResponse"
                rating_request: "#/components/schemas/RatingRequestPartResponse"
                location: "#/components/schemas/LocationPartResponse"
                place: "#/components/schemas/PlacePartResponse"
        sent_at:
          type:
            - string
            - "null"
          format: date-time
          description: When the message was sent. Null if not yet sent.
        delivered_at:
          type:
            - string
            - "null"
          format: date-time
          description: When Relay accepted and stored the Message. Null only before server commit.
        read_at:
          type:
            - string
            - "null"
          format: date-time
          description: When the message was read. Null if not yet read.
        silent:
          type: boolean
          description: Whether the sender sent this Message silently, so the recipient's device showed no banner and played
            no sound.
        reply_to:
          type:
            - object
            - "null"
          description: Reference to the message this is replying to (for threaded replies)
          properties:
            message_id:
              type: string
              format: uuid
              description: ID of the message being replied to
            part_index:
              type: integer
              format: int32
              minimum: 0
              description: Index of the part being replied to
        thread:
          description: The thread this Message belongs to, or null when it is not a reply.
          oneOf:
            - $ref: "#/components/schemas/ThreadOriginator"
            - type: "null"
    MessagePart:
      type: object
      required:
        - type
      discriminator:
        propertyName: type
        mapping:
          text: "#/components/schemas/TextPart"
          media: "#/components/schemas/MediaPart"
          link: "#/components/schemas/LinkPart"
          buttons: "#/components/schemas/ButtonsPart"
          selection: "#/components/schemas/SelectionPart"
          form: "#/components/schemas/FormPart"
          form_response: "#/components/schemas/FormResponsePart"
          selection_response: "#/components/schemas/SelectionResponsePart"
          rich_card: "#/components/schemas/RichCardPart"
          carousel: "#/components/schemas/CarouselPart"
          suggestion_response: "#/components/schemas/SuggestionResponsePart"
          payment: "#/components/schemas/PaymentPart"
          place: "#/components/schemas/PlacePart"
          rating_request: "#/components/schemas/RatingRequestPart"
      oneOf:
        - $ref: "#/components/schemas/TextPart"
        - $ref: "#/components/schemas/MediaPart"
        - $ref: "#/components/schemas/LinkPart"
        - $ref: "#/components/schemas/ButtonsPart"
        - $ref: "#/components/schemas/SelectionPart"
        - $ref: "#/components/schemas/FormPart"
        - $ref: "#/components/schemas/FormResponsePart"
        - $ref: "#/components/schemas/SelectionResponsePart"
        - $ref: "#/components/schemas/RichCardPart"
        - $ref: "#/components/schemas/CarouselPart"
        - $ref: "#/components/schemas/SuggestionResponsePart"
        - $ref: "#/components/schemas/PaymentPart"
        - $ref: "#/components/schemas/PlacePart"
        - $ref: "#/components/schemas/RatingRequestPart"
    MessageReadWebhook:
      description: Complete webhook payload for message.read events (2026-08-30 format)
      allOf:
        - $ref: "#/components/schemas/WebhookEnvelopeBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/MessageEvent"
    MessageReceivedWebhook:
      description: Complete webhook payload for message.received events (2026-08-30 format)
      allOf:
        - $ref: "#/components/schemas/WebhookEnvelopeBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/MessageEvent"
    MessageSentWebhook:
      description: Complete webhook payload for message.sent events (2026-08-30 format)
      allOf:
        - $ref: "#/components/schemas/WebhookEnvelopeBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/MessageEvent"
    MessageFailedEvent:
      type: object
      description: |-
        Error details for message.failed webhook events.

        Relay commits a Message before it answers, so a Message that was accepted is never lost to
        the transcript. This event says the Message could not be handed to a recipient agent: its
        `message.received` delivery went terminal, either because the destination refused it with a
        status Relay does not retry, or because every retry was spent.
      required:
        - code
        - failed_at
      properties:
        chat_id:
          type: string
          format: uuid
          description: Chat identifier
        message_id:
          type: string
          format: uuid
          description: Message identifier
        code:
          $ref: "#/components/schemas/ErrorCode"
        reason:
          type: string
          description: Human-readable description of the failure
        detail_code:
          type:
            - integer
            - "null"
          description: |-
            Opaque diagnostic identifying the specific failure class within `code` - the last HTTP
            status the destination answered with, or null when it never answered. Log it and
            include it in support requests, but do not branch on it.
        failed_at:
          type: string
          format: date-time
          description: When the failure was detected
    MessageFailedWebhook:
      description: Complete webhook payload for message.failed events (2026-08-30 format)
      allOf:
        - $ref: "#/components/schemas/WebhookEnvelopeBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/MessageFailedEvent"
    ParticipantAddedEvent:
      type: object
      description: Payload for participant.added webhook events
      required:
        - chat_id
        - participant
        - added_at
      properties:
        chat_id:
          type: string
          description: Chat identifier (UUID) of the group chat
        participant:
          description: The added participant as a full handle object
          $ref: "#/components/schemas/ChatHandle"
        added_at:
          type: string
          format: date-time
          description: When the participant was added
    ParticipantAddedWebhook:
      description: Complete webhook payload for participant.added events
      allOf:
        - $ref: "#/components/schemas/WebhookEnvelopeBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ParticipantAddedEvent"
    ParticipantRemovedEvent:
      type: object
      description: Payload for participant.removed webhook events
      required:
        - chat_id
        - participant
        - removed_at
      properties:
        chat_id:
          type: string
          description: Chat identifier (UUID) of the group chat
        participant:
          description: The removed participant as a full handle object
          $ref: "#/components/schemas/ChatHandle"
        removed_at:
          type: string
          format: date-time
          description: When the participant was removed
    ParticipantRemovedWebhook:
      description: Complete webhook payload for participant.removed events
      allOf:
        - $ref: "#/components/schemas/WebhookEnvelopeBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ParticipantRemovedEvent"
    Reaction:
      type: object
      required:
        - is_me
        - handle
        - type
      properties:
        is_me:
          type: boolean
          description: Whether this reaction is from the current user
        handle:
          $ref: "#/components/schemas/ChatHandle"
        type:
          $ref: "#/components/schemas/ReactionType"
        custom_emoji:
          type:
            - string
            - "null"
          description: Custom emoji if type is "custom", null otherwise
    ReactionAddedEvent:
      description: Payload for reaction.added webhook events
      $ref: "#/components/schemas/ReactionEventBase"
    ReactionAddedWebhook:
      description: Complete webhook payload for reaction.added events
      allOf:
        - $ref: "#/components/schemas/WebhookEnvelopeBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ReactionAddedEvent"
    ReactionEventBase:
      type: object
      required:
        - chat_id
        - from_handle
        - message_id
        - part_index
        - reaction_type
        - is_from_me
        - reacted_at
      properties:
        chat_id:
          type: string
          description: Chat identifier (UUID)
        from_handle:
          description: The person who added/removed the reaction as a full handle object
          $ref: "#/components/schemas/ChatHandle"
        message_id:
          type: string
          description: Message identifier (UUID) that the reaction was added to or removed from
        part_index:
          type: integer
          format: int32
          minimum: 0
          description: Index of the message part that was reacted to (0-based)
        reaction_type:
          $ref: "#/components/schemas/ReactionType"
        custom_emoji:
          type:
            - string
            - "null"
          description: The actual emoji when reaction_type is "custom". Null for standard tapbacks.
        is_from_me:
          type: boolean
        reacted_at:
          type: string
          format: date-time
          description: When the reaction was added or removed
    ReactionRemovedEvent:
      description: Payload for reaction.removed webhook events
      $ref: "#/components/schemas/ReactionEventBase"
    ReactionRemovedWebhook:
      description: Complete webhook payload for reaction.removed events
      allOf:
        - $ref: "#/components/schemas/WebhookEnvelopeBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ReactionRemovedEvent"
    ReactionType:
      type: string
      description: Six standard tapbacks or a custom Unicode emoji.
      enum:
        - love
        - like
        - dislike
        - laugh
        - emphasize
        - question
        - custom
    RemoveParticipantRequest:
      type: object
      required:
        - handle
      properties:
        handle:
          type: string
          description: Relay Handle.
    ThreadOriginator:
      type: object
      description: The Message and part that opened a thread. A reply to a reply names the same originator as the Message it
        replied to, so every Message in one thread carries the same value. Withheld, as null on the Message, from a reader who
        cannot see the originator.
      required:
        - originator_message_id
        - originator_part_index
      properties:
        originator_message_id:
          type: string
          format: uuid
          description: ID of the Message that opened the thread.
        originator_part_index:
          type: integer
          format: int32
          minimum: 0
          description: Index of the originator's part that opened the thread (0-based).
    ReplyTo:
      type: object
      description: Indicates this message is a threaded reply to another message
      required:
        - message_id
      properties:
        message_id:
          type: string
          format: uuid
          description: The ID of the message to reply to
        part_index:
          type: integer
          format: int32
          description: |
            The specific message part to reply to (0-based index).
            Defaults to 0 (first part) if not provided.
            Use this when replying to a specific part of a multipart message.
            Targeting a `buttons` part returns 422 unless the message is a tap:
            one `text` part equal to one of that part's plain button labels,
            sent by the user. An agent's reply to a `buttons` part returns 403.
            A selection response must explicitly supply this index and target a
            `selection` part. Only a user may answer, with exactly plain text
            then `selection_response` metadata. Malformed shapes return 400/1005;
            mismatched source values, order or text return 422/2006; an already
            consumed selection with a different key returns 409/1005.
            Same-key retries return the original Message, under normal Message
            idempotency and authorization rules.
          minimum: 0
    RequestUploadRequest:
      type: object
      required:
        - filename
        - content_type
        - size_bytes
      properties:
        filename:
          type: string
          description: Name of the file to upload
          minLength: 1
          maxLength: 255
        content_type:
          type: string
          maxLength: 255
          pattern: "^[A-Za-z0-9!#$%&'*+.^_`|~-]+/[A-Za-z0-9!#$%&'*+.^_`|~-]+$"
          description: >-
            MIME type of the file, as `type/subtype`. Relay accepts any file
            type and stores the bytes unchanged; the declared type is lowercased
            and returned to the reader as sent.
        size_bytes:
          type: integer
          format: int64
          description: Size of the file in bytes (max 100MB)
          minimum: 1
          maximum: 104857600
        duration_ms:
          type:
            - integer
            - "null"
          minimum: 0
          description: >-
            Audio or video duration in milliseconds when known. Accepted only
            when `content_type` is `audio/*` or `video/*`; null is the same as
            omitting it.
        width:
          type:
            - integer
            - "null"
          minimum: 1
          description: >-
            Pixel width when known. Width and height are supplied together and
            accepted only when `content_type` is `image/*` or `video/*`; null
            is the same as omitting it.
        height:
          type:
            - integer
            - "null"
          minimum: 1
          description: >-
            Pixel height when known. Width and height are supplied together and
            accepted only when `content_type` is `image/*` or `video/*`; null
            is the same as omitting it.
    RequestUploadResult:
      type: object
      required:
        - attachment_id
        - upload_url
        - download_url
        - http_method
        - expires_at
        - required_headers
      properties:
        attachment_id:
          type: string
          description: Unique identifier for the attachment
          format: uuid
        upload_url:
          type: string
          format: uri
          description: Opaque Relay upload URL. PUT the raw bytes with the exact required_headers before expires_at.
        download_url:
          type: string
          format: uri
          description: Opaque Relay download URL for the Attachment.
        http_method:
          type: string
          description: HTTP method to use for upload (always PUT)
          enum:
            - PUT
        expires_at:
          type: string
          format: date-time
          description: When the upload URL expires (15 minutes from now)
        required_headers:
          type: object
          description: Exact HTTP headers required by the upload URL.
          additionalProperties:
            type: string
    SendMessageRequest:
      type: object
      description: Resolve or reuse the Chat for the recipient Handles, then send a Message as the authenticated Contact.
      required:
        - to
        - message
      properties:
        to:
          type: array
          minItems: 1
          maxItems: 6
          items:
            type: string
        message:
          description: The Message to send. Text, link, and media parts are supported. Voice memos use POST
            /v1/chats/{chatId}/voicememo.
          $ref: "#/components/schemas/MessageContent"
    SendMessageResponse:
      type: object
      description: Response for sending a message to a chat
      required:
        - chat_id
        - message
      properties:
        chat_id:
          type: string
          format: uuid
          description: Unique identifier of the chat this message was sent to
        message:
          $ref: "#/components/schemas/SentMessage"
    SendMessageResult:
      type: object
      description: The resolved Chat and resulting Message.
      required:
        - chat_id
        - created_new_chat
        - from
        - is_group
        - handles
        - message
      properties:
        chat_id:
          type: string
          format: uuid
          description: The reused or newly created Chat.
        created_new_chat:
          type: boolean
        from:
          type: string
          description: Handle of the authenticated sending Contact.
        is_group:
          type: boolean
          description: Whether the resolved chat is a group chat.
        handles:
          type: array
          description: Contacts in the resolved Chat.
          items:
            $ref: "#/components/schemas/ChatHandle"
        message:
          description: The primary message that was sent.
          $ref: "#/components/schemas/SentMessage"
    SendMessageToChatRequest:
      type: object
      required:
        - message
      properties:
        message:
          $ref: "#/components/schemas/MessageContent"
    SendReactionRequest:
      type: object
      required:
        - operation
        - type
      properties:
        operation:
          type: string
          description: Whether to add or remove the reaction
          enum:
            - add
            - remove
        type:
          $ref: "#/components/schemas/ReactionType"
        custom_emoji:
          type: string
          minLength: 1
          maxLength: 32
          description: |
            Custom emoji string. Required when type is "custom".
        part_index:
          type: integer
          description: |
            Optional index of the message part to react to.
            If not provided, reacts to the entire message (part 0).
      if:
        properties:
          type:
            const: custom
      then:
        required:
          - custom_emoji
        properties:
          custom_emoji: {}
    SendVoiceMemoToChatRequest:
      type: object
      description: |
        Request to send a voice memo to a chat (chat_id provided in path).
        Exactly one of `voice_memo_url` or `attachment_id` must be provided.
      properties:
        voice_memo_url:
          type: string
          format: uri
          description: |
            URL of the voice memo audio file. Must be a publicly accessible HTTPS URL.

            Either `voice_memo_url` or `attachment_id` must be provided, but not both.
        attachment_id:
          type: string
          format: uuid
          description: |
            Reference to a voice memo file pre-uploaded via `POST /v1/attachments`.
            The file is already stored, so sends using this ID skip the download step.

            Either `voice_memo_url` or `attachment_id` must be provided, but not both.
      oneOf:
        - required:
            - voice_memo_url
          properties:
            voice_memo_url: {}
            attachment_id: false
        - required:
            - attachment_id
          properties:
            voice_memo_url: false
            attachment_id: {}
    SendVoiceMemoToChatResult:
      type: object
      description: Response for sending a voice memo to a chat
      required:
        - voice_memo
      properties:
        voice_memo:
          type: object
          required:
            - id
            - from
            - to
            - status
            - voice_memo
            - created_at
            - chat
          properties:
            id:
              type: string
              format: uuid
              description: Message identifier
            from:
              type: string
            to:
              type: array
              items:
                type: string
            status:
              type: string
              description: Current delivery status
            voice_memo:
              $ref: "#/components/schemas/VoiceMemoAttachment"
            created_at:
              type: string
              format: date-time
              description: When the voice memo was created
            chat:
              $ref: "#/components/schemas/ChatInfo"
    SentMessage:
      type: object
      description: A message that was sent (used in CreateChat and SendMessage responses)
      required:
        - id
        - parts
        - created_at
        - sent_at
        - delivery_status
      properties:
        id:
          type: string
          format: uuid
          description: Message identifier (UUID)
        parts:
          type: array
          description: Message parts in order (text, media, and link)
          items:
            oneOf:
              - $ref: "#/components/schemas/TextPartResponse"
              - $ref: "#/components/schemas/MediaPartResponse"
              - $ref: "#/components/schemas/LinkPartResponse"
              - $ref: "#/components/schemas/ButtonsPartResponse"
              - $ref: "#/components/schemas/SelectionPartResponse"
              - $ref: "#/components/schemas/FormPartResponse"
              - $ref: "#/components/schemas/FormResponsePartResponse"
              - $ref: "#/components/schemas/SelectionResponsePartResponse"
              - $ref: "#/components/schemas/RichCardPartResponse"
              - $ref: "#/components/schemas/CarouselPartResponse"
              - $ref: "#/components/schemas/SuggestionResponsePartResponse"
              - $ref: "#/components/schemas/PaymentPartResponse"
              - $ref: "#/components/schemas/PaymentReceiptPartResponse"
              - $ref: "#/components/schemas/LocationRequestPartResponse"
              - $ref: "#/components/schemas/RatingRequestPartResponse"
              - $ref: "#/components/schemas/LocationPartResponse"
              - $ref: "#/components/schemas/PlacePartResponse"
        created_at:
          type: string
          format: date-time
          description: When the message was created
        sent_at:
          type:
            - string
            - "null"
          format: date-time
          description: When the message was actually sent (null if still queued)
        delivered_at:
          type:
            - string
            - "null"
          format: date-time
          description: When Relay accepted and stored the Message.
        delivery_status:
          $ref: "#/components/schemas/DeliveryStatus"
        from_handle:
          description: The sender of this message as a full handle object
          oneOf:
            - $ref: "#/components/schemas/ChatHandle"
            - type: "null"
        silent:
          type: boolean
          description: Whether the sender sent this Message silently, so the recipient's device showed no banner and played
            no sound.
        reply_to:
          oneOf:
            - $ref: "#/components/schemas/ReplyTo"
            - type: "null"
        thread:
          description: The thread this Message belongs to, or null when it is not a reply.
          oneOf:
            - $ref: "#/components/schemas/ThreadOriginator"
            - type: "null"
    SetContactCardRequest:
      type: object
      additionalProperties: false
      not:
        required: [image_url, attachment_id]
      dependentSchemas:
        image_recipe:
          anyOf:
            - required: [attachment_id]
            - required: [image_url]
      required:
        - handle
        - first_name
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 30
          description: First name for the contact card. Required. At most 30 characters.
        last_name:
          type: string
          description: Last name for the contact card. Optional.
        image_url:
          type: string
          description: >-
            Profile image for the contact card. Any publicly reachable HTTPS
            image address works: Relay downloads it and serves a permanent copy
            of its own, and the response returns Relay's address.
        attachment_id:
          type: string
          format: uuid
          description: >-
            An image uploaded through the existing Attachments API by this
            authenticated agent. Upload must be complete. Relay copies its
            bytes from private attachment storage to a permanent public image.
            Choose this or image_url, not both.
        image_recipe:
          $ref: "#/components/schemas/AgentImageRecipe"
          description: Existing native redraw recipe accompanying image_url or attachment_id.
        handle:
          type: string
          description: Relay Handle associated with this contact card.
    SetContactCardResponse:
      type: object
      required:
        - handle
        - first_name
        - is_active
        - kind
        - last_name
        - image_url
        - image_color
      properties:
        rive:
          description: >-
            The Rive file this agent shows in its calls, or null. Set it with
            PATCH `rive`.
          anyOf:
            - $ref: "#/components/schemas/RiveFile"
            - type: "null"
        description:
          type:
            - string
            - "null"
          maxLength: 2000
          description: Detailed agent description. Required for public agents; null clears it otherwise.
        first_name:
          type: string
          description: First name on the contact card
        last_name:
          type:
            - string
            - "null"
        image_url:
          type:
            - string
            - "null"
          format: uri
        image_color:
          type:
            - string
            - "null"
          pattern: ^[0-9A-F]{6}$
          description: >-
            Dominant colour of the picture at image_url, six uppercase hex
            digits, computed by Relay once when the picture is set. Null when
            Relay could not read the picture.
        is_active:
          type: boolean
          description: Whether the contact card was successfully applied to the device
        handle:
          type: string
          description: Relay Handle associated with this contact card.
        kind:
          type: string
          enum:
            - user
            - agent
          description: Whether the Contact is a user or an agent.
    SystemEvent:
      type: object
      additionalProperties: false
      required:
        - type
        - actor
        - subject
        - value
        - icon_attachment_id
        - contact_card
        - call
      properties:
        type:
          type: string
          enum:
            - chat_created
            - participant_added
            - participant_removed
            - group_name_updated
            - group_icon_updated
            - contact_card_shared
            - call
          description: >-
            What happened. For call the actor is the caller, the subject
            is the callee, and call carries the Call's live state.
        actor:
          $ref: "#/components/schemas/SystemEventActor"
        subject:
          oneOf:
            - $ref: "#/components/schemas/SystemEventParty"
            - type: "null"
        value:
          type:
            - string
            - "null"
        icon_attachment_id:
          type:
            - string
            - "null"
          format: uuid
        contact_card:
          oneOf:
            - $ref: "#/components/schemas/ContactCardItem"
            - type: "null"
        call:
          oneOf:
            - $ref: "#/components/schemas/CallMarker"
            - type: "null"
          description: The Call this event marks. Null unless type is call.
    CallMarker:
      type: object
      additionalProperties: false
      description: >-
        A call in this chat, present from the moment it is placed. The actor is
        the caller and the subject the callee; `call.status` carries its whole
        state, in Twilio's words.
      required:
        - id
        - status
        - answered_at
        - ended_at
        - from
        - to
        - duration_seconds
      properties:
        id:
          type: string
          format: uuid
          description: The Call's id.
        status:
          type: string
          description: The same values as Call.status.
          enum:
            - ringing
            - in-progress
            - completed
            - no-answer
            - canceled
            - busy
            - failed
        answered_at: *a3
        ended_at: *a3
        from:
          $ref: "#/components/schemas/CallContact"
        to:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: "#/components/schemas/CallContact"
        duration_seconds:
          type:
            - integer
            - "null"
          minimum: 0
          description: >-
            Whole seconds from answered to ended. Null when the Call was
            never answered or has not ended.
    SystemEventActor:
      type: object
      additionalProperties: false
      description: Who did it, with the name and picture a client shows beside the event, as a group shows a message's sender.
      required:
        - id
        - handle
        - kind
        - display_name
        - image_url
        - image_color
      properties:
        id:
          type: string
          format: uuid
        handle:
          type: string
        kind:
          type: string
          enum:
            - user
            - agent
        display_name:
          type: string
          description: First and last name joined by a space; empty when the Contact has none.
        image_url:
          type:
            - string
            - "null"
          format: uri
        image_color:
          type:
            - string
            - "null"
          pattern: ^[0-9A-F]{6}$
          description: Dominant colour of the picture at image_url, six uppercase hex digits.
        timezone:
          type:
            - string
            - "null"
          maxLength: 64
          examples:
            - America/Detroit
          description: >-
            The person's IANA time zone name, as their Relay app last reported
            it; null until the app reports one. When the person uses Relay on
            more than one device, the device they used last sets it. Present only when kind is user. Timestamps stay in UTC;
            use this to read them in the person's local time.
        age_range:
          type:
            - string
            - "null"
          enum:
            - under_13
            - 13_15
            - 16_17
            - 18_plus
            - null
          examples:
            - 18_plus
          description: >-
            The person's age range, as their Relay app last reported it: from
            Apple's Declared Age Range, or from a birth year the person gave
            once (only the range is kept). Null until the app reports one. Present only when kind is user.
            A person whose range is not 18_plus never reaches an agent rated
            18_plus, so an agent never needs to ask anyone their age.
        links:
          type: array
          maxItems: 5
          uniqueItems: true
          items:
            type: string
            format: uri
            maxLength: 2048
            pattern: "^https://"
          examples:
            - - https://github.com/ana
              - https://www.instagram.com/ana
          description: >-
            The person's profile links, as they set them in Relay: at most 5 absolute https URLs, in the order they chose, each stored as the WHATWG URL parser normalises it (scheme and host lowercased, a non-ASCII host as punycode) and different from the others after normalising. Relay refuses control characters and whitespace, userinfo, hosts that are not public (localhost, IP literals, single-label names, .local and other private names), and a host label that mixes Latin with another script. Empty when they set none. Present only when kind is user. Relay sends no platform name; read the site from the URL.
        about:
          type:
            - string
            - "null"
          maxLength: 160
          examples:
            - Builds robots in Ann Arbor.
          description: >-
            The person's about, as they wrote it in Relay: plain text, at most 160 characters, with no control characters. Null when they wrote none. Present only when kind is user.
    SystemEventParty:
      type: object
      additionalProperties: false
      required:
