    UnblockHandleRequest:
      type: object
      required:
        - handle
      properties:
        handle:
          type: string
          description: Registered Relay Handle.
    UpdateChatRequest:
      type: object
      minProperties: 1
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 255
          description: New display name for the chat (group chats only)
        group_chat_icon:
          type:
            - string
            - "null"
          maxLength: 2048
          description: >-
            Group photo for the chat, in either of two forms. A completed image
            Attachment ID uses an image you already uploaded. Any publicly
            reachable HTTPS image address also works: Relay downloads it and
            serves a permanent copy of its own, so the address you supply does
            not have to stay up. Send null to clear the photo.
    UpdateContactCardRequest:
      type: object
      additionalProperties: false
      not:
        required: [image_url, attachment_id]
      dependentSchemas:
        image_recipe:
          anyOf:
            - required: [attachment_id]
            - required: [image_url]
              properties:
                image_url:
                  type: string
      properties:
        description:
          type:
            - string
            - "null"
          maxLength: 2000
          description: Detailed agent description. Required for public agents; null clears it otherwise.
        subtitle:
          type: string
          minLength: 1
          maxLength: 60
          description: The one line under the name. Surrounding whitespace is trimmed.
        first_name:
          type: string
          minLength: 1
          maxLength: 30
          description: Updated first name, at most 30 characters. If omitted, the existing value is kept.
        last_name:
          type:
            - string
            - "null"
          description: Updated last name. If omitted, the existing value is kept.
        image_url:
          type:
            - string
            - "null"
          description: >-
            Updated profile image. Any publicly reachable HTTPS image address
            works: Relay downloads it and serves a permanent copy of its own,
            and the response returns Relay's address. If omitted, the existing
            image is kept.
          format: uri
        attachment_id:
          type: string
          format: uuid
          description: >-
            This agent's completed image upload from the Attachments API.
            Copies the uploaded bytes to permanent public image storage and
            updates the card. Mutually exclusive with image_url, including null.
            Omit both to keep the existing image.
        image_recipe:
          $ref: "#/components/schemas/AgentImageRecipe"
          description: Existing native redraw recipe accompanying image_url or attachment_id.
        rive:
          description: >-
            The Rive file this agent shows in its calls. Null removes it. If
            omitted, the existing file is kept.
          anyOf:
            - $ref: "#/components/schemas/RiveFileInput"
            - type: "null"
    UpdateWebhookSubscriptionRequest:
      type: object
      properties:
        target_url:
          type: string
          format: uri
          description: New target URL for webhook events
        subscribed_events:
          type: array
          description: Updated list of event types to subscribe to
          minItems: 1
          items:
            $ref: "#/components/schemas/WebhookEventType"
        is_active:
          type: boolean
          description: Activate or deactivate the subscription
    VoiceMemoAttachment:
      type: object
      required:
        - id
        - url
        - filename
        - mime_type
        - size_bytes
      properties:
        id:
          type: string
          format: uuid
          description: Attachment identifier
        url:
          type: string
          format: uri
          description: Opaque Relay download URL for the voice memo Attachment.
        filename:
          type: string
          description: Original filename
        mime_type:
          type: string
          description: Audio MIME type
        size_bytes:
          type: integer
          description: File size in bytes
        duration_ms:
          type:
            - integer
            - "null"
          minimum: 0
          description: Audio or video duration in milliseconds when known.
        width:
          type:
            - integer
            - "null"
          minimum: 1
          description: Pixel width when known. Width and height are supplied together.
        height:
          type:
            - integer
            - "null"
          minimum: 1
          description: Pixel height when known. Width and height are supplied together.
    WebSocketAckFrame:
      type: object
      additionalProperties: false
      required:
        - type
        - through_sequence
      properties:
        type:
          type: string
          enum:
            - ack
        through_sequence:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
    WebSocketDisconnectFrame:
      type: object
      additionalProperties: false
      required:
        - type
        - reason
      properties:
        type:
          type: string
          enum:
            - disconnect
        reason:
          type: string
          enum:
            - revoked
            - heartbeat_timeout
            - restart
            - webhook_configured
    WebSocketErrorFrame:
      type: object
      additionalProperties: false
      required:
        - type
        - code
        - message
        - fatal
        - retryable
      properties:
        type:
          type: string
          enum:
            - error
        code:
          type: string
          enum:
            - invalid_frame
            - ack_out_of_range
            - stale_connection
            - ack_failed
            - delivery_failed
            - full_sync_required
            - full_sync_mismatch
        message:
          type: string
        fatal:
          type: boolean
        retryable:
          type: boolean
    WebSocketEventFrame:
      type: object
      additionalProperties: false
      required:
        - type
        - sequence
        - event
      properties:
        type:
          type: string
          enum:
            - event
        sequence:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
        event:
          $ref: "#/components/schemas/WebhookEnvelopeBase"
    WebSocketFullSyncCompleteFrame:
      type: object
      additionalProperties: false
      required:
        - type
        - through_sequence
      properties:
        type:
          type: string
          enum:
            - full_sync_complete
        through_sequence:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
    WebSocketFullSyncFrame:
      type: object
      additionalProperties: false
      required:
        - type
        - through_sequence
        - reason
      properties:
        type:
          type: string
          enum:
            - full_sync
        through_sequence:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
        reason:
          type: string
          enum:
            - checkpoint_outside_retention
    WebSocketPingFrame:
      type: object
      additionalProperties: false
      description: >-
        Heartbeat, client to server. Send this frame every
        heartbeat_interval_ms, serialized exactly as {"type":"ping"}. Relay
        answers it in the edge runtime without waking the Agent's connection
        state, so the reply costs nothing and arrives while the connection is
        otherwise idle. Relay never sends a ping frame.
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - ping
    WebSocketPongFrame:
      type: object
      additionalProperties: false
      description: >-
        Heartbeat reply, server to client, serialized exactly as
        {"type":"pong"}. It answers each ping frame. A client that stops
        sending pings is closed with 4408 after the heartbeat times out.
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - pong
    WebSocketReadyFrame:
      type: object
      additionalProperties: false
      required:
        - type
        - connection_id
        - acked_through
        - full_sync_required
        - full_sync_through
        - heartbeat_interval_ms
        - max_in_flight
      properties:
        type:
          type: string
          enum:
            - ready
        connection_id:
          type: string
          format: uuid
        acked_through:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
        full_sync_required:
          type: boolean
        full_sync_through:
          type:
            - string
            - "null"
          pattern: ^(0|[1-9][0-9]*)$
        heartbeat_interval_ms:
          type: integer
          minimum: 1
        max_in_flight:
          type: integer
          minimum: 1
    WebhookEnvelopeBase:
      type: object
      required:
        - api_version
        - webhook_version
        - event_type
        - event_id
        - created_at
        - data
        - trace_id
        - agent_id
      properties:
        api_version:
          type: string
          enum:
            - v1
          description: Relay API version for this webhook envelope.
        webhook_version:
          type: string
          description: Fixed Relay webhook payload version.
          enum:
            - 2026-08-30
        event_type:
          $ref: "#/components/schemas/WebhookEventType"
        event_id:
          type: string
          format: uuid
          description: Unique identifier for this event (for deduplication)
        created_at:
          type: string
          format: date-time
          description: When the event was created
        trace_id:
          type: string
          description: Trace ID for debugging and correlation across systems.
        agent_id:
          type: string
          format: uuid
          description: Contact identifier of the receiving agent.
        data:
          type: object
          description: Event payload. Its shape is selected by event_type.
          additionalProperties: true
    WebhookEventType:
      type: string
      enum:
        - message.sent
        - message.received
        - message.read
        - message.delivered
        - message.failed
        - reaction.added
        - reaction.removed
        - participant.added
        - participant.removed
        - chat.created
        - chat.group_name_updated
        - chat.group_icon_updated
        - chat.typing_indicator.started
        - chat.typing_indicator.stopped
        - contact.added
        - contact.removed
        - call.created
        - call.updated
        - call.ended
        - payment.succeeded
        - payment.canceled
        - payment.expired
        - location.sharing.started
        - location.sharing.stopped
        - rating.created
        - rating.updated
        - rating.deleted
    WebhookEventsResult:
      type: object
      required:
        - events
        - doc_url
      properties:
        events:
          type: array
          description: List of all available webhook event types
          items:
            $ref: "#/components/schemas/WebhookEventType"
        doc_url:
          type: string
          format: uri
          description: URL to the webhook events documentation
          const: https://docs.relayapp.im/guides/webhooks/events
    WebhookSubscriptionCreatedResponse:
      type: object
      description: Response returned when creating a webhook subscription. Includes the signing secret which is only shown once.
      required:
        - id
        - target_url
        - signing_secret
        - subscribed_events
        - is_active
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: Unique identifier for the webhook subscription
        target_url:
          type: string
          format: uri
          description: URL where webhook events will be sent
