  /v1/websocket:
    get:
      operationId: connectAgentWebSocket
      summary: Connect an Agent WebSocket
      tags:
        - WebSocket
      security:
        - BearerAuth: []
      parameters:
        - name: observe
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: >-
            Read-only diagnostic event view. The ready frame includes
            observational:true. Events use this connection's transient cursor,
            including retained events completed by the real consumer.
            ACK and full_sync_complete frames are rejected. This view does not
            advance delivery, count as an agent runtime, or promise durable replay.
        - name: subscribed_events
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            maxItems: 64
            items:
              type: string
          description: >-
            The event types this connection receives, one parameter per type,
            for example subscribed_events=message.received&subscribed_events=call.created.
            A connection that names none receives every event type, including
            types Relay adds later. A connection that names types receives
            only those. A
            name Relay does not know is ignored. Every consuming connection of
            one Agent shares one sequence, so Relay queues only the types that
            all of them accept; a connection that names none accepts every
            type. An event of a type left out is not delivered later. When a
            new connection leaves out a type that is already queued, Relay
            removes those events, sends the rest again under new sequence
            numbers with the same event_id values, and closes the other
            connections with a restart disconnect so they reconnect from the
            new checkpoint. An observer receives only the types it names, or
            every type when it names none.
      responses:
        "101":
          description: WebSocket connection accepted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
      description: >-
        Upgrade wss://api.relayapp.im/v1/websocket with Authorization: Bearer
        <Agent Token>. If the Agent has any saved webhook subscription, Relay
        returns 409. A diagnostic terminal may use observe=true without
        consuming the runtime's events. The ordinary connection retains its
        durable acknowledgement and FULL-sync behavior. The client owns the
        heartbeat: send {"type":"ping"} every heartbeat_interval_ms and Relay
        answers {"type":"pong"} from the edge runtime, without waking the
        Agent's connection state. Relay never sends a ping frame.
  /v1/chats/{chatId}/calls:
    post:
      operationId: createCall
      summary: Start an individual call
      tags:
        - Calls
      security:
        - BearerAuth: []
      description: Start an audio Call in an existing individual Chat containing exactly one user and one agent. The caller comes from authentication. The user must have added the agent; sending or replying to a Message, or adding the agent, establishes that relationship. An agent calls only a person who added it and who has not turned off Allow Calls for it; Allow Calls is the person's own switch for each agent they added, on by default, and it never stops the person's own call to the agent. A block in either direction prevents the call. A group Chat is rejected even when it has only two current members. Reuse the same Idempotency-Key and body after an uncertain response. Relay emits `call.created` through the agent's configured event transport. Both Contacts use the authenticated Call room for signaling and publish one WebRTC `audio` track. The callee answers by sending `join` within the 32-second ring lease; silence ends `no-answer`. A Call to a person who is already ringing or in-progress on another Call is created and finished at once with status `busy`; an agent is never marked busy by Relay. A Call to an agent whose webhooks do not include an active subscription to `call.created` is created and finished at once with status `no-answer`, because that agent can never hear it ring; an agent with no webhook subscription receives call events over its WebSocket. An answered Call has no duration limit. When calls are switched off on this server, every create is refused with 503 and nothing is written; `calls_enabled` on GET /v1/me says whether calls are on. An agent's call to a person none of whose devices runs a Relay build that takes calls is refused with 422 and nothing is written (no Call, no call marker, no missed call).
      parameters:
        - name: chatId
          in: path
          required: true
          schema: &a1
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallCreateRequest"
      responses:
        "200":
          description: The original Call for the same idempotent request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallResult"
        "201":
          description: Call created and ringing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |-
            The call is not permitted (error code `2003`). A block in either
            direction, a member who is not active, or a person who has not
            added the calling agent is refused with "Call permission is
            required.". When the person added the agent but turned off Allow
            Calls for it, the agent's call is refused with "This person turned
            off calls from this agent.". Tell the person in your own words;
            they can turn Allow Calls on again in the agent's profile or in
            Settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: |-
            The Call cannot be placed (error code `1005`). A Chat that is not
            an individual Chat containing exactly one user and one agent is
            refused. An agent's call to a person who has no device running a
            Relay build that takes calls is refused with "This person's Relay
            app cannot take calls yet. They need to update Relay."; no Call
            and no call marker are written, so the person sees no missed
            call. Tell the person in your own words, or send a Message
            instead.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/CallsUnavailable"
    get:
      operationId: listCalls
      summary: List calls in a chat
      tags:
        - Calls
      security:
        - BearerAuth: []
      description: Read retained call history for a Chat you belong to.
      parameters:
        - name: chatId
          in: path
          required: true
          schema: *a1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Operation completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallListResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/calls/{callId}:
    get:
      operationId: getCall
      summary: Retrieve a call
      tags:
        - Calls
      security:
        - BearerAuth: []
      description: Only a Contact in the Call can retrieve it.
      parameters:
        - name: callId
          in: path
          required: true
          schema: *a1
      responses:
        "200":
          description: Operation completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/calls/{callId}/room:
    get:
      operationId: connectCallRoom
      summary: Join a call room
      tags:
        - Calls
      security:
        - BearerAuth: []
      description: >-
        Upgrade to a WebSocket as either Contact in a live Call. This socket is
        signaling only: every frame is JSON text and media never passes through
        it. Each participant sends `join` when the socket opens, and again after
        any reconnect; the callee answers a ringing Call by sending `join`. Relay
        answers every `join` with `iceServers`, the STUN and TURN servers for the
        RTCPeerConnection, then `roomState`. Each participant then sends an `offer` publishing a WebRTC track named `audio`, and later
        one adding a track named `video` the first time its camera turns on;
        Relay returns `answer`. After applying that answer, send `connected`
        only when the RTCPeerConnection connectionState is `connected`. Once both
        participants have published and reported connected, Relay pulls every
        track each participant has published into the other Cloudflare SFU
        Session, one at a time, and sends that participant an `offer` naming the
        track; answer it with `answer` to complete renegotiation. A participant
        whose PeerConnection is dead sends `offer` with `restart: true` from a
        new PeerConnection: Relay moves it onto a new SFU Session, the Call stays
        in progress, and both directions are pulled again after it sends
        `connected`. The room is scoped to the Call and accepts only its
        authenticated user or agent Contact. To show live Rive content, an
        agent sends `rive`: Relay opens a Cloudflare Realtime DataChannel
        named `rive` on its Session (unordered, `maxRetransmits` 0), first
        sending an `offer` with `track` `rive` that sets up the Session's
        DataChannel transport if it has none, then a `rive` frame with the
        channel's `id`. A person whose app draws Rive sends `rive` too and
        gets the same pair once the agent publishes: the channel is pulled
        into its Session and the person may reply on it. Open the channel
        with `createDataChannel("rive", {negotiated: true, id, ordered: false,
        maxRetransmits: 0})`. After a restart onto a new Session, Relay opens
        it again with a new `id`.
      parameters:
        - name: callId
          in: path
          required: true
          schema: *a1
        - name: Upgrade
          in: header
          required: true
          schema:
            type: string
            const: websocket
      responses:
        "101":
          description: WebSocket upgrade accepted. See `x-relay-call-room-frames` for frame schemas.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          description: The Call has ended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/calls/{callId}/end:
    post:
      operationId: endCall
      summary: End a call
      tags:
        - Calls
      security:
        - BearerAuth: []
      description: Either Contact ends the Call. A ringing Call ends canceled when its caller ends it and no-answer when its recipient does; an answered Call ends completed. A participant may also send `end` over its authenticated Call room. Cleanup remains available after a block or removal. Repeated terminal actions never restart the Call.
      parameters:
        - name: callId
          in: path
          required: true
          schema: *a1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallEmptyRequest"
      responses:
        "200":
          description: Operation completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  parameters:
    RatedAgentHandle:
      name: handle
      in: path
      required: true
      description: The agent's complete Handle.
      schema:
        type: string
        pattern: '^[a-z][a-z0-9_]{2,31}$'
      example: brave_cangoo
  schemas:
    CallContact:
      type: object
      additionalProperties: false
      required:
        - id
        - handle
        - kind
      properties:
        id: &uuid
          type: string
          format: uuid
        handle:
          type: string
          minLength: 1
        kind:
          type: string
          enum:
            - user
            - agent
        timezone:
          type:
            - string
            - "null"
          maxLength: 64
          examples:
            - America/Detroit
          description: >-
            The person's IANA time zone name, as their Relay app last reported
            it; null until the app reports one. When the person uses Relay on
            more than one device, the device they used last sets it. Present only when kind is user. Timestamps stay in UTC;
            use this to read them in the person's local time.
        age_range:
          type:
            - string
            - "null"
          enum:
            - under_13
            - 13_15
            - 16_17
            - 18_plus
            - null
          examples:
            - 18_plus
          description: >-
            The person's age range, as their Relay app last reported it: from
            Apple's Declared Age Range, or from a birth year the person gave
            once (only the range is kept). Null until the app reports one. Present only when kind is user.
            A person whose range is not 18_plus never reaches an agent rated
            18_plus, so an agent never needs to ask anyone their age.
        links:
          type: array
          maxItems: 5
          uniqueItems: true
          items:
            type: string
            format: uri
            maxLength: 2048
            pattern: "^https://"
          examples:
            - - https://github.com/ana
              - https://www.instagram.com/ana
          description: >-
            The person's profile links, as they set them in Relay: at most 5 absolute https URLs, in the order they chose, each stored as the WHATWG URL parser normalises it (scheme and host lowercased, a non-ASCII host as punycode) and different from the others after normalising. Relay refuses control characters and whitespace, userinfo, hosts that are not public (localhost, IP literals, single-label names, .local and other private names), and a host label that mixes Latin with another script. Empty when they set none. Present only when kind is user. Relay sends no platform name; read the site from the URL.
        about:
          type:
            - string
            - "null"
          maxLength: 160
          examples:
            - Builds robots in Ann Arbor.
          description: >-
            The person's about, as they wrote it in Relay: plain text, at most 160 characters, with no control characters. Null when they wrote none. Present only when kind is user.
        rive:
          description: >-
            The Rive file this agent shows in its calls, so the app can load it
            before the call connects. Null when it has none. Present only when
            kind is agent.
          anyOf:
            - $ref: "#/components/schemas/RiveFile"
            - type: "null"
    RiveFile:
      type: object
      additionalProperties: false
      required: [file, artboard, state_machine, view_model]
      description: >-
        A Rive file an agent shows in its calls: a character, a quiz, a game,
        a chart. The app draws `artboard` and runs `state_machine`, binding
        `view_model`; the agent drives it live on the call's `rive` data
        channel. Names are Rive's own; a null name means the file's default.
      properties:
        file:
          type: string
          format: uri
          description: >-
            The .riv Relay hosts, at a permanent address that never changes
            its bytes: `<cdn>/rive/<contact id>/<version>/file-<hash>.riv`.
          examples:
            - https://cdn.relayapp.im/rive/0199a000-0000-7000-8000-00000000000b/1790000000000/file-0123456789abcdef.riv
        artboard:
          type: ["string", "null"]
          maxLength: 255
          examples: [Call]
        state_machine:
          type: ["string", "null"]
          maxLength: 255
          examples: [Main]
        view_model:
          type: ["string", "null"]
          maxLength: 255
          examples: [Main]
    RiveFileInput:
      type: object
      additionalProperties: false
      description: >-
        Send `attachment_id` for a new file, or `file` with the address the
        card already holds to change only the names. The names you send
        replace all three; an omitted or null name means the file's default.
      oneOf:
        - required: [attachment_id]
          not: { required: [file] }
        - required: [file]
          not: { required: [attachment_id] }
      properties:
        attachment_id:
          type: string
          format: uuid
          description: >-
            This agent's completed upload from the Attachments API, as for
            the profile picture: a Rive file (it starts with the bytes
            `RIVE`) of at most 10 MB. Relay copies it to permanent public
            storage. Embed every image and font in the file: the app does not
            fetch Rive's hosted assets.
        file:
          type: string
          format: uri
          description: The `file` address this card already holds.
        artboard:
          type: ["string", "null"]
          minLength: 1
          maxLength: 255
        state_machine:
          type: ["string", "null"]
          minLength: 1
          maxLength: 255
        view_model:
          type: ["string", "null"]
          minLength: 1
          maxLength: 255
    Call:
      type: object
      additionalProperties: false
      required:
        - id
        - chat_id
        - from
        - to
        - status
        - revision
        - created_at
        - ringing_at
        - answered_at
        - ended_at
      properties:
        id: *uuid
        chat_id: *uuid
        from:
          $ref: "#/components/schemas/CallContact"
        to:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: "#/components/schemas/CallContact"
        status:
          type: string
          description: >-
            `ringing` and `in-progress` are live. `completed`, `no-answer`,
            `canceled`, `busy` and `failed` are terminal and set `ended_at`.
          enum:
            - ringing
            - in-progress
            - completed
            - no-answer
            - canceled
            - busy
            - failed
        revision:
          type: integer
          minimum: 1
        created_at: &a2
          type: string
          format: date-time
        ringing_at: *a2
        answered_at: &a3
          type:
            - string
            - "null"
          format: date-time
        ended_at: *a3
    CallCreateRequest:
      type: object
      additionalProperties: false
      required:
        - to
      properties:
        to:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
            minLength: 1
    CallResult:
      type: object
      additionalProperties: false
      required:
        - call
      properties:
        call:
          $ref: "#/components/schemas/Call"
    CallListResult:
      type: object
      additionalProperties: false
      required:
        - calls
        - next_cursor
      properties:
        calls:
          type: array
          items:
            $ref: "#/components/schemas/Call"
        next_cursor:
          type:
            - string
            - "null"
    CallEmptyRequest:
      type: object
      additionalProperties: false
      required: []
      properties: {}
    CallRoomParticipant:
      type: object
      additionalProperties: false
      required:
        - contact_id
        - kind
        - attached
        - track
        - tracks
        - muted
        - video
        - connected
        - receiving
      properties:
        contact_id: *uuid
        kind:
          type: string
          enum: [user, agent]
        attached:
          type: boolean
          description: Whether this Contact currently has an authenticated Call room socket attached.
        track:
          type:
            - string
            - "null"
          enum: [audio, null]
          description: "`audio` after this participant has published its local WebRTC audio track."
        tracks:
          type: array
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            enum: [audio, video, rive]
          description: >-
            The local tracks this participant has published, `audio` first,
            and `rive` once an agent's `rive` DataChannel is open.
        muted:
          type: boolean
        video:
          type: boolean
          description: Whether this participant's camera is sending, from its last `userUpdate`.
        connected:
          type: boolean
          description: True after this participant reported RTCPeerConnection connectionState `connected` for its initial publication.
        receiving:
          type: array
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            enum: [audio, video, rive]
          description: >-
            The other participant's tracks this participant is receiving now:
            Relay pulled the track into its Session, it answered that `offer`,
            and it has reported `connected`. `[]` until then; emptied when either
            participant restarts, and rebuilt as the tracks are pulled again.
            Relay sends `roomState` each time it changes. Hold generated audio
            until the other participant's `receiving` contains `audio`, then play
            it from the start. `rive` is there once the agent's `rive`
            DataChannel is pulled into this participant's Session.
    CallRoomJoinFrame:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          const: join
    CallRoomPublishOfferFrame:
      type: object
      additionalProperties: false
      required: [type, session_description, tracks]
      properties:
        type:
          type: string
          const: offer
        session_description:
          type: object
          additionalProperties: false
          required: [type, sdp]
          properties:
            type:
              type: string
              const: offer
            sdp:
              type: string
              minLength: 1
              maxLength: 65536
        tracks:
          type: array
          minItems: 1
          maxItems: 2
          description: >-
            The tracks this offer publishes, with no repeated name or mid. The
            first offer of a Session, and every restart, includes `audio`. An
            offer without `restart` on an existing Session adds the listed
            tracks it has not published yet.
          items:
            type: object
            additionalProperties: false
            required: [mid, name]
            properties:
              mid:
                type: string
                minLength: 1
                maxLength: 64
              name:
                type: string
                enum: [audio, video]
        restart:
          type: boolean
          description: >-
            True when this offer comes from a new PeerConnection because the
            old one is dead. Relay creates a new SFU Session, closes the old
            tracks, and pulls both directions again after `connected`. The Call
            stays in progress.
    CallRoomAnswerFrame:
      type: object
      additionalProperties: false
      required: [type, session_description]
      properties:
        type:
          type: string
          const: answer
        session_description:
          type: object
          additionalProperties: false
          required: [type, sdp]
          properties:
            type:
              type: string
              const: answer
            sdp:
              type: string
              minLength: 1
              maxLength: 65536
    CallRoomConnectedFrame:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          const: connected
    CallRoomUserUpdateFrame:
      type: object
      additionalProperties: false
      required: [type, muted]
      properties:
        type:
          type: string
          const: userUpdate
        muted:
          type: boolean
        video:
          type: boolean
          description: Whether this participant's camera is sending. Omitted keeps the last value.
    CallRoomEndFrame:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          const: end
    CallRoomHeartbeatFrame:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          const: heartbeat
    CallRoomStateFrame:
      type: object
      additionalProperties: false
      required: [type, call, participants]
      properties:
        type:
          type: string
          const: roomState
        call:
          $ref: "#/components/schemas/Call"
        participants:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: "#/components/schemas/CallRoomParticipant"
    CallRoomIceServersFrame:
      type: object
      additionalProperties: false
      required: [type, ice_servers]
      description: >-
        Sent right after Relay accepts each `join`, before that socket's first
        `roomState`. Use these servers for the RTCPeerConnection. Relay mints
        Cloudflare TURN credentials once per Call room and reuses them until an
        hour before they expire; when it cannot mint, the list carries only
        `stun:stun.cloudflare.com:3478`.
      properties:
        type:
          type: string
          const: iceServers
        ice_servers:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: object
            additionalProperties: false
            required: [urls]
            description: An RTCIceServer.
            properties:
              urls:
                type: array
                minItems: 1
                maxItems: 16
                items:
                  type: string
                  pattern: "^(stun|turns?):"
              username:
                type: string
              credential:
                type: string
    CallRoomServerAnswerFrame:
      allOf:
        - $ref: "#/components/schemas/CallRoomAnswerFrame"
    CallRoomSubscriptionOfferFrame:
      type: object
      additionalProperties: false
      required: [type, session_description, track]
      properties:
        type:
          type: string
          const: offer
        session_description:
          type: object
          additionalProperties: false
          required: [type, sdp]
          properties:
            type:
              type: string
              const: offer
            sdp:
              type: string
              minLength: 1
              maxLength: 65536
        track:
          type: string
          enum: [audio, video, rive]
          description: >-
            The other participant's track this offer pulls. `rive` sets up
            this Session's DataChannel transport (one SCTP section); answer it
            like any other.
    CallRoomRiveFrame:
      type: object
      additionalProperties: false
      required: [type]
      description: >-
        Agent: publish the `rive` DataChannel. Person: receive the agent's.
        Sent again with the channel open, Relay repeats its `id`.
      properties:
        type:
          type: string
          const: rive
    CallRoomRiveChannelFrame:
      type: object
      additionalProperties: false
      required: [type, id]
      description: >-
        The `rive` DataChannel is open on this participant's Session. Create
        it with `createDataChannel("rive", {negotiated: true, id, ordered:
        false, maxRetransmits: 0})`. Messages are JSON text of at most 1 KB.
      properties:
        type:
          type: string
          const: rive
        id:
          type: integer
          minimum: 0
          maximum: 65534
    CallRoomEndedFrame:
      type: object
      additionalProperties: false
      required: [type, reason]
      properties:
        type:
          type: string
          const: ended
        reason:
          type: string
          enum: [completed, no-answer, canceled, busy, failed]
    CallRoomErrorFrame:
      type: object
      additionalProperties: false
      required: [type, code, message]
      properties:
        type:
          type: string
          const: error
        code:
          type: string
          enum: [invalid_frame, not_allowed, media_unavailable]
        message:
          type: string
    CallCreatedWebhook:
      allOf:
        - $ref: "#/components/schemas/WebhookEnvelopeBase"
        - type: object
          required:
            - event_type
            - data
          properties:
            event_type:
              type: string
              const: call.created
            data:
              $ref: "#/components/schemas/CallResult"
    CallUpdatedWebhook:
      allOf:
        - $ref: "#/components/schemas/WebhookEnvelopeBase"
        - type: object
          required:
            - event_type
            - data
          properties:
            event_type:
              type: string
              const: call.updated
            data:
              $ref: "#/components/schemas/CallResult"
    CallEndedWebhook:
      allOf:
        - $ref: "#/components/schemas/WebhookEnvelopeBase"
        - type: object
          required:
            - event_type
            - data
          properties:
            event_type:
              type: string
              const: call.ended
            data:
              $ref: "#/components/schemas/CallResult"
    LocationRequestResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
          const: Location request sent
    GetChatLocationResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [type, features]
          properties:
            type:
              type: string
              const: FeatureCollection
            features:
              type: array
              items:
                $ref: "#/components/schemas/LocationFeature"
    LocationFeature:
      type: object
      required: [type, geometry, properties]
      properties:
        type:
          type: string
          const: Feature
        geometry:
          type: object
          required: [type, coordinates]
          properties:
            type:
              type: string
              const: Point
            coordinates:
              type: array
              description: "[longitude, latitude]"
              minItems: 2
              maxItems: 2
              items:
                type: number
        properties:
          type: object
          required: [handle, updated_at]
          properties:
            handle:
              type: string
              description: Handle of the person sharing.
            updated_at:
              type: string
              format: date-time
              description: When this position arrived.
    LocationRequestPartResponse:
      type: object
      description: >-
        A request for the person's location, sent by an agent with
        `POST /v1/chats/{chatId}/location/request`. It cannot be sent as a
        message part. A client that does not draw it shows the Message's text,
        "<agent display name> requested your location".
      required: [type, reactions]
      properties:
        type:
          type: string
          enum: [location_request]
        reactions:
          type:
            - array
            - "null"
          description: Reactions on this message part
          items:
            $ref: "#/components/schemas/Reaction"
    LocationPartResponse:
      type: object
      description: >-
        A person's location share, the card the person's app draws. It carries
        the share's state, not its position: read the position with
        `GET /v1/chats/{chatId}/location`. It cannot be sent as a message part.
        A share whose `ends_at` has passed reads as `ended` with `ended_at`
        equal to `ends_at`.
      required: [type, state, began_at, ends_at, ended_at, reactions]
      properties:
        type:
          type: string
          enum: [location]
        state:
          type: string
          enum: [live, ended]
        began_at:
          type:
            - string
            - "null"
          format: date-time
        ends_at:
          type:
            - string
            - "null"
          format: date-time
          description: When the share ends by itself; null when it has no end.
        ended_at:
          type:
            - string
            - "null"
          format: date-time
        reactions:
          type:
            - array
            - "null"
          description: Reactions on this message part
          items:
            $ref: "#/components/schemas/Reaction"
    RatingRequestPart:
      type: object
      additionalProperties: false
      description: >-
        Ask the people in the chat to rate your agent, the way an app asks for
        a rating. The part carries no words: Relay draws "Enjoying
        <your agent's name>?", "Tell us what you think." and a Rate button.
        The button opens one sheet with stars and an optional review.
        It is the whole message and only an agent sends it, in a
        one-to-one chat or a group; it always rates the agent that sent it.
        Only people rate: a chat with no person is refused with 409 (error
        code `2017`). The answer arrives as `rating.created`,
        then `rating.updated` whenever the person changes it, and
        `rating.deleted` when they take it back.
      required: [type]
      properties:
        type:
          type: string
          enum: [rating_request]
    RatingRequestPartResponse:
      type: object
      description: >-
        A rating request from an agent. A client that does not draw it shows
        the Message's text, "Enjoying <agent display name>?".
      required: [type, value, rating, reactions]
      properties:
        type:
          type: string
          enum: [rating_request]
        value:
          type: string
          description: >-
            "Enjoying <agent display name>?", the words a client that does
            not draw the card shows in its place.
        rating:
          description: >-
            The reader's own rating of the agent that asked, or null when the
            reader has not rated it. Nobody else's rating is shown here.
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [stars, review]
              properties:
                stars:
                  type: integer
                  minimum: 1
                  maximum: 5
                review:
                  type:
                    - string
                    - "null"
                  maxLength: 1000
        reactions:
          type:
            - array
            - "null"
          description: Reactions on this message part
          items:
            $ref: "#/components/schemas/Reaction"
    PlacePart:
      type: object
      additionalProperties: false
      description: >-
        A place sent once: a person's current location, a dropped pin, or a
        place an agent names. The fields are WhatsApp Cloud API's location
        message fields. Persons and agents both send it; it may be the only
        part of its message or sit beside text. `name` and `address` are
        trimmed; one that is empty after trimming, or longer than 256
        characters, is refused. A coordinate out of range, or a missing
        `latitude` or `longitude`, is refused with 400 (error code `1005`), as
        every malformed part is. A client that does not
        draw it shows the Message's text: the name, else the address, else
        "Dropped Pin".
      required: [type, latitude, longitude]
      properties:
        type:
          type: string
          enum: [place]
        latitude:
          type: number
          minimum: -90
          maximum: 90
          description: Latitude in degrees (WGS 84).
        longitude:
          type: number
          minimum: -180
          maximum: 180
          description: Longitude in degrees (WGS 84).
        name:
          type: string
          minLength: 1
          maxLength: 256
          description: The place's name, when it has one.
        address:
          type: string
          minLength: 1
          maxLength: 256
          description: The place's address, when known.
      example:
        type: place
        latitude: 37.44216251868683
        longitude: -122.16153582049394
        name: Philz Coffee
        address: 101 Forest Ave, Palo Alto, CA 94301
    PlacePartResponse:
      type: object
      description: >-
        A place sent once, as its sender sent it. `name` and `address` are
        absent when the sender left them out. A client that does not draw it
        shows the Message's text: the name, else the address, else
        "Dropped Pin".
      required: [type, latitude, longitude, reactions]
      properties:
        type:
          type: string
          enum: [place]
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        name:
          type: string
        address:
          type: string
        reactions:
          type:
            - array
            - "null"
          description: Reactions on this message part
          items:
            $ref: "#/components/schemas/Reaction"
      example:
        type: place
        latitude: 37.44216251868683
        longitude: -122.16153582049394
        name: Philz Coffee
        address: 101 Forest Ave, Palo Alto, CA 94301
        reactions: null
    RatingEvent:
      type: object
      additionalProperties: false
      required: [contact, stars, review, created_at, updated_at]
      description: >-
        A person's rating of your agent, as it is now stored. One rating per
        person: a new one replaces the stars and the review.
      properties:
        contact:
          $ref: "#/components/schemas/ContactEventContact"
        stars:
          type: integer
          minimum: 1
          maximum: 5
        review:
          type:
            - string
            - "null"
          maxLength: 1000
          description: The person's words, trimmed; null when they gave stars only.
        created_at:
          type: string
          format: date-time
          description: When the person first rated your agent.
        updated_at:
          type: string
          format: date-time
          description: When the stars or the review last changed.
    RatingCreatedWebhook:
      allOf:
        - $ref: "#/components/schemas/WebhookEnvelopeBase"
        - type: object
          required:
            - event_type
            - data
          properties:
            event_type:
              type: string
              const: rating.created
            data:
              $ref: "#/components/schemas/RatingEvent"
    RatingUpdatedWebhook:
      allOf:
        - $ref: "#/components/schemas/WebhookEnvelopeBase"
        - type: object
          required:
            - event_type
            - data
          properties:
            event_type:
              type: string
              const: rating.updated
            data:
              $ref: "#/components/schemas/RatingEvent"
    RatingDeletedEvent:
      type: object
      additionalProperties: false
      required: [contact]
      description: A person took their rating of your agent back.
      properties:
        contact:
          $ref: "#/components/schemas/ContactEventContact"
    RatingDeletedWebhook:
      allOf:
        - $ref: "#/components/schemas/WebhookEnvelopeBase"
        - type: object
          required:
            - event_type
            - data
          properties:
            event_type:
              type: string
              const: rating.deleted
            data:
              $ref: "#/components/schemas/RatingDeletedEvent"
    LocationSharingStartedEvent:
      type: object
      required: [shared_by, shared_with, chat_id, began_at, ends_at]
      properties:
        shared_by:
          type: string
          description: Handle of the person who started sharing.
        shared_with:
          type: string
          description: Handle of your agent.
        chat_id:
          type: string
          format: uuid
        began_at:
          type: string
          format: date-time
        ends_at:
          type:
            - string
            - "null"
          format: date-time
          description: When the share ends by itself; null when it has no end.
    LocationSharingStoppedEvent:
      type: object
      required: [shared_by, shared_with, chat_id, began_at, ended_at]
      properties:
        shared_by:
          type: string
          description: Handle of the person who stopped sharing.
        shared_with:
          type: string
          description: Handle of your agent.
        chat_id:
          type: string
          format: uuid
        began_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          description: When the share ended. Equals the share's `ends_at` when it ran out.
    LocationSharingStartedWebhook:
      allOf:
