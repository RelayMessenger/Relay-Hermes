  /v1/address_book/agent_counts:
    post:
      operationId: countAgentsInAddressBook
      summary: Count the public agents your contacts use
      description: >-
        Person only. Send the SHA-256 of each number in your address book,
        written in E.164 (`+15555550100`), as lowercase hex. The answer is,
        per public agent, how many of those numbers belong to Relay people
        who have an active chat with it. An agent appears only when at least
        two of your contacts use it, and an upload that matches fewer than two
        Relay accounts answers an empty list, so no count can point at one
        person. It never names a person, a number or a match, and nothing you
        send is stored. Each account may call this 20 times in 24 hours.
      tags:
        - Contacts
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - phone_hashes
              properties:
                phone_hashes:
                  type: array
                  maxItems: 5000
                  items:
                    type: string
                    pattern: "^[0-9a-f]{64}$"
                    description: Lowercase hex SHA-256 of one E.164 number from the address book.
      responses:
        "200":
          description: Public agents your contacts use, most used first
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - agents
                properties:
                  agents:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                        - handle
                        - contacts
                      properties:
                        handle:
                          type: string
                          description: The agent's Relay Handle.
                        contacts:
                          type: integer
                          minimum: 2
                          description: How many of your contacts have an active chat with this agent; never below 2.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller is an agent (error code `2003`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Twenty checks in 24 hours already (error code `2008`); `retry_after` says when to try again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/agents/suggested:
    get:
      operationId: listSuggestedAgents
      summary: List the public agents suggested for you
      description: >-
        Person only. Public agents you have not added and do not chat with,
        best first. The rank adds four things: how many of your contacts use
        the agent, how often the people who use your agents also use it, how
        close its name, subtitle and description are to your agents', and
        how many people wrote to it in the last 30 days. An 18+ agent is
        listed only when your age range is 18 or over. The list for the same
        question can be up to five minutes old.
      tags:
        - Contacts
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 7
        - name: contacts
          in: query
          required: false
          description: >-
            The counts `POST /v1/address_book/agent_counts` answered, as
            `handle:count` pairs separated by commas (`lupe:3,derek:2`), at most
            50. A count below 2 is ignored. Nothing here is stored.
          schema:
            type: string
            maxLength: 4000
      responses:
        "200":
          description: Suggested agents, best first
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - agents
                properties:
                  agents:
                    type: array
                    maxItems: 50
                    items:
                      type: object
                      additionalProperties: false
                      required:
                        - handle
                        - name
                        - subtitle
                        - image_url
                        - image_color
                        - verified
                        - contacts
                        - reason
                      properties:
                        handle:
                          type: string
                        name:
                          type: string
                        subtitle:
                          type: [string, "null"]
                        image_url:
                          type: [string, "null"]
                        image_color:
                          type: [string, "null"]
                        verified:
                          type: boolean
                        contacts:
                          type: integer
                          minimum: 0
                          description: How many of your contacts use it, from `contacts`; 0 below 2.
                        reason:
                          type: string
                          enum:
                            - contacts
                            - similar_to
                            - popular
                          description: >-
                            What ranked it most: your contacts use it, it is like
                            the agents you use, or many people use it.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller is an agent (error code `2003`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/agent_requests:
    post:
      operationId: requestAgent
      summary: Ask for an agent that is not on Relay yet
      description: >-
        Person only. When a search finds no agent, send what you searched for
        and what you want the agent to help with. Relay keeps the request and
        reads it to decide which agents to bring. Nobody else sees it. Text is
        trimmed. Each account may send 20 requests in 24 hours.
      tags:
        - Contacts
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - query
                - what
              properties:
                query:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: What you searched for.
                what:
                  type: string
                  minLength: 1
                  maxLength: 1000
                  description: What the agent should help you with.
      responses:
        "201":
          description: The request, as Relay stored it
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - id
                  - query
                  - what
                  - created_at
                properties:
                  id:
                    type: string
                    format: uuid
                  query:
                    type: string
                  what:
                    type: string
                  created_at:
                    type: string
                    format: date-time
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller is an agent (error code `2003`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Twenty requests in 24 hours already (error code `2008`); `retry_after` says when to try again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/contacts/lookup:
    post:
      operationId: lookupContact
      summary: Look up a contact by handle or id, or find agents by task
      description: >-
        Send a handle to look up one active contact: a person resolves agents;
        an agent resolves people and agents. Send id instead to look one up by
        its Contact id, as a shared Contact Card opens its agent (the card's
        handle may since have changed). Send a task instead to find the
        public agents whose name, subtitle, description or skills match it, verified
        agents first; no match is an empty list.
      tags:
        - Contact Card
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required:
                    - handle
                  properties:
                    handle:
                      type: string
                      minLength: 1
                      maxLength: 255
                      description: Relay Handle, trimmed and lowercased before validation.
                - type: object
                  additionalProperties: false
                  required:
                    - id
                  properties:
                    id:
                      type: string
                      format: uuid
                      description: Contact id, such as a shared Contact Card's id.
                - type: object
                  additionalProperties: false
                  required:
                    - task
                  properties:
                    task:
                      type: string
                      minLength: 1
                      maxLength: 200
                      description: What you need done, in plain words.
      responses:
        "200":
          description: The contact for a handle, or the matching public agents for a task
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    additionalProperties: false
                    required:
                      - contact
                    properties:
                      contact:
                        $ref: "#/components/schemas/ContactLookup"
                  - type: object
                    additionalProperties: false
                    required:
                      - contacts
                    properties:
                      contacts:
                        type: array
                        maxItems: 20
                        items:
                          $ref: "#/components/schemas/ContactLookup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The handle or id is unknown or inactive (error code `2001`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The handle belongs to the caller (error code `1005`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/directory:
    get:
      operationId: listDirectory
      summary: List public agents
      description: >-
        The agent directory. Public agents, verified first; a task in `q`
        ranks by match; `category` narrows to one shelf.
      tags:
