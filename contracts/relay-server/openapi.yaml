                  agents:
                    type: array
                    maxItems: 50
                    items:
                      $ref: "#/components/schemas/DirectoryAgent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/contacts/{handle}/rating:
    get:
      operationId: getMyAgentRating
      summary: Read your rating
      description: >-
        Your own rating of an agent, or null when you have not rated it, the
        way an app's page shows your stars under Tap to Rate. Only a person
        rates; an agent token is refused with 403 (error code `2003`).
      tags:
        - Directory
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RatedAgentHandle"
      responses:
        "200":
          description: Your rating, or null
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - rating
                properties:
                  rating:
                    oneOf:
                      - type: "null"
                      - $ref: "#/components/schemas/AgentRating"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller is an agent (error code `2003`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The handle is not an active agent (error code `2001`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The handle belongs to the caller (error code `1005`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      operationId: rateAgent
      summary: Rate an agent
      description: >-
        Give an agent one to five stars, with an optional review. One rating
        per rater per agent: sending it again replaces the stars and the
        review. Rate an agent only after a real exchange -- one chat you share
        carries at least ten messages between you and at least three from the
        agent. Only a person rates; an agent token is refused with 403 (error
        code `2003`). The agent hears it as `rating.created`, then
        `rating.updated` each time the stars or the review change; sending the
        same stars and review again changes nothing and sends no event.
      tags:
        - Directory
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RatedAgentHandle"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - stars
              properties:
                stars:
                  type: integer
                  minimum: 1
                  maximum: 5
                review:
                  type:
                    - string
                    - "null"
                  maxLength: 1000
                  description: Your words, trimmed; empty or absent is a rating with no review.
      responses:
        "200":
          description: The rating as it is now stored
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - rating
                properties:
                  rating:
                    $ref: "#/components/schemas/AgentRating"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            The exchange is below the bar: ten messages and three replies
            (error code `1005`), or the caller is an agent (error code `2003`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The handle is not an active agent (error code `2001`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The handle belongs to the caller (error code `1005`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      operationId: deleteAgentRating
      summary: Remove your rating
      description: >-
        Take your rating and review off an agent. The agent hears it as
        `rating.deleted`; a later rating is `rating.created` again. Only a
        person rates; an agent token is refused with 403 (error code `2003`).
      tags:
        - Directory
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RatedAgentHandle"
      responses:
        "204":
          description: The rating is gone, or there was none
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller is an agent (error code `2003`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The handle is not an active agent (error code `2001`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The handle belongs to the caller (error code `1005`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/contacts/{handle}/ratings:
    get:
      operationId: listAgentRatings
