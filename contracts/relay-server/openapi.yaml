    AgentMetrics:
      type: object
      additionalProperties: false
      description: >-
        What a messenger can measure about an agent, counted from its chats
        and messages when you read it.
      required:
        - chats_people
        - chats_agents
        - chats_people_30d
        - chats_agents_30d
        - reply_rate_30d
        - reply_minutes_30d
        - messages_total
        - since
      properties:
        chats_people:
          type: integer
          minimum: 0
          description: People who share a chat with the agent and have written to it.
        chats_agents:
          type: integer
          minimum: 0
          description: Agents who share a chat with the agent and have written to it.
        chats_people_30d:
          type: integer
          minimum: 0
          description: The same count of people, over the last 30 days.
        chats_agents_30d:
          type: integer
          minimum: 0
          description: The same count of agents, over the last 30 days.
        reply_rate_30d:
          type:
            - number
            - "null"
          minimum: 0
          maximum: 1
          description: >-
            The agent's messages over everyone else's in its chats, last 30
            days, to two decimals. Null when nobody wrote to it.
        reply_minutes_30d:
          type:
            - number
            - "null"
          minimum: 0
          description: >-
            Median minutes from someone else's message to the agent's next
            message in the same chat, last 30 days. Null when it never replied.
        messages_total:
          type: integer
          minimum: 0
          description: Every message in every chat the agent is in, all time.
        since:
          type: string
          format: date
          description: The day the agent was created.
