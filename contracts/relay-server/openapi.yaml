          description: Cursor for fetching the next page of results (null if no more results)
    ButtonItem:
      type: object
      description: |
        One button in a `buttons` part. A tap on a plain button sends its
        `label` back as the person's next message: one `text` part whose value
        is the label, with `reply_to` naming the `buttons` part. A `url`
        button opens the page in the browser and sends nothing.
      required:
        - label
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          description: The page a link button opens instead of sending its label.
        label:
          type: string
          minLength: 1
          maxLength: 80
          description: The button's visible text, and what a tap sends
    ButtonItemResponse:
      type: object
      description: One button as read back
      required:
        - label
      properties:
        url:
          type: string
        label:
          type: string
    ButtonsPart:
      type: object
      description: |
        A vertical stack of 1 to 5 buttons drawn under the message. Only an
        agent can send one, and a message carries at most one. Send a `text`
        part beside it that asks the question. Reactions to this part return
        422. The only reply it accepts is a tap: one `text` part equal to one
        of its plain buttons' labels, sent by the user. The group disappears
        once the person taps a plain button, the way a quick reply does; a
        `url` button never puts it away, since its tap sends nothing.
      required:
        - type
        - items
      properties:
        type:
          type: string
          enum:
            - buttons
        items:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: "#/components/schemas/ButtonItem"
    ButtonsPartResponse:
      type: object
      description: A buttons part as read back
      required:
        - type
        - items
        - reactions
      properties:
        type:
          type: string
          enum:
            - buttons
        items:
          type: array
          items:
            $ref: "#/components/schemas/ButtonItemResponse"
        reactions:
          type:
            - array
            - "null"
          description: Reactions on this message part
          items:
            $ref: "#/components/schemas/Reaction"
    FormOption:
      type: object
      additionalProperties: false
      required:
        - value
        - label
      properties:
        value:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
          description: Stable case-sensitive value, unique within this field.
        label:
          type: string
          minLength: 1
          maxLength: 30
          pattern: '^(?![\s\p{Cf}]*$)\S(?:[\s\S]*\S)?$'
    FormTextField:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - label
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
          description: Unique across every page of this form. Responses use this id as the answer key.
        type:
          type: string
          enum:
            - text
        label:
          type: string
          minLength: 1
          maxLength: 20
          pattern: '^(?![\s\p{Cf}]*$)\S(?:[\s\S]*\S)?$'
        placeholder:
          type: string
          description: Text shown before the user enters or chooses a value.
        required:
          type: boolean
          default: false
        max_length:
          type: integer
          maximum: 9007199254740991
          minimum: 1
          description: Maximum Unicode scalar characters. Defaults to 30 for single-line and 300 for multiline text; a positive explicit value overrides the default.
        multiline:
          type: boolean
          default: false
          description: Allow line breaks and a native multiline text field.
        keyboard:
          type: string
          enum:
            - default
            - email
            - phone
            - number
            - url
          default: default
          description: 'The keyboard iOS shows. `email` and `phone` also check the answer: an email address, or an E.164 number such as +13135550123. A wrong one is refused with 422/2006. `number` and `url` only choose the keyboard.'

    FormSelectField:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - label
        - options
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
          description: Unique across every page of this form. Responses use this id as the answer key.
        type:
          type: string
          enum:
            - select
        label:
          type: string
          minLength: 1
          maxLength: 30
          pattern: '^(?![\s\p{Cf}]*$)\S(?:[\s\S]*\S)?$'
        placeholder:
          type: string
          description: Text shown before the user enters or chooses a value.
        required:
          type: boolean
          default: false
        multiple:
          type: boolean
          default: false
          description: Return an array of values in source-option order when true, otherwise one string.
        options:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/FormOption"
    FormPickerField:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - label
        - options
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
          description: Unique across every page of this form. Responses use this id as the answer key.
        type:
          type: string
          enum:
            - picker
        label:
          type: string
          minLength: 1
          maxLength: 20
          pattern: '^(?![\s\p{Cf}]*$)\S(?:[\s\S]*\S)?$'
        placeholder:
          type: string
          description: Text shown before the user enters or chooses a value.
        required:
          type: boolean
          default: false
        options:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/FormOption"
    FormDateField:
      type: object
      additionalProperties: false
      description: Collect a valid Gregorian calendar date as YYYY-MM-DD, independent of time zone.
      required:
        - id
        - type
        - label
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
          description: Unique across every page of this form. Responses use this id as the answer key.
        type:
          type: string
          enum:
            - date
        label:
          type: string
          minLength: 1
          maxLength: 40
          pattern: '^(?![\s\p{Cf}]*$)\S(?:[\s\S]*\S)?$'
        placeholder:
          type: string
          description: Text shown before the user enters or chooses a value.
        required:
          type: boolean
          default: false
          description: Maximum answer length. A calendar date is ten characters. Defaults to 10.
        min_date:
          type: string
          format: date
          pattern: ^(?!0000)[0-9]{4}-[0-9]{2}-[0-9]{2}$
          default: "1900-01-01"
          description: Earliest date the person can choose, YYYY-MM-DD. An earlier answer is refused. Not after max_date (checked by Relay).
        max_date:
          type: string
          format: date
          pattern: ^(?!0000)[0-9]{4}-[0-9]{2}-[0-9]{2}$
          default: "2100-12-31"
          description: Latest date the person can choose, YYYY-MM-DD. A later answer is refused.

    FormField:
      oneOf:
        - $ref: "#/components/schemas/FormTextField"
        - $ref: "#/components/schemas/FormSelectField"
        - $ref: "#/components/schemas/FormPickerField"
        - $ref: "#/components/schemas/FormDateField"
      discriminator:
        propertyName: type
        mapping:
          text: "#/components/schemas/FormTextField"
          select: "#/components/schemas/FormSelectField"
          picker: "#/components/schemas/FormPickerField"
          date: "#/components/schemas/FormDateField"
    FormPage:
      type: object
      additionalProperties: false
      description: One native form page. Pages appear in array order.
      required:
        - id
        - title
        - fields
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 19
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
          description: Unique page id.
        title:
          type: string
          minLength: 1
          maxLength: 80
          pattern: '^(?![\s\p{Cf}]*$)\S(?:[\s\S]*\S)?$'
        fields:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/FormField"
    FormSplash:
      type: object
      additionalProperties: false
      description: Optional introduction before the first field page.
      required:
        - button_title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 80
          pattern: '^(?![\s\p{Cf}]*$)\S(?:[\s\S]*\S)?$'
        text:
          type: string
          minLength: 0
          maxLength: 4096
        button_title:
          type: string
          minLength: 1
          maxLength: 35
          pattern: '^(?![\s\p{Cf}]*$)\S(?:[\s\S]*\S)?$'
    FormReceivedMessage:
      type: object
      additionalProperties: false
      description: Optional received card text. Each native page uses its own page title.
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 512
          pattern: '^(?![\s\p{Cf}]*$)\S(?:[\s\S]*\S)?$'
        subtitle:
          type: string
          minLength: 0
          maxLength: 512
    FormReplyMessage:
      type: object
      additionalProperties: false
      description: Optional answered card subtitle. The answered title is Form sent.
      required:
        - title
      properties:
        title:
          type: string
          enum:
            - Form sent
        subtitle:
          type: string
          minLength: 0
          maxLength: 512
    FormAnswers:
      type: object
      propertyNames:
        type: string
        minLength: 1
        maxLength: 100
        pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
      additionalProperties:
        oneOf:
          - type: string
          - type: array
            maxItems: 20
            uniqueItems: true
            items:
              type: string
              minLength: 1
              maxLength: 100
              pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
      description: Answers keyed by source field id. Text, date, picker and single select use a string; multi-select uses unique option values in source order. A one-option multi-select represents opt-in. Optional unanswered fields may be omitted or use an empty value. Source fields enforce required values, max_length and allowed choices.
    FormPart:
      type: object
      additionalProperties: false
      description: Agent-only form with ordered pages. One form per Message; only text parts may sit beside it (no media, link, place, data, buttons, selection, rich_card or carousel). Optional plain text beside it is an ordinary message. The user advances with Next and Back, reviews a summary when show_summary is true, and sends once. Reopening after Send shows read-only answers. The preview is the text part when present, otherwise received_message.title or title. Page ids and field ids must be unique.
      required:
        - type
        - title
        - pages
      properties:
        type:
          type: string
          enum:
            - form
        title:
          type: string
          minLength: 1
          maxLength: 80
          pattern: '^(?![\s\p{Cf}]*$)\S(?:[\s\S]*\S)?$'
        pages:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/FormPage"
        show_summary:
          type: boolean
          default: false
        splash:
          $ref: "#/components/schemas/FormSplash"
        received_message:
          $ref: "#/components/schemas/FormReceivedMessage"
        reply_message:
          $ref: "#/components/schemas/FormReplyMessage"
    FormPartResponse:
      type: object
      required:
        - type
        - value
        - title
        - pages
        - has_responded
        - answers
        - reactions
      properties:
        type:
          type: string
          enum:
            - form
        value:
          type: string
          readOnly: true
          description: The form's received_message.title, else its title; the words a client that does not draw the form shows in its place.
        title:
          type: string
          minLength: 1
          maxLength: 80
          pattern: '^(?![\s\p{Cf}]*$)\S(?:[\s\S]*\S)?$'
        pages:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/FormPage"
        show_summary:
          type: boolean
          default: false
        splash:
          $ref: "#/components/schemas/FormSplash"
        received_message:
          $ref: "#/components/schemas/FormReceivedMessage"
        reply_message:
          $ref: "#/components/schemas/FormReplyMessage"
        has_responded:
          type: boolean
          readOnly: true
          description: Whether the authenticated user has durably answered. False for agent viewers. Same-key retries return the original response; a different-key second answer returns 409/1005. Source message.upserted refreshes this user’s devices.
        answers:
          anyOf:
            - $ref: "#/components/schemas/FormAnswers"
            - type: "null"
          readOnly: true
          description: This viewer’s answers, null before answering or when the answer Message no longer exists; always null for agent viewers. Agents receive the form_response in the answer Message instead.
        reactions:
          type: "null"
    FormResponsePart:
      type: object
      additionalProperties: false
      description: User-only metadata, exactly the second part after plain text with value Form sent. Requires reply_to.message_id and explicit part_index targeting a visible form in the same Chat. Source validation rejects unknown ids, invalid dates, wrong answer types, too-long or missing required values, and unknown, duplicate or out-of-order choices. Malformed envelopes return 400/1005, invalid source answers 422/2006, repeated answers with another key 409/1005.
      required:
        - type
        - answers
      properties:
        type:
          type: string
          enum:
            - form_response
        answers:
          $ref: "#/components/schemas/FormAnswers"
    FormResponsePartResponse:
      allOf:
        - $ref: "#/components/schemas/FormResponsePart"
      description: Persisted field-keyed answers delivered in normal Message events. Contributes no fallback text and cannot receive reactions.
    SelectionOption:
      type: object
      additionalProperties: false
      required: [label]
      description: A list picker row. Supply id or the legacy value alias. If both are supplied they must match. IDs are case-sensitive and unique across the whole picker. New id-bearing labels have at most 24 characters; value-only inputs retain the legacy 80-character label limit.
      allOf:
        - anyOf:
            - required: [id]
            - required: [value]
        - if:
            required: [id]
          then:
            properties:
              label:
                maxLength: 24
          else:
            properties:
              value:
                maxLength: 100
                pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 200
          description: Stable row identifier, returned in selected_ids after the user answers.
        value:
          type: string
          minLength: 1
          maxLength: 200
          description: Legacy alias for id. Without id, accepts the existing 1 to 100 character ASCII token. When both are supplied, must equal id.
        label:
          type: string
          minLength: 1
          pattern: '\S'
          maxLength: 80
          description: Visible label, trimmed before storage; limits count the label as sent. At most 24 characters when id is supplied, or 80 for a legacy value-only row.
        subtitle:
          type: string
          maxLength: 72
          description: Optional row description, trimmed before storage; blank after trimming is stored as absent.
        image_url:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 2048
          description: Optional HTTPS image displayed beside the option inside the picker.
    SelectionOptionResponse:
      type: object
      required: [id, value, label]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 200
          description: Stable row identifier. For a legacy option, equals its value.
        value:
          type: string
          minLength: 1
          maxLength: 200
          description: Compatibility alias, equal to id.
        label:
          type: string
          minLength: 1
          maxLength: 80
          description: Stored label. Legacy labels can exceed the new 24-character input limit.
        subtitle:
          type: string
          maxLength: 72
        image_url:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 2048
    SelectionSection:
      type: object
      additionalProperties: false
      required: [title, options]
      properties:
        title:
          type: string
          minLength: 1
          pattern: '\S'
          maxLength: 24
          description: Section heading, trimmed before storage.
        options:
          type: array
          minItems: 1
          maxItems: 25
          items:
            $ref: "#/components/schemas/SelectionOption"
    SelectionSectionResponse:
      type: object
      required: [title, options]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 24
        options:
          type: array
          minItems: 1
          maxItems: 25
          items:
            $ref: "#/components/schemas/SelectionOptionResponse"
    SelectionReplyMessage:
      type: object
      additionalProperties: false
      required: [title]
      description: Source-owned text for the answered bubble. Copied by the server into the answer metadata when supplied on the prompt. Does not replace the portable selected-label text.
      properties:
        title:
          type: string
          minLength: 1
          pattern: '\S'
          maxLength: 512
          description: Answered bubble title, trimmed before storage.
        subtitle:
          type: string
          maxLength: 512
          description: Optional answered bubble subtitle, trimmed before storage; blank after trimming is stored as absent.
    SelectionPart:
      type: object
      additionalProperties: false
      description: Agent-only list picker. One selection per Message, never with buttons. Supply either flat options or titled sections, with 1 to 25 options total. title is the question shown on the card and sheet. Optional subtitle supplies the card's second line. multiple defaults to true; false permits exactly one selected option. Checking an option sends nothing; only Submit sends the answer. A user answers a given selection once; reopening shows the saved choice without allowing changes. Optional reply_message supplies the answered bubble's title and subtitle; without it, clients show the prompt title and chosen labels. A text part is optional and appears as an ordinary message above the card. Preview, notification and fallback text is the Message's text part when present, otherwise title. Every length limit counts the text as sent, before trimming.
      required: [type, title]
      oneOf:
        - required: [options]
          not:
            required: [sections]
        - required: [sections]
          not:
            required: [options]
      properties:
        type:
          type: string
          enum: [selection]
        title:
          type: string
          minLength: 1
          pattern: '\S'
          maxLength: 60
          description: The question, trimmed before storage. The card's title in the chat and the sheet's title.
        subtitle:
          type: string
          maxLength: 512
          description: Optional card subtitle, trimmed before storage; blank after trimming is stored as absent.
        multiple:
          type: boolean
          default: true
          description: Whether the user may choose more than one option before submitting.
        options:
          type: array
          minItems: 1
          maxItems: 25
          items:
            $ref: "#/components/schemas/SelectionOption"
        sections:
          type: array
          minItems: 1
          maxItems: 10
          description: Titled groups in display order. At most 25 options across all sections.
          items:
            $ref: "#/components/schemas/SelectionSection"
        reply_message:
          $ref: "#/components/schemas/SelectionReplyMessage"
    SelectionPartResponse:
      type: object
      required: [type, title, options, has_responded, selected_values, selected_ids, reactions]
      properties:
        type:
          type: string
          enum: [selection]
        title:
          type: string
          description: The question, as the agent sent it after trimming.
        subtitle:
          type: string
          maxLength: 512
        multiple:
          type: boolean
          default: true
        options:
          type: array
          minItems: 1
          maxItems: 25
          description: All options in display order, including options from sections. Retained for clients that do not display groups.
          items:
            $ref: "#/components/schemas/SelectionOptionResponse"
        sections:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: "#/components/schemas/SelectionSectionResponse"
        reply_message:
          $ref: "#/components/schemas/SelectionReplyMessage"
        selected_values:
          type: [array, "null"]
          readOnly: true
          items:
            type: string
          description: The values the authenticated viewer chose, in source-option order, identical on every one of that user's devices; null until the viewer answers, when the answer Message no longer exists, and always for an agent viewer.
        selected_ids:
          type: [array, "null"]
          readOnly: true
          items:
            type: string
          description: The authenticated viewer's selected option IDs in source order. Equal to selected_values, including for legacy options; null under the same conditions.
        has_responded:
          type: boolean
          readOnly: true
          description: Whether the authenticated viewer has durably answered this part. Claims are scoped to the responding user, never to an agent viewer. Existing Chat admission rules still apply, including at most one user per Chat. Acceptance advances this viewer's Message updated_at and sends a message.upserted for the source prompt to this user's devices.
        reactions:
          type: "null"
    SelectionResponsePart:
      type: object
      additionalProperties: false
      description: User-only metadata, exactly the second part after plain text. Requires explicit reply_to message_id and part_index targeting a visible selection in the same Chat. Values are unique, nonempty, known and in source-option order. A prompt with multiple false accepts exactly one value. Optional selected_ids must equal selected_values. Canonical text is literal '• ' plus each selected source label joined with '\n'. Exact legacy source labels joined with ', ' also remain accepted. The server owns the returned selected_ids and reply_message; callers cannot supply answered-bubble text in metadata. A different-key second response returns 409/1005; same-key retries retain existing Message idempotency semantics.
      required: [type, selected_values]
      properties:
        type:
          type: string
          enum: [selection_response]
        selected_values:
          type: array
          minItems: 1
          maxItems: 25
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 200
        selected_ids:
          type: array
          minItems: 1
          maxItems: 25
          uniqueItems: true
          description: Optional ID alias array. When present, must equal selected_values in the same order.
          items:
            type: string
            minLength: 1
            maxLength: 200
    SelectionResponsePartResponse:
      type: object
      required: [type, selected_values, selected_ids]
      description: Persisted selection metadata; contributes no fallback text and cannot receive reactions. selected_ids is source-derived. When the source supplies reply_message, it is copied into this answer so its bubble text remains available independently of the source.
      properties:
        type:
          type: string
          enum: [selection_response]
        selected_values:
          type: array
          minItems: 1
          maxItems: 25
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 200
        selected_ids:
          type: array
          minItems: 1
          maxItems: 25
          uniqueItems: true
          readOnly: true
          items:
            type: string
            minLength: 1
            maxLength: 200
        reply_message:
          $ref: "#/components/schemas/SelectionReplyMessage"
          readOnly: true
    RichCardMedia:
      type: object
      additionalProperties: false
      description: A card's picture or video. Drawn across the card's full width at `height` and opened full screen when tapped.
      required: [type, url]
      properties:
        type:
          type: string
          enum: [image, video]
        url:
          type: string
          format: uri
          maxLength: 2048
          pattern: '^https://'
          description: A public https URL of the file.
        thumbnail_url:
          type: string
          format: uri
          maxLength: 2048
          pattern: '^https://'
          description: A public https URL of a still shown before a video plays.
        height:
          type: string
          enum: [short, medium, tall]
          default: medium
          description: short is 112 pt, medium 168 pt, tall 264 pt.
    RichCardSuggestionLabel:
      type: string
      minLength: 1
      maxLength: 25
      pattern: '\S'
      description: The button's words, 1 to 25 characters after trimming; never only whitespace.
    RichCardSuggestion:
      description: |
        One suggestion on a card. A `reply` is sent back as the person's own message: a `text` part equal to
        `label`, then a `suggestion_response` part carrying `id`, replying to the card part. Every other type is an
        action the person's phone does itself and sends nothing back.
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, label, id]
          properties:
            type: { type: string, enum: [reply] }
            label: { $ref: "#/components/schemas/RichCardSuggestionLabel" }
            id:
              type: string
              minLength: 1
              maxLength: 256
              description: Your identifier for this reply, returned in the person's suggestion_response. Unique within the part, across every card of a carousel (checked by Relay; JSON Schema cannot express it).
        - type: object
          additionalProperties: false
          required: [type, label, url]
          properties:
            type: { type: string, enum: [open_url] }
            label: { $ref: "#/components/schemas/RichCardSuggestionLabel" }
            url:
              type: string
              format: uri
              maxLength: 2048
              pattern: '^[hH][tT][tT][pP][sS]?://'
              description: An http or https URL. Other schemes are refused.
            application:
              type: string
              enum: [browser, webview]
              description: webview opens the page inside Relay; browser, the default, opens the in-app browser the same way a link does.
        - type: object
          additionalProperties: false
          required: [type, label, phone_number]
          properties:
            type: { type: string, enum: [dial] }
            label: { $ref: "#/components/schemas/RichCardSuggestionLabel" }
            phone_number: { type: string, pattern: '^\+[1-9]\d{1,14}$', description: 'E.164, for example +12223334444.' }
        - type: object
          additionalProperties: false
          required: [type, label]
          description: Opens Apple Maps at latitude and longitude (both or neither), or searches for `query`. One of the two is required.
          dependentRequired:
            latitude: [longitude]
            longitude: [latitude]
          anyOf:
            - required: [latitude]
            - required: [query]
          properties:
            type: { type: string, enum: [view_location] }
            label: { $ref: "#/components/schemas/RichCardSuggestionLabel" }
            latitude: { type: number, minimum: -90, maximum: 90 }
            longitude: { type: number, minimum: -180, maximum: 180 }
            name: { type: string, minLength: 1, maxLength: 256, pattern: '\S', description: The pin's name. }
            query: { type: string, minLength: 1, maxLength: 256, pattern: '\S' }
        - type: object
          additionalProperties: false
          required: [type, label]
          description: Opens the person's location picker; what they pick arrives as their own `place` message.
          properties:
            type: { type: string, enum: [share_location] }
            label: { $ref: "#/components/schemas/RichCardSuggestionLabel" }
        - type: object
          additionalProperties: false
          required: [type, label, start_time, end_time, title]
          description: Opens the phone's new-event sheet, filled in; the person saves it. `end_time` is not before `start_time` (checked by Relay; JSON Schema cannot express it).
          properties:
            type: { type: string, enum: [create_calendar_event] }
            label: { $ref: "#/components/schemas/RichCardSuggestionLabel" }
            start_time: { type: string, format: date-time }
            end_time: { type: string, format: date-time, description: Not before start_time. }
            title: { type: string, minLength: 1, maxLength: 100, pattern: '\S' }
            description: { type: string, maxLength: 500 }
    CardContent:
      type: object
      additionalProperties: false
      description: One card. Needs at least one of media, title or description.
      anyOf:
        - required: [media]
        - required: [title]
        - required: [description]
      properties:
        media:
          $ref: "#/components/schemas/RichCardMedia"
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '\S'
          description: 1 to 200 characters after trimming; never only whitespace.
        description:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: '\S'
          description: 1 to 2000 characters after trimming; never only whitespace.
        suggestions:
          type: array
          minItems: 1
          maxItems: 4
          description: 1 to 4 suggestions. Every reply `id` is unique within the part (checked by Relay; JSON Schema cannot express it).
          items:
            $ref: "#/components/schemas/RichCardSuggestion"
    RichCardPart:
      type: object
      additionalProperties: false
      description: |
        Agent-only. One card: a picture or video, a title, a description and up to 4 suggestions, drawn as one
        balloon. A message carries at most one rich_card or
        carousel and never a selection beside it; a text part beside it is an ordinary message above the card, and a
        `buttons` part beside it draws as reply pills under it, which leave once the person answers the card or the
        pills. The card's own suggestions persist: the person can tap them again. Preview, notification and fallback
        text is the message's text part when it has one, else the card's title, else its description.
      required: [type]
      anyOf:
        - required: [media]
        - required: [title]
        - required: [description]
      properties:
        type:
          type: string
          enum: [rich_card]
        media:
          $ref: "#/components/schemas/RichCardMedia"
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '\S'
          description: 1 to 200 characters after trimming; never only whitespace.
        description:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: '\S'
          description: 1 to 2000 characters after trimming; never only whitespace.
        suggestions:
          type: array
          minItems: 1
          maxItems: 4
          description: 1 to 4 suggestions. Every reply `id` is unique within the part (checked by Relay; JSON Schema cannot express it).
          items:
            $ref: "#/components/schemas/RichCardSuggestion"
    RichCardPartResponse:
      type: object
      description: A rich_card part as read back.
      required: [type, reactions]
      properties:
        type:
          type: string
          enum: [rich_card]
        media:
          $ref: "#/components/schemas/RichCardMedia"
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '\S'
          description: 1 to 200 characters after trimming; never only whitespace.
        description:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: '\S'
          description: 1 to 2000 characters after trimming; never only whitespace.
        suggestions:
          type: array
          minItems: 1
          maxItems: 4
          description: 1 to 4 suggestions. Every reply `id` is unique within the part (checked by Relay; JSON Schema cannot express it).
          items:
            $ref: "#/components/schemas/RichCardSuggestion"
        reactions:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/Reaction"
    CarouselPart:
      type: object
      additionalProperties: false
      description: |
        Agent-only. 2 to 10 cards the person swipes sideways; every card is drawn as tall as the
        tallest. The rich_card rules apply, and reply ids are unique across all cards (checked by Relay; JSON Schema
        cannot express it). Fallback text is the first card's title or description.
      required: [type, cards]
      properties:
        type:
          type: string
          enum: [carousel]
        card_width:
          type: string
          enum: [small, medium]
          default: medium
          description: small is 180 pt; medium, the default, is as wide as a single card, up to 350 pt and never wider than a text bubble.
        cards:
          type: array
          minItems: 2
          maxItems: 10
          items:
            $ref: "#/components/schemas/CardContent"
    CarouselPartResponse:
      type: object
      description: A carousel part as read back.
      required: [type, card_width, cards, reactions]
      properties:
        type:
          type: string
          enum: [carousel]
        card_width:
          type: string
          enum: [small, medium]
        cards:
          type: array
          items:
            $ref: "#/components/schemas/CardContent"
        reactions:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/Reaction"
    SuggestionResponsePart:
      type: object
      additionalProperties: false
      description: User-only, exactly the second part after a plain `text` part equal to the reply's label. Requires reply_to message_id and part_index naming a rich_card or carousel part in the same Chat, and `id` must be one of its reply suggestions. The person sends only `id`; Relay stores the reply's `label` beside it. Reactions to this part return 422.
      required: [type, id]
      properties:
        type:
          type: string
          enum: [suggestion_response]
        id:
          type: string
          minLength: 1
          maxLength: 256
    SuggestionResponsePartResponse:
      type: object
      description: The reply the person tapped, as the agent reads it. Contributes no fallback text.
      required: [type, id, label]
      properties:
        type:
          type: string
          enum: [suggestion_response]
        id:
          type: string
          description: The reply suggestion's id, as the agent sent it.
        label:
          type: string
          description: The reply suggestion's label, as the card showed it.
    PaymentRecurring:
      type: object
      additionalProperties: false
      description: A subscription's renewal cadence, read from its Stripe Price.
      required: [interval, interval_count]
      properties:
        interval:
          type: string
          enum: [day, week, month, year]
        interval_count:
          type: integer
          minimum: 1
          description: Intervals per renewal (3 with `month` is quarterly).
    PaymentStatus:
      type: string
      description: A payment request's lifecycle. It leaves `requested` exactly once, and only on Stripe's word or your cancel.
      enum: [requested, succeeded, canceled, expired]
    PaymentPart:
      type: object
      additionalProperties: false
      description: "A request to pay, drawn as a card. `checkout_url` is the only field: pass back exactly what `POST /v1/payment_requests` returned. The card's amount and title are read from that request, never from the message, so a card cannot show a figure its checkout will not charge. Sent only by the agent that created the request, while it is `requested`; must be the only part of its message. Another sender gets 403 (error code `2003`); a checkout_url that is not one of your requests gets 404; a request that is no longer `requested` gets 409. A request with `category=digital_goods` sent to a person whose devices report only storefronts outside the United States returns 422 (error code `2006`)."
      required: [type, checkout_url]
      properties:
        type:
          type: string
          enum: [payment]
        checkout_url:
          type: string
          maxLength: 2048
    PaymentPartResponse:
      type: object
      description: A payment card as every reader sees it, read from the payment request. `status` changes in place.
      required: [type, payment_request_id, checkout_url, amount, currency, description, category, mode, status, reactions]
      properties:
        type:
          type: string
          enum: [payment]
        payment_request_id:
          type: string
          format: uuid
        checkout_url:
          type: string
        amount:
          type: integer
          description: In the currency's minor units. For a subscription, what the first period costs.
        currency:
          type: string
        description:
          type: string
          description: The card's title line.
        category:
          $ref: "#/components/schemas/PaymentCategory"
        mode:
          type: string
          enum: [payment, subscription]
        recurring:
          $ref: "#/components/schemas/PaymentRecurring"
        image_url:
          type: string
          description: The request's product picture, when it has one; the card shows it.
        status:
          $ref: "#/components/schemas/PaymentStatus"
        reactions:
          type:
            - array
            - "null"
          description: Reactions on this message part. Only a person can react to a payment.
          items:
            $ref: "#/components/schemas/Reaction"
    PaymentReceiptPartResponse:
      type: object
      description: "The payer's receipt. When a payment request succeeds, Relay adds one message from the person who paid at the bottom of the chat, a reply to the `payment` card, carrying this part; your agent receives it as `message.received` like any message. The payer is the person who opened the payment in the Relay app, or, when Relay does not know who paid, the one person in a chat that holds the card. A group chat with no known payer gets no receipt. Expired and canceled requests add no message. Only Relay writes this part; sending one returns 400."
      required: [type, payment_request_id, description, amount, currency, mode, reactions]
      properties:
        type:
          type: string
          enum: [payment_receipt]
        payment_request_id:
          type: string
          format: uuid
        description:
          type: string
        amount:
          type: integer
          description: What was paid, in the currency's minor units. For a subscription, what the first period cost.
        currency:
          type: string
        mode:
          type: string
          enum: [payment, subscription]
        recurring:
          $ref: "#/components/schemas/PaymentRecurring"
        reactions:
          type:
            - array
            - "null"
          description: Reactions on this message part
          items:
            $ref: "#/components/schemas/Reaction"
    PaymentCategory:
      type: string
      enum: [physical_goods, digital_goods, donation]
      description: |-
        What is being paid for, the same three values as PayPal Orders v2 `items[].category` (PHYSICAL_GOODS, DIGITAL_GOODS, DONATION; developer.paypal.com/docs/api/orders/v2/). The App Store Review Guidelines (developer.apple.com/app-store/review/guidelines/) decide where each can be paid:
        - `physical_goods`: physical goods, and services used in the real world, such as a haircut or a ride (3.1.3(e)). Payable anywhere.
        - `digital_goods`: anything used in an app or online. A person pays by opening the link in Safari, and only on the United States storefront (3.1.1(a)); sending one to a person whose devices report only other storefronts returns 422 (error code `2006`). A tip to an agent or a creator is `digital_goods` (3.1.1: tips to digital content providers use In-App Purchase).
        - `donation`: money for a charity or a fundraiser. Collected outside the app, on any storefront (3.2.2(iv): such apps "may only collect funds outside of the app, such as via Safari…").
    PaymentDiscount:
      type: object
      additionalProperties: false
      description: Subscription mode only. One coupon or one promotion code from your connected Stripe account, never both.
      properties:
        coupon:
          type: string
          description: The id of a coupon on your connected Stripe account.
        promotion_code:
          type: string
          description: The id of a promotion code (`promo_...`), not the code a customer types.
        label:
          type: string
          description: Your own name for the discount, stored and returned with the request.
    CreatePaymentRequestRequest:
      type: object
      additionalProperties: false
      required: [description, category]
      properties:
        amount:
          type: integer
          description: Payment mode (required there). What to charge, in the currency's minor units; Stripe's minimum and maximum apply. Omit in subscription mode.
        currency:
          type: string
          pattern: '^[A-Za-z]{3}$'
          description: Payment mode (required there). A 3-letter ISO 4217 code, returned lowercase. Omit in subscription mode; the price carries it.
        description:
          type: string
          minLength: 1
          maxLength: 32
          description: The card's title line and the checkout's product name. Trimmed; 1 to 32 characters.
        category:
          $ref: "#/components/schemas/PaymentCategory"
        metadata:
          type: object
          maxProperties: 49
          additionalProperties:
            type: string
          description: Up to 49 keys of your own, returned on the request and on every `payment.*` event, and stamped on the Stripe objects created on your account. Keys starting with `relay_` are reserved; Relay adds `relay_payment_request_id`.
        mode:
          type: string
          enum: [payment, subscription]
          default: payment
          description: "`payment` collects one charge of `amount` in `currency`. `subscription` starts an auto-renewing subscription from a recurring `price_id` on your connected Stripe account; the person pays the first period at checkout and Stripe renews it from then on."
        price_id:
          type: string
          description: Subscription mode (required there). An active recurring Price on your connected Stripe account.
        quantity:
          type: integer
          minimum: 1
          description: Subscription mode only. Units of the price. Defaults to 1.
        customer_id:
          type: string
          description: An existing Customer on your connected Stripe account (`cus_...`) to attach the request to.
        discount:
          $ref: "#/components/schemas/PaymentDiscount"
        image_url:
          type: string
          maxLength: 2048
          description: "Optional product picture, an HTTPS address, like Telegram sendInvoice `photo_url` (core.telegram.org/bots/api#sendinvoice). Relay copies it into its own image store, the way it stores agent pictures, and returns Relay's address. Shown on the card and on the pay page."
    PaymentRequestStripe:
      type: object
      description: The ids of the Stripe objects on your connected account, your join keys into your own Stripe Dashboard, API and webhooks.
      required: [payment_intent_id]
      properties:
        payment_intent_id:
          type: string
          description: The one PaymentIntent the person pays (`pi_...`).
        customer_id:
          type: string
          description: The Customer the request is attached to. Always set in subscription mode; in payment mode only when you passed `customer_id`.
        subscription_id:
          type: string
          description: Subscription mode (`sub_...`).
    PaymentRequest:
      type: object
      required: [id, object, status, mode, amount, application_fee_amount, currency, description, category, checkout_url, expires_at, metadata, stripe, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        object:
          type: string
          enum: [payment_request]
        status:
          $ref: "#/components/schemas/PaymentStatus"
        mode:
          type: string
          enum: [payment, subscription]
        amount:
          type: integer
          description: What the person is charged at checkout, in minor units. In subscription mode, what the first period costs after any discount.
        application_fee_amount:
          type: integer
          description: Relay's 5% fee on `amount`, in minor units, taken from the payment by Stripe; in subscription mode, the first period's fee. 0 when 5% rounds to nothing.
        currency:
          type: string
        description:
          type: string
        category:
          $ref: "#/components/schemas/PaymentCategory"
        checkout_url:
          type: string
          description: Relay's pay page for this request, `https://pay.relayapp.im/<token>`. Anyone holding it can pay the request. Send it back unchanged in a `payment` part.
        expires_at:
          type: string
          format: date-time
          description: When the request stops accepting payment and moves to `expired`, 23 hours after it was created.
        metadata:
          type: object
          additionalProperties:
            type: string
        image_url:
          type: string
          description: The product picture, on Relay's image host. Absent without one.
        price_id:
          type: string
          description: Subscription mode.
        quantity:
          type: integer
          description: Subscription mode.
        interval:
          type: string
          enum: [day, week, month, year]
          description: Subscription mode.
        interval_count:
          type: integer
          description: Subscription mode.
        discount:
          $ref: "#/components/schemas/PaymentDiscount"
        stripe:
          $ref: "#/components/schemas/PaymentRequestStripe"
        paid_at:
          type: string
          format: date-time
          description: Absent until the request succeeds.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PaymentRequestList:
      type: object
      required: [payment_requests, next_cursor]
      properties:
        payment_requests:
          type: array
          items:
            $ref: "#/components/schemas/PaymentRequest"
        next_cursor:
          type:
            - string
            - "null"
    PaymentSucceededWebhook:
      allOf:
        - $ref: "#/components/schemas/WebhookEnvelopeBase"
        - type: object
          required:
            - event_type
            - data
          properties:
            event_type:
