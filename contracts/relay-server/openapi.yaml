    SetActivityRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 1024
          x-max-graphemes: 21
          x-max-utf8-bytes: 1024
          description: One line of 1 to 21 visible characters, at most 1024 UTF-8 bytes. Surrounding whitespace is removed.
          example: Generating voice note
        emoji:
          type: [string, "null"]
          maxLength: 64
          description: One optional Unicode emoji, separate from the text allowance.
          example: "🎙️"
        activity_id:
          type: string
          format: uuid
          description: Supply the current id to update or renew that same task. Omit to start or replace.
    ChatActivity:
      type: object
      required: [id, text, emoji, updated_at, expires_at]
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of this activity, retained when it is renewed.
        text:
          type: string
          description: Current short activity description.
        emoji:
          type: [string, "null"]
          description: Optional Unicode emoji.
        updated_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: Hide the activity at this time unless a newer renewal has arrived.
    ChatActivityState:
      type: object
      required: [chat_id, agent_id, version, activity]
      properties:
        chat_id:
          type: string
          format: uuid
        agent_id:
          type: string
          format: uuid
          description: Agent Contact that owns the activity in this chat.
        version:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          description: Monotonically increasing state version, retained after clearing.
        activity:
          anyOf:
            - $ref: "#/components/schemas/ChatActivity"
            - type: "null"
    AgentMe:
      type: object
      required:
        - id
        - handle
        - kind
        - display_name
        - owner
        - owner_people
        - calls_enabled
      properties:
        id:
          type: string
          format: uuid
          description: The agent's Contact identifier.
        handle:
          type: string
          description: The agent's Relay Handle.
        kind:
          type: string
          enum:
            - agent
        display_name:
          type: string
          description: The agent's display name.
        owner:
          description: Who owns this agent. Null for an agent that no organization or person owns.
          anyOf:
            - $ref: "#/components/schemas/HandleOwner"
            - type: "null"
        owner_people:
          type: array
          description: >-
            The people who administer this agent: the owning person, or for an
            organization's agent the person who issued the calling Agent Token.
            Empty when none can be resolved.
          items:
            $ref: "#/components/schemas/OwnerPerson"
        calls_enabled:
          type: boolean
          description: >-
            Whether this server takes Calls. When false, POST
            /v1/chats/{chatId}/calls answers 503 and nothing is written, so
            do not start or offer a Call.
    HandleOwner:
      oneOf:
        - $ref: "#/components/schemas/OrganizationOwner"
        - $ref: "#/components/schemas/UserOwner"
      discriminator:
        propertyName: kind
        mapping:
          organization: "#/components/schemas/OrganizationOwner"
          user: "#/components/schemas/UserOwner"
    OrganizationOwner:
      type: object
      additionalProperties: false
      required:
        - kind
        - name
        - verified
      properties:
        kind:
          type: string
          enum:
            - organization
        name:
          type:
            - string
            - "null"
          description: The organization's name in Relay Console. Null until the organization has one.
        verified:
          type: boolean
          description: Whether Relay has verified the organization.
    UserOwner:
      type: object
      additionalProperties: false
      required:
        - kind
        - handle
        - display_name
      properties:
        kind:
          type: string
          enum:
            - user
        handle:
          type:
            - string
            - "null"
          description: The owning person's Relay Handle. Null when the person has no Relay account.
        display_name:
          type:
            - string
            - "null"
          description: The owning person's display name. Null when the person has no Relay account.
        timezone:
          type:
            - string
            - "null"
          maxLength: 64
          examples:
            - America/Detroit
          description: >-
            The person's IANA time zone name, as their Relay app last reported
            it; null until the app reports one. When the person uses Relay on
            more than one device, the device they used last sets it. Null when the person has no Relay account. Timestamps stay in UTC;
            use this to read them in the person's local time.
        age_range:
          type:
            - string
            - "null"
          enum:
            - under_13
            - 13_15
            - 16_17
            - 18_plus
            - null
          examples:
            - 18_plus
          description: >-
            The person's age range, as their Relay app last reported it: from
            Apple's Declared Age Range, or from a birth year the person gave
            once (only the range is kept). Null until the app reports one. Null when the person has no Relay account.
            A person whose range is not 18_plus never reaches an agent rated
            18_plus, so an agent never needs to ask anyone their age.
        links:
          type:
            - array
            - "null"
          maxItems: 5
          uniqueItems: true
          items:
            type: string
            format: uri
            maxLength: 2048
            pattern: "^https://"
          examples:
            - - https://github.com/ana
              - https://www.instagram.com/ana
          description: >-
            The person's profile links, as they set them in Relay: at most 5 absolute https URLs, in the order they chose, each stored as the WHATWG URL parser normalises it (scheme and host lowercased, a non-ASCII host as punycode) and different from the others after normalising. Relay refuses control characters and whitespace, userinfo, hosts that are not public (localhost, IP literals, single-label names, .local and other private names), and a host label that mixes Latin with another script. Empty when they set none. Null when the person has no Relay account. Relay sends no platform name; read the site from the URL.
        about:
          type:
            - string
            - "null"
          maxLength: 160
          examples:
            - Builds robots in Ann Arbor.
          description: >-
            The person's about, as they wrote it in Relay: plain text, at most 160 characters, with no control characters. Null when they wrote none or have no Relay account.
    OwnerPerson:
      type: object
