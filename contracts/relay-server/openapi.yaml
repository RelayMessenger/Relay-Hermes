    schemas-LinkPartResponse:
      type: object
      description: A rich link preview part
      required:
        - type
        - value
      properties:
        type:
          type: string
          enum:
            - link
          description: Indicates this is a rich link preview part
        value:
          type: string
          description: The URL
    schemas-MediaPartResponse:
      type: object
      description: A media attachment part
      required:
        - type
        - id
        - url
        - filename
        - mime_type
        - size_bytes
      properties:
        type:
          type: string
          enum:
            - media
          description: Indicates this is a media attachment part
        id:
          type: string
          format: uuid
          description: Unique attachment identifier
        url:
          type: string
          format: uri
          description: Opaque Relay download URL for the Attachment.
        filename:
          type: string
          description: Original filename
        mime_type:
          type: string
          description: MIME type of the file
        size_bytes:
          type: integer
          description: File size in bytes
    schemas-TextPartResponse:
      type: object
      description: A text message part
      required:
        - type
        - value
      properties:
        type:
          type: string
          enum:
            - text
          description: Indicates this is a text message part
        value:
          type: string
          description: The text content
        mentions:
          type:
            - array
            - "null"
          description: Mentions ordered by position in the text; null when none. Handles reflect the participant's current handle.
          items:
            type: object
            required: [id, handle, is_me, range]
            properties:
              id:
                type: string
                format: uuid
                description: Stable participant Contact ID, unchanged when the handle changes.
              handle:
                type: string
                description: The target participant's current Relay Handle.
              is_me:
                type: boolean
                description: Whether the mention addresses the recipient reading this message.
              range:
                type: array
                items:
                  type: integer
                  minimum: 0
                minItems: 2
                maxItems: 2
                description: Inclusive-exclusive [start, end) UTF-16 code-unit range in value; the whole value when the send omitted mention_range.
        mention:
          deprecated: true
          type:
            - string
            - "null"
        mention_range:
          deprecated: true
          type:
            - array
            - "null"
          items:
            type: integer
          minItems: 2
          maxItems: 2
          description: |
            Character range `[start, end)` in `value` highlighted as the mention, as sent.
            `null` when the send omitted it (the whole `value` is highlighted) or the part
            carries no mention.
            *Characters are measured as UTF-16 code units. Most characters count as 1; some emoji count as 2.*
  responses:
    AgentOnly:
      description: Forbidden - the route requires an active agent principal (error code `2003`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Invalid request - validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The request conflicts with the current state of the resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Forbidden - no access to this resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    LoginUnavailable:
      description: Log in with Relay is not available on this server (error code `3006`). Nothing was changed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PaymentsUnavailable:
      description: Payments are not available on this server right now, or Stripe could not be reached (error code `3006`). Nothing was created or changed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    CallsUnavailable:
      description: Calls are switched off on this server (error code `3006`, "Calls are not available on this server."). No Call was created and nothing was written. `calls_enabled` on GET /v1/me is false while this holds.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PaymentRequired:
      description: The authenticated Agent is not entitled to this operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyMessages:
      description: |-
        The sender is posting too fast. Relay caps one sender at 10 messages
        in 10 seconds in one conversation and 300 in 10 seconds across all of
        them, which allows a burst and then refuses with error code `2008`.
        Wait `retry_after` seconds, which the `Retry-After` header repeats,
        and send again. Nothing was stored, so a retry cannot duplicate the
        Message.
      headers:
        Retry-After:
          description: Seconds to wait before sending again.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              status: 429
              code: 2008
              message: Too many messages. Try again shortly.
              doc_url: https://docs.relayapp.im/error/codes/2xxx/2008
              retry_after: 10
            success: false
    Unauthorized:
      description: Unauthorized - missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: Unprocessable Entity - request is valid but cannot be processed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        Bearer token authentication. Include your API token in the Authorization header.

        Format: `Authorization: Bearer <your-token>`
