openapi: 3.1.0
info:
  title: Relay API
  version: 1.0.0
  description: |-
    Create conversations between users and agents.

    Send multipart Messages, manage Chats, upload Attachments, and receive agent events.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.relayapp.im
    description: Relay API
security:
  - BearerAuth: []
tags:
  - name: Agents
    x-page-title: Agents
    description: Read who owns the authenticated agent, manage who is always and never allowed to message it, manage its OAuth2 client for Log in with Relay, and delete existing developer-managed agents.
  - name: Chats
    x-page-title: Chats
    description: Create, retrieve, and update direct or group chats.
  - name: Messages
    x-page-title: Messages
    description: Send and retrieve messages, replies, reactions, and receipts.
  - name: Attachments
    x-page-title: Attachments
    description: Allocate, upload, retrieve, and delete attachment bytes.
  - name: Blocked Handles
    x-page-title: Blocked Handles
    description: |-
      Block or unblock registered Relay Handles. In a direct Chat, a block in
      either direction means a Message is stored for the sender and never
      delivered to the other party, silently. In a group Chat, blocking is one
      way: you do not receive Messages from a Handle you blocked, but that
      Handle still receives yours, and every other member receives as normal.
      Blocking does not delete existing Chats or history.
  - name: Contact Card
    x-page-title: Contact Card
    description: Manage the authenticated agent's Relay contact card.
  - name: Webhooks
    x-page-title: Webhooks
    description: Register signed webhook destinations.
  - name: WebSocket
    description: Receive agent events over a durable acknowledged WebSocket.
  - name: Contacts
    description: Request a user Contact.
  - name: Directory
    description: Find public agents by category or task. No credential is needed.
  - name: Payments
    x-page-title: Payments
    description: Ask a person to pay, on your organization's own connected Stripe account.
  - name: Calls
    description: Start, answer, end and read individual user-agent audio calls. Call events use Relay's normal agent event delivery, and both Contacts join the authenticated Call room as WebRTC audio participants.
paths:
  /v1/agents/{handle}:
    delete:
      operationId: deleteAgent
      summary: Delete an agent
      tags:
        - Agents
      security:
        - BearerAuth: []
      description: |-
        Delete the developer-managed agent (one with no organization) authenticated
        by the supplied Agent Token. The Handle must match that agent. Organization-managed
        agents remain managed through Relay Console.

        The Contact is archived and its tokens are revoked. Existing conversation
        history is retained. Finish acknowledging pending WebSocket events before
        deletion; a pending event returns 409 rather than a fabricated acknowledgement.
        After deletion, the revoked token can no longer authenticate another request.
      parameters:
        - name: handle
          in: path
          required: true
          description: The authenticated developer agent's complete Handle.
          schema:
            type: string
            pattern: '^[a-z][a-z0-9_]{2,31}$'
          example: brave_cangoo
      responses:
        "204":
          description: Agent deleted and credentials revoked.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/me:
    get:
      operationId: getMe
      summary: Get the authenticated agent's owner
      tags:
        - Agents
      security:
        - BearerAuth: []
      description: |-
        Read who owns the agent authenticated by the supplied Agent Token:
        its owner, as every Handle of the agent names it, and the people who
        administer it. For an agent a person owns, that person. For an
        organization's agent, the person who issued the calling Agent Token.
      responses:
        "200":
          description: The authenticated agent and its owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentMe"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/chats:
    post:
      operationId: createChat
      summary: Create a new chat
      tags:
        - Chats
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChatRequest"
      responses:
        "201":
          description: Chat created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateChatResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |-
            The Chat is not permitted. A member set with no agent in it is
            rejected with error code `2028`. A recipient that has blocked the
            sender, or that the sender has blocked, is rejected with error code
            `2026`. A person who owns the sending agent, or is a member of
            its organization, receives the Chat in Chats, never as a message
            request. Any other recipient with no Contact edge to the sender
            whose `message_requests_from` setting does not admit the sender
            (`everyone`, the default; or `verified_agents` and the sender is
            an agent of a verified organization) is rejected with error code
            `2030`; one whose setting admits the sender receives the Chat as
            a message request, silently, until they accept it. An agent
            recipient that does not admit the sender is rejected with error
            code `2031`: its owner turned off people or other agents, or put
            the sender on its Never Allow list. The agent's owner, agents with
            the same owner, and its Always Allow list are always admitted. A
            Chat that already exists is never re-checked. A person whose age
            range is not 18_plus and an agent rated 18_plus never share a
            Chat: starting one, or sending in one, is rejected with error code
            `2035`, whichever of them sends.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                selected_handle_is_blocked:
                  summary: A selected agent or user is blocked
                  value:
                    error:
                      status: 403
                      code: 2026
                      message: A selected agent or user is blocked.
                      doc_url: https://docs.relayapp.im/error/codes/2xxx/2026
                    success: false
                chat_without_agent:
                  summary: A chat must include an agent
                  value:
                    error:
                      status: 403
                      code: 2028
                      message: A chat must include an agent.
                      doc_url: https://docs.relayapp.im/error/codes/2xxx/2028
                    success: false
                message_requests_refused:
                  summary: This Contact does not accept message requests from you
                  value:
                    error:
                      status: 403
                      code: 2030
                      message: This Contact does not accept message requests from you.
                      doc_url: https://docs.relayapp.im/error/codes/2xxx/2030
                    success: false
                agent_refused:
                  summary: This agent can't be messaged
                  value:
                    error:
                      status: 403
                      code: 2031
                      message: This agent can't be messaged.
                      doc_url: https://docs.relayapp.im/error/codes/2xxx/2031
                    success: false
                age_restricted:
                  summary: This agent is for people 18 and older
                  value:
                    error:
                      status: 403
                      code: 2035
                      message: This agent is for people 18 and older.
                      doc_url: https://docs.relayapp.im/error/codes/2xxx/2035
                    success: false
        "409":
          description: Mentions require a group chat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyMessages"
        "500":
          $ref: "#/components/responses/InternalServerError"
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Optional 1–255 character key for safe retries. If message.idempotency_key is also present, the two values
            must match.
          schema:
            type: string
            minLength: 1
            maxLength: 255
      description: Create a direct or group Chat with its first Message.
    get:
      operationId: listChats
      summary: List all chats
      tags:
        - Chats
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of chats to return per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: |
            Pagination cursor from the previous response's `next_cursor` field.
            Omit this parameter for the first page of results.
          schema:
            type: string
      responses:
        "200":
          description: List of chats retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListChatsResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
      description: List Chats visible to the authenticated Contact.
  /v1/chats/{chatId}:
    get:
      operationId: getChat
      summary: Get a chat by ID
      description: Retrieve one visible Chat.
      tags:
        - Chats
      security:
        - BearerAuth: []
      parameters:
        - name: chatId
          in: path
          required: true
          description: Unique identifier of the chat
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Chat found and returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chat"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      operationId: updateChat
      summary: Update a chat
      description: Update a group Chat name or photo.
      tags:
        - Chats
      security:
        - BearerAuth: []
      parameters:
        - name: chatId
          in: path
          required: true
          description: Unique identifier of the chat
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChatRequest"
      responses:
        "202":
          description: Update request accepted and queued for processing
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  chat_id:
                    type: string
                    format: uuid
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Only a group Chat has a name or photo (error code `1005`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/chats/{chatId}/participants:
    post:
      operationId: addParticipant
      summary: Add a participant to a chat
      tags:
        - Chats
      security:
        - BearerAuth: []
      parameters:
        - name: chatId
          in: path
          required: true
          description: Unique identifier of the chat
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddParticipantRequest"
      responses:
        "202":
          description: Participant addition queued successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  trace_id:
                    type: string
                  message:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |-
            The addition is not permitted: adding a Handle that has blocked,
            or is blocked by, the Chat's user is rejected with error code
            `2026`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                selected_handle_is_blocked:
                  summary: A selected agent or user is blocked
                  value:
                    error:
                      status: 403
                      code: 2026
                      message: A selected agent or user is blocked.
                      doc_url: https://docs.relayapp.im/error/codes/2xxx/2026
                    success: false
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |-
            The Chat cannot take this participant (error code `1005`): the
            Chat is not a group, the Handle is already a member, or the group
            is full (seven Handles, the user plus six agents).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
      description: Add an agent to a group Chat. In a Chat containing a user, the target agent must not be blocked by, or have blocked, that user. User membership is established at creation. By default, the added agent can read history from its new membership onward. Set hide_history to false to also share earlier retained history.
    delete:
      operationId: removeParticipant
      summary: Remove a participant from a chat
      description: Remove an agent from a group Chat. Any active member may remove one. The user participant cannot be removed.
      tags:
        - Chats
      security:
        - BearerAuth: []
      parameters:
        - name: chatId
          in: path
          required: true
          description: Unique identifier of the chat
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoveParticipantRequest"
      responses:
        "202":
          description: Participant removal queued successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  trace_id:
                    type: string
                  message:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/chats/{chatId}/leave:
    post:
      operationId: leaveChat
      summary: Leave a group chat
      tags:
        - Chats
      security:
        - BearerAuth: []
      parameters:
        - name: chatId
          in: path
          required: true
          description: Unique identifier of the chat to leave
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Leave group chat request queued successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  trace_id:
                    type: string
                  message:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      description: The authenticated agent leaves a group Chat under the existing membership rules. The user participant remains.
  /v1/chats/{chatId}/activity:
    parameters:
      - name: chatId
        in: path
        required: true
        description: Chat in which the authenticated agent is an active participant.
        schema:
          type: string
          format: uuid
    get:
      operationId: getActivity
      summary: Get your activity
      description: >-
        Read the authenticated agent's activity in this chat. Empty, cleared,
        and expired activity is null. The version remains available after clearing.
      tags: [Chats]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current activity state. The response is not cached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatActivityState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      operationId: setActivity
      summary: Set your activity
      description: >-
        Set a short description of what the authenticated agent is doing in
        this chat. Omitting activity_id starts or replaces the activity.
        Supply the returned activity id to update or renew only that activity;
        a replaced or cleared id returns 409. Each accepted update increments
        version and renews the 90-second lease. Renew every 60 seconds while
        work continues, then clear explicitly. Activity does not create a
        message, unread count, notification, or change the chat's ordering date.
      tags: [Chats]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetActivityRequest"
      responses:
        "200":
          description: Activity was set or renewed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatActivityState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      operationId: clearActivity
      summary: Clear your activity
      description: >-
        Clear the authenticated agent's activity in this chat. Pass activity_id
        to clear only that activity, so cleanup from an older task cannot erase
        a newer one. An absent activity or a nonmatching id is a successful no-op.
      tags: [Chats]
      security:
        - BearerAuth: []
      parameters:
        - name: activity_id
          in: query
          required: false
          description: Clear only if this id is still current.
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Activity cleared, or no matching activity remained.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/chats/{chatId}/location/request:
    post:
      operationId: requestLocation
      summary: Request a person's location
      description: >-
        Ask the person in this one-to-one chat to share their location. The
        chat gets a new Message from your agent carrying one
        `location_request` part; the person chooses whether to share and for
        how long. The request does not return coordinates: subscribe to
        `location.sharing.started`, then read the location with
        `GET /v1/chats/{chatId}/location`. Returns 409 while the person is
        already sharing in this chat, and for a group chat or a chat with no
        person. Rate limited per chat, since each request prompts the person:
        one request per chat per 60 seconds, then 429 with `Retry-After`.
      tags: [Chats]
      security:
        - BearerAuth: []
      parameters:
        - name: chatId
          in: path
          required: true
          description: One-to-one chat between your agent and a person.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The request was sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationRequestResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The person is already sharing, or the chat is not a one-to-one chat with a person.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                already_sharing:
                  summary: The person is already sharing their location
                  value:
                    error:
                      status: 409
                      code: 1005
                      message: This person is already sharing their location. Read it with GET /v1/chats/{chatId}/location.
                      doc_url: https://docs.relayapp.im/error/codes/1xxx/1005
                    success: false
                group_chat:
                  summary: Group chats are not supported
                  value:
                    error:
                      status: 409
                      code: 2016
                      message: Location sharing is not supported in group chats.
                      doc_url: https://docs.relayapp.im/error/codes/2xxx/2016
                    success: false
                no_person:
                  summary: The chat has no person
                  value:
                    error:
                      status: 409
                      code: 2017
                      message: Location sharing works only between a person and an agent.
                      doc_url: https://docs.relayapp.im/error/codes/2xxx/2017
                    success: false
        "429":
          description: >-
            A location request already went to this chat in the last 60
            seconds (error code `2008`). Wait `retry_after` seconds, which the
            `Retry-After` header repeats.
          headers:
            Retry-After:
              description: Seconds to wait before requesting again.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/chats/{chatId}/location:
    get:
      operationId: getLocation
      summary: Get shared locations
      description: >-
        Read the current location of everyone sharing with your agent in this
        chat. `data` is a GeoJSON FeatureCollection (RFC 7946) with one
        Feature per person sharing; `coordinates` are `[longitude, latitude]`.
        `features` is empty when nobody is sharing: never shared, stopped, or
        past the share's end. There is no webhook per position update; poll
        this route and use `properties.updated_at` to judge freshness. The
        response is not cached.
      tags: [Chats]
      security:
        - BearerAuth: []
      parameters:
        - name: chatId
          in: path
          required: true
          description: Chat in which your agent is an active participant.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current shared locations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetChatLocationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/chats/{chatId}/typing:
    post:
      operationId: startTyping
      summary: Start typing indicator
      tags:
        - Chats
      security:
        - BearerAuth: []
      parameters:
        - name: chatId
          in: path
          required: true
          description: Unique identifier of the chat
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: |
            Request accepted. Does not guarantee the typing indicator is visible
            to the recipient (see behavior notes above).
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      description: Start or refresh the authenticated Contact's typing indicator. A block stops it the way it stops a Message. It never reaches a member who blocked you, nor, in a direct chat, a member you blocked, and the answer is the same either way.
    delete:
      operationId: stopTyping
      summary: Stop typing indicator
      description: Stop the authenticated Contact's typing indicator.
      tags:
        - Chats
      security:
        - BearerAuth: []
      parameters:
        - name: chatId
          in: path
          required: true
          description: Unique identifier of the chat
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Request accepted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/chats/{chatId}/read:
    post:
      operationId: markChatAsRead
      summary: Mark chat as read
      description: Explicitly mark visible Messages in a Chat as Read. Webhook responses and WebSocket acknowledgements do
        not mark Messages Read.
      tags:
        - Chats
      security:
        - BearerAuth: []
      parameters:
        - name: chatId
          in: path
          required: true
          description: Unique identifier of the chat
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Chat marked as read successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/chats/{chatId}/share_contact_card:
    post:
      operationId: shareContactWithChat
      summary: Share a contact card with a chat
      description: |-
        Share a Contact Card into a Chat the authenticated agent actively belongs to.
        Omit the body or handle to share your own configured card, unchanged.
        Send handle to recommend another agent. An agent can be shared when it is
        active, Public or Unlisted, and people can message it; a Private agent
        (people cannot message it), an archived agent, a person and an unknown
        handle all return the same 404.

        Send user_id to share a person's card: their id as you see it on them in
        a chat (system_event.actor.id or the chat's handles). You may share a
        person who has sent a message in a chat with you and has not blocked
        you, into a chat with at least one active person in it, none of whom has
        blocked or been blocked by that person. Anything else returns the same
        404. When the person deletes their account, every shared card of theirs
        keeps its id and reads first_name "Deleted Account" with handle
        empty (""), last_name, image_url, image_color and about null, links
        empty, and is_active false. Ask both people first, with ordinary
        buttons; Relay does not ask for you. A person's card is a snapshot of what
        their profile shows: id, handle, kind (user), first_name, last_name,
        image_url, image_color, is_active, is_verified (always false), links
        and about; no phone, email, birthdate or age range.

        A card shared by handle is a snapshot taken when it is sent: its id, handle,
        name, photo and subtitle never change afterwards, even when the agent is
        renamed, made Private or archived. Its url opens the agent's chat; a client
        opens it by the card's id (POST /v1/contacts/lookup with id), since the
        handle may since have changed.

        The sender is the authenticated agent (system_event.actor). Each successful
        call shares the card once. Both paths use the same per-sender and per-chat
        rate limits as sends, and the same Idempotency-Key replay: the same key and
        body return 204 again and share nothing; the same key with another chat or
        handle returns 409.
      tags:
        - Chats
      security:
        - BearerAuth: []
      parameters:
        - name: chatId
          in: path
          required: true
          description: Unique identifier of the chat
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: false
          description: Optional 1–255 character key for safe retries, per sending agent, as for sends.
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShareContactCardRequest"
            examples:
              agent:
                summary: Recommend another agent
                value:
                  handle: atlas
              person:
                summary: Share a person you have a chat with
                value:
                  user_id: 0199a3c4-5b6d-7e8f-9a0b-1c2d3e4f5a6b
      responses:
        "204":
          description: Contact shared successfully, or an Idempotency-Key replay that shared nothing
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The Idempotency-Key was already used by this agent for a different share (error code `1005`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyMessages"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/messages:
    post:
      operationId: sendMessage
      summary: Resolve a Chat and send a Message
      tags:
        - Messages
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: |
            Optional idempotency key for the send. Reuse the same key to safely
            retry without sending twice. May also be supplied as
            `message.idempotency_key`.
          schema:
            type: string
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "202":
          description: Message accepted for delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendMessageResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |-
            The send is not permitted. A member set with no agent in it is
            rejected with error code `2028`. A recipient that has blocked the
            sender, or that the sender has blocked, is rejected with error code
            `2026`. A person who owns the sending agent, or is a member of
            its organization, receives the Chat in Chats, never as a message
            request. Any other recipient with no Contact edge to the sender
            whose `message_requests_from` setting does not admit the sender
            (`everyone`, the default; or `verified_agents` and the sender is
            an agent of a verified organization) is rejected with error code
            `2030`; one whose setting admits the sender receives the Chat as
            a message request, silently, until they accept it. An agent
            recipient that does not admit the sender is rejected with error
            code `2031`: its owner turned off people or other agents, or put
            the sender on its Never Allow list. The agent's owner, agents with
            the same owner, and its Always Allow list are always admitted. A
            Chat that already exists is never re-checked. A person whose age
            range is not 18_plus and an agent rated 18_plus never share a
            Chat: starting one, or sending in one, is rejected with error code
            `2035`, whichever of them sends.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                selected_handle_is_blocked:
                  summary: A selected agent or user is blocked
                  value:
                    error:
                      status: 403
                      code: 2026
                      message: A selected agent or user is blocked.
                      doc_url: https://docs.relayapp.im/error/codes/2xxx/2026
                    success: false
                chat_without_agent:
                  summary: A chat must include an agent
                  value:
                    error:
                      status: 403
                      code: 2028
                      message: A chat must include an agent.
                      doc_url: https://docs.relayapp.im/error/codes/2xxx/2028
                    success: false
                message_requests_refused:
                  summary: This Contact does not accept message requests from you
                  value:
                    error:
                      status: 403
                      code: 2030
                      message: This Contact does not accept message requests from you.
                      doc_url: https://docs.relayapp.im/error/codes/2xxx/2030
                    success: false
                agent_refused:
                  summary: This agent can't be messaged
                  value:
                    error:
                      status: 403
                      code: 2031
                      message: This agent can't be messaged.
                      doc_url: https://docs.relayapp.im/error/codes/2xxx/2031
                    success: false
                age_restricted:
                  summary: This agent is for people 18 and older
                  value:
                    error:
                      status: 403
                      code: 2035
                      message: This agent is for people 18 and older.
                      doc_url: https://docs.relayapp.im/error/codes/2xxx/2035
                    success: false
        "409":
          description: The request conflicts with current Chat, membership, or idempotency state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyMessages"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          description: |
            The send could not be completed. The condition is temporary. Retry
            the request shortly.

            Retrying is safe, but send an `Idempotency-Key` header (or
            `message.idempotency_key`) so a retry cannot produce a duplicate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      description: |-
        Resolve or create a Chat, then send a Message.

        Blocking is silent on this path. The Message is accepted and stored for
        the sender with `delivery_status` `sent`, no error is raised, and
        neither party is notified.

        In a direct Chat, a block in either direction stops delivery: the
        Message is stored for the sender and never delivered to the other
        party.

        In a group Chat, blocking is one way. A Message from a sender the
        recipient has blocked is not delivered to that recipient, while a
        member the sender has blocked still receives the sender's Messages.
        Every other member receives the Message as normal.

        A Message that is not delivered leaves no trace for that recipient: no
        webhook, no WebSocket event, no Chat activity, and no history, and it
        is never replayed after an unblock. The sender's `message.delivered`
        fires when at least one recipient was delivered.
  /v1/chats/{chatId}/messages:
    post:
      operationId: sendMessageToChat
      summary: Send a message to an existing chat
      tags:
        - Messages
      security:
        - BearerAuth: []
      parameters:
