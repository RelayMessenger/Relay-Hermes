      properties:
        recipe:
          type: object
          additionalProperties: false
          required: [emoji]
          properties:
            emoji:
              type: object
              additionalProperties: false
              required: [emoji]
              properties:
                emoji:
                  type: string
                  description: Exactly one emoji, validated by Relay's existing image-recipe parser.
        background:
          $ref: "#/components/schemas/AgentImageBackground"
    AgentPhotoImageRecipe:
      type: object
      additionalProperties: false
      required: [recipe]
      properties:
        recipe:
          type: object
          additionalProperties: false
          required: [image]
          properties:
            image:
              type: object
              additionalProperties: false
    ContactLookup:
      type: object
      additionalProperties: false
      required:
        - id
        - handle
        - display_name
        - kind
        - image_url
        - image_color
        - verified
      properties:
        id:
          type: string
          format: uuid
        handle:
          type: string
        display_name:
          type: string
        kind:
          type: string
          enum:
            - user
            - agent
        image_url:
          type:
            - string
            - "null"
          format: uri
        image_color:
          type:
            - string
            - "null"
          pattern: ^[0-9A-F]{6}$
        verified:
          type: boolean
        name:
          type: string
          description: The agent's name. Agents only.
        subtitle:
          type:
            - string
            - "null"
          maxLength: 60
          description: The one line under the agent's name. Agents only.
        description:
          type:
            - string
            - "null"
          maxLength: 2000
          description: The agent's paragraph. Agents only.
        category:
          oneOf:
            - $ref: "#/components/schemas/AgentCategory"
            - type: "null"
          description: Agents only.
        skills:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/AgentSkill"
          description: Agents only.
        visibility:
          $ref: "#/components/schemas/AgentVisibility"
        rive:
          description: >-
            The Rive file this agent shows in its calls, so the app can load it
            before a call. Null when it has none. Present only when kind is
            agent.
          anyOf:
            - $ref: "#/components/schemas/RiveFile"
            - type: "null"
        creator:
          description: >-
            Who made the agent: its organization, by the name the organization
            gave in the Relay Console. Null when the organization has not
            given a name. Agents only.
          oneOf:
            - type: object
              additionalProperties: false
              required:
                - kind
                - name
                - handle
              properties:
                kind:
                  type: string
                  enum:
                    - organization
                name:
                  type: string
                  minLength: 1
                handle:
                  type:
                    - string
                    - "null"
                  description: The maker's Relay Handle. Null until Relay stores one.
            - type: "null"
        can_message:
          type: boolean
          description: >-
            Handle lookups only. Whether the caller may start a Chat with this
            contact now, by the same rule a send applies. Reading it changes
            nothing.
        timezone:
          type:
            - string
            - "null"
          maxLength: 64
          examples:
            - America/Detroit
          description: >-
            The person's IANA time zone name, as their Relay app last reported
            it; null until the app reports one. When the person uses Relay on
            more than one device, the device they used last sets it. Present only when kind is user. Timestamps stay in UTC;
            use this to read them in the person's local time.
        age_range:
          type:
            - string
            - "null"
          enum:
            - under_13
            - 13_15
            - 16_17
            - 18_plus
            - null
          examples:
            - 18_plus
          description: >-
            The person's age range, as their Relay app last reported it: from
            Apple's Declared Age Range, or from a birth year the person gave
            once (only the range is kept). Null until the app reports one. Present only when kind is user.
            A person whose range is not 18_plus never reaches an agent rated
            18_plus, so an agent never needs to ask anyone their age.
        links:
          type: array
          maxItems: 5
          uniqueItems: true
          items:
            type: string
            format: uri
            maxLength: 2048
            pattern: "^https://"
          examples:
            - - https://github.com/ana
              - https://www.instagram.com/ana
          description: >-
            The person's profile links, as they set them in Relay: at most 5 absolute https URLs, in the order they chose, each stored as the WHATWG URL parser normalises it (scheme and host lowercased, a non-ASCII host as punycode) and different from the others after normalising. Relay refuses control characters and whitespace, userinfo, hosts that are not public (localhost, IP literals, single-label names, .local and other private names), and a host label that mixes Latin with another script. Empty when they set none. Present only when kind is user. Relay sends no platform name; read the site from the URL.
        about:
          type:
            - string
            - "null"
          maxLength: 160
          examples:
            - Builds robots in Ann Arbor.
          description: >-
            The person's about, as they wrote it in Relay: plain text, at most 160 characters, with no control characters. Null when they wrote none. Present only when kind is user.
        age_rating:
          $ref: "#/components/schemas/AgentAgeRating"
    AgentCategory:
      type: string
