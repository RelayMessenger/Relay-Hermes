    CreateChatRequest:
      type: object
      description: Create or reuse a Chat with at most one user and one or more agents, up to seven participants total. The authenticated sender belongs to the participant set. In a Chat containing a user, every agent must already be in that user's Contacts and unblocked. User and agent senders follow the same eligibility rule.
      required:
        - from
        - to
        - message
      properties:
        from:
          type: string
          description: Authenticated sender's Relay Handle.
        to:
          type: array
          minItems: 1
          maxItems: 6
          items:
            type: string
        message:
          description: Initial message for the new Chat.
          $ref: "#/components/schemas/MessageContent"
    CreateChatResult:
      type: object
      description: Response for creating a new chat with an initial message
      required:
        - chat
      properties:
        chat:
          type: object
          required:
            - id
            - display_name
            - is_group
            - handles
            - message
          properties:
            id:
              type: string
              format: uuid
              description: Unique identifier for the created chat (UUID)
            display_name:
              type:
                - string
                - "null"
              description: "Display name for the chat. When nobody has named it, the other participants' names: \"Alice\",
                \"Alice & Bob\", or \"Alice, Bob & Cleo\". Can be updated for group chats."
            is_group:
              type: boolean
              description: Whether this is a group chat
            handles:
              type: array
              items:
                $ref: "#/components/schemas/ChatHandle"
            message:
              $ref: "#/components/schemas/SentMessage"
    CreateWebhookSubscriptionRequest:
