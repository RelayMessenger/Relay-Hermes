        handles:
          type: array
          items:
            $ref: "#/components/schemas/ChatHandle"
        is_group:
          type: boolean
          description: Whether this is a group chat
          default: false
        created_at:
          type: string
          format: date-time
          description: When the chat was created
        updated_at:
          type: string
          format: date-time
          description: When the chat was last updated
    ChatCreatedEvent:
      type: object
      required:
        - id
        - display_name
        - handles
        - is_group
        - created_at
        - updated_at
      properties:
