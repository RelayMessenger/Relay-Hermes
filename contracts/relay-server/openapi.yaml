    SystemPartResponse:
      type: object
      additionalProperties: false
      required:
        - type
        - value
        - reactions
      properties:
        type:
          type: string
          enum:
            - system
        value:
          type: string
        reactions:
          type: "null"
    TextPart:
      type: object
      required:
        - type
        - value
      properties:
        type:
          type: string
          enum:
            - text
          description: Indicates this is a text message part
        value:
          type: string
          description: Plain text content, measured in UTF-16 code units for mention ranges.
          minLength: 1
          maxLength: 10000
        mention:
          type:
            - string
            - "null"
          description: Relay Handle mentioned by this text part.
        mention_range:
          type:
            - array
            - "null"
          prefixItems:
            - type: integer
              minimum: 0
            - type: integer
              minimum: 1
          minItems: 2
          maxItems: 2
          description: UTF-16 [start,end) range of the mention inside value.
    TextPartResponse:
      type: object
      description: A text message part
      required:
        - type
        - value
        - reactions
      properties:
        type:
          type: string
          enum:
            - text
          description: Indicates this is a text message part
        value:
          type: string
          description: The text content
        mentions:
          type:
            - array
            - "null"
          description: Mentions ordered by position in the text; null when none. Handles reflect the participant's current handle.
          items:
            type: object
            required: [id, handle, is_me, range]
            properties:
              id:
                type: string
                format: uuid
                description: Stable participant Contact ID, unchanged when the handle changes.
              handle:
                type: string
                description: The target participant's current Relay Handle.
              is_me:
                type: boolean
                description: Whether the mention addresses the recipient reading this message.
              range:
                type: array
                items:
                  type: integer
                  minimum: 0
                minItems: 2
                maxItems: 2
                description: Inclusive-exclusive [start, end) UTF-16 code-unit range in value; the whole value when the send omitted mention_range.
        mention:
          deprecated: true
          type:
            - string
            - "null"
          description: Deprecated mirror of the first mention handle.
        mention_range:
          deprecated: true
          type:
            - array
            - "null"
          prefixItems:
            - type: integer
              minimum: 0
            - type: integer
              minimum: 1
          minItems: 2
          maxItems: 2
          description: Deprecated mirror of the first mention range; null when omitted on send.
        reactions:
          type:
            - array
            - "null"
          description: Reactions on this message part
          items:
            $ref: "#/components/schemas/Reaction"
    TypingContact:
