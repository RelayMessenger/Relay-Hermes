    WebSocketAckFrame:
      type: object
      additionalProperties: false
      required:
        - type
        - through_sequence
      properties:
        type:
          type: string
          enum:
            - ack
        through_sequence:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
    WebSocketDisconnectFrame:
      type: object
      additionalProperties: false
      required:
        - type
        - reason
      properties:
        type:
          type: string
          enum:
            - disconnect
        reason:
          type: string
          enum:
            - revoked
            - heartbeat_timeout
            - restart
            - webhook_configured
    WebSocketErrorFrame:
      type: object
      additionalProperties: false
      required:
        - type
        - code
        - message
        - fatal
        - retryable
      properties:
        type:
          type: string
          enum:
            - error
        code:
          type: string
          enum:
            - invalid_frame
            - ack_out_of_range
            - stale_connection
            - ack_failed
            - delivery_failed
            - full_sync_required
            - full_sync_mismatch
        message:
          type: string
        fatal:
          type: boolean
        retryable:
          type: boolean
    WebSocketEventFrame:
      type: object
      additionalProperties: false
      required:
        - type
        - sequence
        - event
      properties:
        type:
          type: string
          enum:
            - event
        sequence:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
        event:
          $ref: "#/components/schemas/WebhookEnvelopeBase"
    WebSocketFullSyncCompleteFrame:
      type: object
      additionalProperties: false
      required:
        - type
        - through_sequence
      properties:
        type:
          type: string
          enum:
            - full_sync_complete
        through_sequence:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
    WebSocketFullSyncFrame:
      type: object
      additionalProperties: false
      required:
        - type
        - through_sequence
        - reason
      properties:
        type:
          type: string
          enum:
            - full_sync
        through_sequence:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
        reason:
          type: string
          enum:
            - checkpoint_outside_retention
    WebSocketPingFrame:
      type: object
      additionalProperties: false
      required:
        - type
        - sent_at
      properties:
        type:
          type: string
          enum:
            - ping
        sent_at:
          type: string
          format: date-time
    WebSocketPongFrame:
      type: object
      additionalProperties: false
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - pong
    WebSocketReadyFrame:
      type: object
      additionalProperties: false
      required:
        - type
        - connection_id
        - acked_through
        - full_sync_required
        - full_sync_through
        - heartbeat_interval_ms
        - max_in_flight
      properties:
        type:
          type: string
          enum:
            - ready
        connection_id:
          type: string
          format: uuid
        acked_through:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
        full_sync_required:
          type: boolean
        full_sync_through:
          type:
            - string
            - "null"
          pattern: ^(0|[1-9][0-9]*)$
        heartbeat_interval_ms:
          type: integer
          minimum: 1
        max_in_flight:
          type: integer
          minimum: 1
    WebhookEnvelopeBase:
      type: object
      required:
        - api_version
        - webhook_version
        - event_type
        - event_id
        - created_at
        - data
        - trace_id
        - agent_id
      properties:
        api_version:
          type: string
          enum:
            - v1
          description: Relay API version for this webhook envelope.
        webhook_version:
          type: string
          description: Fixed Relay webhook payload version.
          enum:
            - 2026-08-30
        event_type:
          $ref: "#/components/schemas/WebhookEventType"
        event_id:
          type: string
          format: uuid
          description: Unique identifier for this event (for deduplication)
        created_at:
          type: string
          format: date-time
          description: When the event was created
        trace_id:
          type: string
          description: Trace ID for debugging and correlation across systems.
        agent_id:
          type: string
          format: uuid
          description: Contact identifier of the receiving agent.
        data:
          type: object
          description: Event payload. Its shape is selected by event_type.
          additionalProperties: true
    WebhookEventType:
      type: string
      enum:
        - message.sent
        - message.received
        - message.read
        - message.delivered
        - reaction.added
        - reaction.removed
        - participant.added
        - participant.removed
        - chat.created
        - chat.group_name_updated
        - chat.group_icon_updated
        - chat.typing_indicator.started
        - chat.typing_indicator.stopped
        - contact.added
        - contact.removed
    WebhookEventsResult:
      type: object
      required:
        - events
