      allOf:
        - $ref: "#/components/schemas/WebhookEnvelopeBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ContactRemovedEvent"
    CreateChatRequest:
      type: object
      description: Create or reuse a Chat with at most one user and one or more agents, up to seven participants total. The authenticated sender belongs to the participant set. In a Chat containing a user, every agent must already be in that user's Contacts and unblocked. User and agent senders follow the same eligibility rule.
      required:
        - from
        - to
        - message
      properties:
        from:
          type: string
          description: Authenticated sender's Relay Handle.
        to:
          type: array
          minItems: 1
          maxItems: 6
          items:
            type: string
        message:
          description: Initial message for the new Chat.
          $ref: "#/components/schemas/MessageContent"
    CreateChatResult:
      type: object
      description: Response for creating a new chat with an initial message
      required:
        - chat
      properties:
        chat:
          type: object
          required:
            - id
            - display_name
            - is_group
            - handles
            - message
          properties:
            id:
              type: string
              format: uuid
              description: Unique identifier for the created chat (UUID)
            display_name:
              type:
                - string
                - "null"
              description: "Display name for the chat. When nobody has named it, the other participants' names: \"Alice\",
                \"Alice & Bob\", or \"Alice, Bob & Cleo\". Can be updated for group chats."
            is_group:
              type: boolean
              description: Whether this is a group chat
            handles:
              type: array
              items:
                $ref: "#/components/schemas/ChatHandle"
            message:
              $ref: "#/components/schemas/SentMessage"
    CreateWebhookSubscriptionRequest:
      type: object
      required:
        - target_url
        - subscribed_events
      properties:
        target_url:
          type: string
          format: uri
          description: URL where webhook events will be sent. Must be HTTPS.
        subscribed_events:
          type: array
          description: List of event types to subscribe to
          minItems: 1
          items:
            $ref: "#/components/schemas/WebhookEventType"
    DeliveryStatus:
      type: string
      description: Current receipt state. Sent is a client-only handoff state. Delivered means Relay accepted and stored
        the Message. Read means every recipient explicitly marked the Chat Read.
      enum:
        - sent
        - delivered
        - read
    ErrorCode:
      type: integer
      description: Relay API error code.
    ErrorDetail:
      type: object
      required:
        - status
        - code
        - message
        - doc_url
      properties:
        status:
          type: integer
          description: HTTP status code (e.g., 400, 404, 500)
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          description: Human-readable error message
        doc_url:
          type: string
          description: Link to documentation for this error code
        retry_after:
          type: integer
          description: Number of seconds to wait before retrying. Only present on 429 rate limit errors.
    ErrorResponse:
      type: object
      required:
        - error
        - success
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
        success:
          type: boolean
          description: Always false for error responses
        trace_id:
          type: string
          description: Unique trace ID for request tracing and debugging
    GetContactCardResponse:
      type: object
      required:
        - contact_cards
      properties:
        contact_cards:
          type: array
          items:
            $ref: "#/components/schemas/ContactCardItem"
    GetMessagesResult:
      type: object
      required:
        - messages
      properties:
        messages:
          type: array
          description: List of messages
          items:
            $ref: "#/components/schemas/Message"
        next_cursor:
          type:
            - string
            - "null"
          description: |
            Cursor for fetching the next page of results.
            Null if there are no more results to fetch.
            Pass this value as the `cursor` parameter in the next request.
    GetThreadResponse:
      type: object
      description: Response containing messages in a thread with pagination
      required:
        - messages
      properties:
        messages:
          type: array
          description: Messages in the thread, ordered by the specified order parameter
          items:
            $ref: "#/components/schemas/Message"
        next_cursor:
          type:
            - string
            - "null"
          description: Cursor for fetching the next page of results (null if no more results)
    ButtonItem:
      type: object
      description: |
        One button in a `buttons` part. A tap on a plain button sends its
        `label` back as the person's next message: one `text` part whose value
        is the label, with `reply_to` naming the `buttons` part. A `url`
        button opens the page in the browser and sends nothing.
      required:
        - label
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          description: The page a link button opens instead of sending its label.
        label:
          type: string
          minLength: 1
          maxLength: 80
          description: The button's visible text, and what a tap sends
    ButtonItemResponse:
      type: object
      description: One button as read back
      required:
        - label
      properties:
        url:
          type: string
        label:
          type: string
    ButtonsPart:
      type: object
      description: |
        A vertical stack of 1 to 5 buttons drawn under the message. Only an
        agent can send one, and a message carries at most one. Send a `text`
        part beside it that asks the question. Reactions to this part return
        422. The only reply it accepts is a tap: one `text` part equal to one
        of its plain buttons' labels, sent by the user. The group disappears
        once the person taps a plain button, the way a quick reply does; a
        `url` button never puts it away, since its tap sends nothing.
      required:
        - type
        - items
      properties:
        type:
          type: string
          enum:
            - buttons
        items:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: "#/components/schemas/ButtonItem"
    ButtonsPartResponse:
      type: object
      description: A buttons part as read back
      required:
        - type
        - items
        - reactions
      properties:
        type:
          type: string
          enum:
            - buttons
        items:
          type: array
          items:
            $ref: "#/components/schemas/ButtonItemResponse"
        reactions:
          type:
            - array
            - "null"
          description: Reactions on this message part
          items:
            $ref: "#/components/schemas/Reaction"
    LinkPart:
      type: object
      required:
        - type
        - value
      properties:
        type:
          type: string
          enum:
            - link
          description: Indicates this is a rich link preview part
        value:
          type: string
          format: uri
          description: |
            URL to send with a rich link preview. The recipient will see an inline card
            with the page's title, description, and preview image (when available).

            A `link` part must be the **only** part in the message. To send a URL as plain
            text (no preview card), use a `text` part instead.
          minLength: 1
          maxLength: 2048
    LinkPartResponse:
      type: object
      description: A rich link preview part
      required:
        - type
        - value
        - reactions
      properties:
        type:
          type: string
          enum:
            - link
          description: Indicates this is a rich link preview part
        value:
          type: string
          description: The URL
        reactions:
          type:
            - array
            - "null"
          description: Reactions on this message part
          items:
            $ref: "#/components/schemas/Reaction"
    ListBlockedHandlesResult:
      type: object
      required:
        - blocked_handles
      properties:
        blocked_handles:
          type: array
          description: Contacts blocked by the authenticated Contact, newest first.
          items:
            $ref: "#/components/schemas/BlockedHandleEntry"
    ListChatsResult:
      type: object
      required:
        - chats
      properties:
        chats:
          type: array
          description: List of chats
          items:
            $ref: "#/components/schemas/Chat"
        next_cursor:
          type:
            - string
            - "null"
          description: |
            Cursor for fetching the next page of results.
            Null if there are no more results to fetch.
            Pass this value as the `cursor` parameter in the next request.
    ListWebhookSubscriptionsResult:
      type: object
      required:
        - subscriptions
      properties:
        subscriptions:
          type: array
          description: List of webhook subscriptions
          items:
            $ref: "#/components/schemas/WebhookSubscriptionResponse"
    MediaPart:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - media
          description: Indicates this is a media attachment part
        url:
          type: string
          format: uri
          description: Public HTTPS media URL. Relay blocks non-public networks and validates every redirect, response status,
            and declared and actual size. Any file type is accepted; a host that declares no usable Content-Type
            is stored as application/octet-stream.
          pattern: ^https://
        attachment_id:
          type: string
          format: uuid
          description: Reference an Attachment allocated through POST /v1/attachments. Use either url or attachment_id, not both.
    MediaPartResponse:
      type: object
      description: A media attachment part
      required:
        - type
        - id
        - url
        - filename
        - mime_type
        - size_bytes
        - reactions
      properties:
        type:
          type: string
          enum:
            - media
          description: Indicates this is a media attachment part
        id:
          type: string
          format: uuid
          description: Unique attachment identifier
        url:
          type: string
          format: uri
          description: Opaque Relay download URL for the Attachment.
        filename:
          type: string
          description: Original filename
        mime_type:
          type: string
          description: MIME type of the file
        size_bytes:
          type: integer
          description: File size in bytes
        reactions:
          type:
            - array
            - "null"
          description: Reactions on this message part
          items:
            $ref: "#/components/schemas/Reaction"
        duration_ms:
          type:
            - integer
            - "null"
          minimum: 0
          description: Audio or video duration in milliseconds when known.
        width:
          type:
            - integer
            - "null"
          minimum: 1
          description: Pixel width when known. Width and height are supplied together.
        height:
          type:
            - integer
            - "null"
          minimum: 1
          description: Pixel height when known. Width and height are supplied together.
    Message:
      type: object
      required:
        - id
        - chat_id
        - is_from_me
        - delivery_status
        - created_at
        - updated_at
        - is_system_message
      properties:
        id:
          type: string
          description: Unique identifier for the message
          format: uuid
        chat_id:
          type: string
          description: ID of the chat this message belongs to
          format: uuid
        from:
          type:
            - string
            - "null"
          description: Sender Relay Handle.
        from_handle:
          description: The sender of this message as a full handle object
          oneOf:
            - $ref: "#/components/schemas/ChatHandle"
            - type: "null"
        parts:
          type:
            - array
            - "null"
          description: Message parts in order (text, media, and link)
          items:
            oneOf:
              - $ref: "#/components/schemas/TextPartResponse"
              - $ref: "#/components/schemas/MediaPartResponse"
              - $ref: "#/components/schemas/LinkPartResponse"
              - $ref: "#/components/schemas/ButtonsPartResponse"
              - $ref: "#/components/schemas/SystemPartResponse"
        reply_to:
          oneOf:
            - $ref: "#/components/schemas/ReplyTo"
            - type: "null"
        thread:
          description: The thread this Message belongs to, or null when it is not a reply.
          oneOf:
            - $ref: "#/components/schemas/ThreadOriginator"
            - type: "null"
        is_from_me:
          type: boolean
          description: Whether this message was sent by the authenticated user
        delivery_status:
          $ref: "#/components/schemas/DeliveryStatus"
        created_at:
          type: string
          format: date-time
          description: When the message was created
        updated_at:
          type: string
          format: date-time
          description: When the message was last updated
        sent_at:
          type:
            - string
            - "null"
          format: date-time
          description: When the message was sent
        delivered_at:
          type:
            - string
            - "null"
          format: date-time
          description: When Relay accepted and stored the Message. For a committed Message, this is the same instant as
            created_at.
        read_at:
          type:
            - string
            - "null"
          format: date-time
          description: When the message was read
        edited_at:
          type:
            - string
            - "null"
          format: date-time
          description: When the message was last edited, or null if it was never edited.
        unsent_at:
          type:
            - string
            - "null"
          format: date-time
          description: When the sender unsent the message, or null. An unsent Message keeps its place in the transcript
            and carries no parts.
        silent:
          type: boolean
          description: Whether the sender sent this Message silently, so the recipient's device showed no banner and played
            no sound.
        deliveries:
          type: array
          items:
            $ref: "#/components/schemas/MessageDelivery"
          description: Per-recipient Delivered and Read truth for direct and group Chats. Relay derives this because it controls
            every recipient endpoint.
        is_system_message:
          type: boolean
          description: Whether this timeline item is a visible Chat event.
        system_event:
          oneOf:
            - $ref: "#/components/schemas/SystemEvent"
            - type: "null"
    MessageContent:
      type: object
      description: One message containing 1–100 ordered text, media, or link parts. A link must be the only part.
      properties:
        parts:
          x-go-type-skip-optional-pointer: true
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/MessagePart"
        reply_to:
          $ref: "#/components/schemas/ReplyTo"
          description: Reply to another message to create a threaded conversation
        idempotency_key:
          type: string
          description: Optional key for a safe retry. The same authenticated sender, key, and Message body return the original
            Message. Reusing the key with a different body returns a conflict.
          maxLength: 255
        silent:
          type: boolean
          default: false
          description: Send the Message with no banner and no sound on the recipient's device. The Message still arrives,
            still counts as unread, and still moves the Chat to the top of the list.
      required:
        - parts
    MessageDeliveredWebhook:
      description: Complete webhook payload for message.delivered events (2026-08-30 format)
      allOf:
        - $ref: "#/components/schemas/WebhookEnvelopeBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/MessageEvent"
    MessageDelivery:
      type: object
      additionalProperties: false
      required:
        - contact
        - delivered_at
        - read_at
      properties:
        contact:
          $ref: "#/components/schemas/ChatHandle"
          description: Message recipient whose commit-time Delivered timestamp and explicit Read timestamp this row records.
        delivered_at:
          type:
            - string
            - "null"
          format: date-time
          description: When Relay accepted and stored the Message. Relay stamps the same Message commit time for every
            recipient.
        read_at:
          type:
            - string
            - "null"
          format: date-time
          description: When this recipient marked the Chat Read. Read implies Delivered.
    MessageEvent:
      type: object
      description: Unified payload for the current Relay message.sent, message.received, message.delivered, and message.read
        webhooks. direction is relative to the receiving agent.
      required:
        - chat
        - id
        - direction
        - sender_handle
        - parts
      properties:
        chat:
          type: object
          description: Chat information
          required:
            - id
          properties:
            id:
              type: string
              format: uuid
              description: Chat identifier
            is_group:
              type:
                - boolean
                - "null"
              description: Whether this is a group chat
            owner_handle:
              oneOf:
                - $ref: "#/components/schemas/ChatHandle"
                - type: "null"
        id:
          type: string
          format: uuid
          description: Message identifier
        idempotency_key:
          type:
            - string
            - "null"
          description: Idempotency key for deduplication of outbound messages.
        direction:
          type: string
          description: Message direction - "outbound" if sent by you, "inbound" if received
          enum:
            - inbound
            - outbound
        sender_handle:
          description: The handle that sent this message
          $ref: "#/components/schemas/ChatHandle"
        parts:
          type: array
          description: Message parts (text and/or media)
          items:
            oneOf:
              - $ref: "#/components/schemas/schemas-TextPartResponse"
              - $ref: "#/components/schemas/schemas-MediaPartResponse"
              - $ref: "#/components/schemas/schemas-LinkPartResponse"
              - $ref: "#/components/schemas/ButtonsPartResponse"
            discriminator:
              propertyName: type
              mapping:
                text: "#/components/schemas/schemas-TextPartResponse"
                media: "#/components/schemas/schemas-MediaPartResponse"
                link: "#/components/schemas/schemas-LinkPartResponse"
                buttons: "#/components/schemas/ButtonsPartResponse"
        sent_at:
          type:
            - string
            - "null"
          format: date-time
          description: When the message was sent. Null if not yet sent.
        delivered_at:
          type:
            - string
            - "null"
          format: date-time
          description: When Relay accepted and stored the Message. Null only before server commit.
        read_at:
          type:
            - string
            - "null"
          format: date-time
          description: When the message was read. Null if not yet read.
        silent:
          type: boolean
          description: Whether the sender sent this Message silently, so the recipient's device showed no banner and played
            no sound.
        reply_to:
          type:
            - object
            - "null"
          description: Reference to the message this is replying to (for threaded replies)
          properties:
            message_id:
              type: string
              format: uuid
              description: ID of the message being replied to
            part_index:
              type: integer
              format: int32
              minimum: 0
              description: Index of the part being replied to
        thread:
          description: The thread this Message belongs to, or null when it is not a reply.
          oneOf:
            - $ref: "#/components/schemas/ThreadOriginator"
            - type: "null"
    MessagePart:
      type: object
      required:
        - type
      discriminator:
        propertyName: type
        mapping:
          text: "#/components/schemas/TextPart"
          media: "#/components/schemas/MediaPart"
          link: "#/components/schemas/LinkPart"
          buttons: "#/components/schemas/ButtonsPart"
      oneOf:
        - $ref: "#/components/schemas/TextPart"
        - $ref: "#/components/schemas/MediaPart"
        - $ref: "#/components/schemas/LinkPart"
        - $ref: "#/components/schemas/ButtonsPart"
    MessageReadWebhook:
      description: Complete webhook payload for message.read events (2026-08-30 format)
      allOf:
        - $ref: "#/components/schemas/WebhookEnvelopeBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/MessageEvent"
    MessageReceivedWebhook:
      description: Complete webhook payload for message.received events (2026-08-30 format)
      allOf:
        - $ref: "#/components/schemas/WebhookEnvelopeBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/MessageEvent"
    MessageSentWebhook:
      description: Complete webhook payload for message.sent events (2026-08-30 format)
      allOf:
        - $ref: "#/components/schemas/WebhookEnvelopeBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/MessageEvent"
    MessageFailedEvent:
      type: object
      description: |-
        Error details for message.failed webhook events.

        Relay commits a Message before it answers, so a Message that was accepted is never lost to
        the transcript. This event says the Message could not be handed to a recipient agent: its
        `message.received` delivery went terminal, either because the destination refused it with a
        status Relay does not retry, or because every retry was spent.
      required:
        - code
        - failed_at
      properties:
        chat_id:
          type: string
          format: uuid
          description: Chat identifier
        message_id:
          type: string
          format: uuid
          description: Message identifier
        code:
          $ref: "#/components/schemas/ErrorCode"
        reason:
          type: string
          description: Human-readable description of the failure
        detail_code:
          type:
            - integer
            - "null"
          description: |-
            Opaque diagnostic identifying the specific failure class within `code` - the last HTTP
            status the destination answered with, or null when it never answered. Log it and
            include it in support requests, but do not branch on it.
        failed_at:
          type: string
          format: date-time
          description: When the failure was detected
    MessageFailedWebhook:
      description: Complete webhook payload for message.failed events (2026-08-30 format)
      allOf:
        - $ref: "#/components/schemas/WebhookEnvelopeBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/MessageFailedEvent"
    ParticipantAddedEvent:
      type: object
      description: Payload for participant.added webhook events
      required:
        - chat_id
        - participant
        - added_at
      properties:
        chat_id:
          type: string
          description: Chat identifier (UUID) of the group chat
        participant:
          description: The added participant as a full handle object
          $ref: "#/components/schemas/ChatHandle"
        added_at:
          type: string
          format: date-time
          description: When the participant was added
    ParticipantAddedWebhook:
      description: Complete webhook payload for participant.added events
      allOf:
        - $ref: "#/components/schemas/WebhookEnvelopeBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ParticipantAddedEvent"
    ParticipantRemovedEvent:
      type: object
      description: Payload for participant.removed webhook events
      required:
        - chat_id
        - participant
        - removed_at
      properties:
        chat_id:
          type: string
          description: Chat identifier (UUID) of the group chat
        participant:
          description: The removed participant as a full handle object
          $ref: "#/components/schemas/ChatHandle"
        removed_at:
          type: string
          format: date-time
          description: When the participant was removed
    ParticipantRemovedWebhook:
      description: Complete webhook payload for participant.removed events
      allOf:
        - $ref: "#/components/schemas/WebhookEnvelopeBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ParticipantRemovedEvent"
    Reaction:
      type: object
      required:
        - is_me
        - handle
        - type
      properties:
        is_me:
          type: boolean
          description: Whether this reaction is from the current user
        handle:
          $ref: "#/components/schemas/ChatHandle"
        type:
          $ref: "#/components/schemas/ReactionType"
        custom_emoji:
          type:
            - string
            - "null"
          description: Custom emoji if type is "custom", null otherwise
    ReactionAddedEvent:
      description: Payload for reaction.added webhook events
      $ref: "#/components/schemas/ReactionEventBase"
    ReactionAddedWebhook:
      description: Complete webhook payload for reaction.added events
      allOf:
        - $ref: "#/components/schemas/WebhookEnvelopeBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ReactionAddedEvent"
    ReactionEventBase:
      type: object
      required:
        - chat_id
        - from_handle
        - message_id
        - part_index
        - reaction_type
        - is_from_me
        - reacted_at
      properties:
        chat_id:
          type: string
          description: Chat identifier (UUID)
        from_handle:
          description: The person who added/removed the reaction as a full handle object
          $ref: "#/components/schemas/ChatHandle"
        message_id:
          type: string
          description: Message identifier (UUID) that the reaction was added to or removed from
        part_index:
          type: integer
          format: int32
          minimum: 0
          description: Index of the message part that was reacted to (0-based)
        reaction_type:
          $ref: "#/components/schemas/ReactionType"
        custom_emoji:
          type:
            - string
            - "null"
          description: The actual emoji when reaction_type is "custom". Null for standard tapbacks.
        is_from_me:
          type: boolean
        reacted_at:
          type: string
          format: date-time
          description: When the reaction was added or removed
    ReactionRemovedEvent:
      description: Payload for reaction.removed webhook events
      $ref: "#/components/schemas/ReactionEventBase"
    ReactionRemovedWebhook:
      description: Complete webhook payload for reaction.removed events
      allOf:
        - $ref: "#/components/schemas/WebhookEnvelopeBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ReactionRemovedEvent"
    ReactionType:
      type: string
      description: Six standard tapbacks or a custom Unicode emoji.
      enum:
        - love
        - like
        - dislike
        - laugh
        - emphasize
        - question
        - custom
    RemoveParticipantRequest:
      type: object
      required:
        - handle
      properties:
        handle:
          type: string
          description: Relay Handle.
    ThreadOriginator:
      type: object
      description: The Message and part that opened a thread. A reply to a reply names the same originator as the Message it
        replied to, so every Message in one thread carries the same value. Withheld, as null on the Message, from a reader who
        cannot see the originator.
      required:
        - originator_message_id
        - originator_part_index
      properties:
        originator_message_id:
          type: string
          format: uuid
          description: ID of the Message that opened the thread.
        originator_part_index:
          type: integer
          format: int32
          minimum: 0
          description: Index of the originator's part that opened the thread (0-based).
    ReplyTo:
      type: object
      description: Indicates this message is a threaded reply to another message
      required:
        - message_id
      properties:
        message_id:
          type: string
          format: uuid
          description: The ID of the message to reply to
        part_index:
          type: integer
          format: int32
          description: |
            The specific message part to reply to (0-based index).
            Defaults to 0 (first part) if not provided.
            Use this when replying to a specific part of a multipart message.
            Targeting a `buttons` part returns 422 unless the message is a tap:
            one `text` part equal to one of that part's plain button labels,
            sent by the user. An agent's reply to a `buttons` part returns 403.
          minimum: 0
    RequestUploadRequest:
      type: object
      required:
        - filename
        - content_type
        - size_bytes
      properties:
        filename:
          type: string
          description: Name of the file to upload
          minLength: 1
          maxLength: 255
        content_type:
          type: string
          maxLength: 255
          pattern: "^[A-Za-z0-9!#$%&'*+.^_`|~-]+/[A-Za-z0-9!#$%&'*+.^_`|~-]+$"
          description: >-
            MIME type of the file, as `type/subtype`. Relay accepts any file
            type and stores the bytes unchanged; the declared type is lowercased
            and returned to the reader as sent.
        size_bytes:
          type: integer
          format: int64
          description: Size of the file in bytes (max 100MB)
          minimum: 1
          maximum: 104857600
        duration_ms:
          type:
            - integer
            - "null"
          minimum: 0
          description: >-
            Audio or video duration in milliseconds when known. Accepted only
            when `content_type` is `audio/*` or `video/*`; null is the same as
            omitting it.
        width:
          type:
            - integer
            - "null"
          minimum: 1
          description: >-
            Pixel width when known. Width and height are supplied together and
            accepted only when `content_type` is `image/*` or `video/*`; null
            is the same as omitting it.
        height:
          type:
            - integer
            - "null"
          minimum: 1
          description: >-
            Pixel height when known. Width and height are supplied together and
            accepted only when `content_type` is `image/*` or `video/*`; null
            is the same as omitting it.
    RequestUploadResult:
      type: object
      required:
        - attachment_id
        - upload_url
        - download_url
        - http_method
        - expires_at
        - required_headers
      properties:
        attachment_id:
          type: string
          description: Unique identifier for the attachment
          format: uuid
        upload_url:
          type: string
          format: uri
          description: Opaque Relay upload URL. PUT the raw bytes with the exact required_headers before expires_at.
        download_url:
          type: string
          format: uri
          description: Opaque Relay download URL for the Attachment.
        http_method:
          type: string
          description: HTTP method to use for upload (always PUT)
          enum:
            - PUT
        expires_at:
          type: string
          format: date-time
          description: When the upload URL expires (15 minutes from now)
        required_headers:
          type: object
          description: Exact HTTP headers required by the upload URL.
          additionalProperties:
            type: string
    SendMessageRequest:
      type: object
      description: Resolve or reuse the Chat for the recipient Handles, then send a Message as the authenticated Contact.
      required:
        - to
        - message
      properties:
        to:
          type: array
          minItems: 1
          maxItems: 6
          items:
            type: string
        message:
          description: The Message to send. Text, link, and media parts are supported. Voice memos use POST
            /v1/chats/{chatId}/voicememo.
          $ref: "#/components/schemas/MessageContent"
    SendMessageResponse:
      type: object
      description: Response for sending a message to a chat
      required:
        - chat_id
        - message
      properties:
        chat_id:
          type: string
          format: uuid
          description: Unique identifier of the chat this message was sent to
        message:
          $ref: "#/components/schemas/SentMessage"
    SendMessageResult:
      type: object
      description: The resolved Chat and resulting Message.
      required:
        - chat_id
        - created_new_chat
        - from
        - is_group
        - handles
        - message
      properties:
        chat_id:
          type: string
          format: uuid
          description: The reused or newly created Chat.
        created_new_chat:
          type: boolean
        from:
          type: string
          description: Handle of the authenticated sending Contact.
        is_group:
          type: boolean
          description: Whether the resolved chat is a group chat.
        handles:
          type: array
          description: Contacts in the resolved Chat.
          items:
            $ref: "#/components/schemas/ChatHandle"
        message:
          description: The primary message that was sent.
          $ref: "#/components/schemas/SentMessage"
    SendMessageToChatRequest:
      type: object
      required:
        - message
      properties:
        message:
          $ref: "#/components/schemas/MessageContent"
    SendReactionRequest:
      type: object
      required:
        - operation
        - type
      properties:
        operation:
          type: string
          description: Whether to add or remove the reaction
          enum:
            - add
            - remove
        type:
          $ref: "#/components/schemas/ReactionType"
        custom_emoji:
          type: string
          minLength: 1
          maxLength: 32
          description: |
            Custom emoji string. Required when type is "custom".
        part_index:
          type: integer
          description: |
            Optional index of the message part to react to.
            If not provided, reacts to the entire message (part 0).
      if:
        properties:
          type:
            const: custom
      then:
        required:
          - custom_emoji
        properties:
          custom_emoji: {}
    SendVoiceMemoToChatRequest:
      type: object
      description: |
        Request to send a voice memo to a chat (chat_id provided in path).
        Exactly one of `voice_memo_url` or `attachment_id` must be provided.
      properties:
        voice_memo_url:
          type: string
          format: uri
          description: |
            URL of the voice memo audio file. Must be a publicly accessible HTTPS URL.

            Either `voice_memo_url` or `attachment_id` must be provided, but not both.
        attachment_id:
          type: string
          format: uuid
          description: |
            Reference to a voice memo file pre-uploaded via `POST /v1/attachments`.
            The file is already stored, so sends using this ID skip the download step.

            Either `voice_memo_url` or `attachment_id` must be provided, but not both.
      oneOf:
        - required:
            - voice_memo_url
          properties:
            voice_memo_url: {}
            attachment_id: false
        - required:
            - attachment_id
          properties:
            voice_memo_url: false
            attachment_id: {}
    SendVoiceMemoToChatResult:
      type: object
      description: Response for sending a voice memo to a chat
      required:
        - voice_memo
      properties:
        voice_memo:
          type: object
          required:
            - id
            - from
            - to
            - status
            - voice_memo
            - created_at
            - chat
          properties:
            id:
              type: string
              format: uuid
              description: Message identifier
            from:
              type: string
            to:
              type: array
              items:
                type: string
            status:
              type: string
              description: Current delivery status
            voice_memo:
              $ref: "#/components/schemas/VoiceMemoAttachment"
            created_at:
              type: string
              format: date-time
              description: When the voice memo was created
            chat:
              $ref: "#/components/schemas/ChatInfo"
    SentMessage:
      type: object
      description: A message that was sent (used in CreateChat and SendMessage responses)
      required:
        - id
        - parts
        - created_at
        - sent_at
        - delivery_status
      properties:
        id:
          type: string
          format: uuid
          description: Message identifier (UUID)
        parts:
          type: array
          description: Message parts in order (text, media, and link)
          items:
            oneOf:
              - $ref: "#/components/schemas/TextPartResponse"
              - $ref: "#/components/schemas/MediaPartResponse"
              - $ref: "#/components/schemas/LinkPartResponse"
              - $ref: "#/components/schemas/ButtonsPartResponse"
        created_at:
          type: string
          format: date-time
          description: When the message was created
        sent_at:
          type:
            - string
            - "null"
          format: date-time
          description: When the message was actually sent (null if still queued)
        delivered_at:
          type:
            - string
            - "null"
          format: date-time
          description: When Relay accepted and stored the Message.
        delivery_status:
          $ref: "#/components/schemas/DeliveryStatus"
        from_handle:
          description: The sender of this message as a full handle object
          oneOf:
            - $ref: "#/components/schemas/ChatHandle"
            - type: "null"
        silent:
          type: boolean
          description: Whether the sender sent this Message silently, so the recipient's device showed no banner and played
            no sound.
        reply_to:
          oneOf:
            - $ref: "#/components/schemas/ReplyTo"
            - type: "null"
        thread:
          description: The thread this Message belongs to, or null when it is not a reply.
          oneOf:
            - $ref: "#/components/schemas/ThreadOriginator"
            - type: "null"
    SetContactCardRequest:
      type: object
      additionalProperties: false
      not:
        required: [image_url, attachment_id]
      dependentSchemas:
        image_recipe:
          anyOf:
            - required: [attachment_id]
            - required: [image_url]
      required:
        - handle
        - first_name
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 30
          description: First name for the contact card. Required. At most 30 characters.
        last_name:
          type: string
          description: Last name for the contact card. Optional.
        image_url:
          type: string
          description: >-
            Profile image for the contact card. Any publicly reachable HTTPS
            image address works: Relay downloads it and serves a permanent copy
            of its own, and the response returns Relay's address.
        attachment_id:
          type: string
          format: uuid
          description: >-
            An image uploaded through the existing Attachments API by this
            authenticated agent. Upload must be complete. Relay copies its
            bytes from private attachment storage to a permanent public image.
            Choose this or image_url, not both.
        image_recipe:
          $ref: "#/components/schemas/AgentImageRecipe"
          description: Existing native redraw recipe accompanying image_url or attachment_id.
        handle:
          type: string
          description: Relay Handle associated with this contact card.
    SetContactCardResponse:
      type: object
      required:
        - handle
        - first_name
        - is_active
        - kind
        - last_name
        - image_url
        - image_color
      properties:
        call_url:
          type:
            - string
            - "null"
          format: uri
          description: >-
            The agent's one call address, a wss:// URL Relay dials when the
            agent is called. Null when the agent takes no calls. Present on
            agents only.
        first_name:
          type: string
          description: First name on the contact card
        last_name:
          type:
            - string
            - "null"
        image_url:
          type:
            - string
            - "null"
          format: uri
        image_color:
          type:
            - string
            - "null"
          pattern: ^[0-9A-F]{6}$
          description: >-
            Dominant colour of the picture at image_url, six uppercase hex
            digits, computed by Relay once when the picture is set. Null when
            Relay could not read the picture.
        is_active:
          type: boolean
          description: Whether the contact card was successfully applied to the device
        handle:
          type: string
          description: Relay Handle associated with this contact card.
        kind:
          type: string
          enum:
            - user
            - agent
          description: Whether the Contact is a user or an agent.
    SystemEvent:
      type: object
      additionalProperties: false
      required:
        - type
        - actor
        - subject
        - value
        - icon_attachment_id
        - contact_card
        - call
      properties:
        type:
          type: string
          enum:
            - chat_created
            - participant_added
            - participant_removed
            - group_name_updated
            - group_icon_updated
            - contact_card_shared
            - call_ended
          description: >-
            What happened. For call_ended the actor is the caller, the subject
            is the callee, and call carries the Call's outcome.
        actor:
          $ref: "#/components/schemas/SystemEventParty"
        subject:
          oneOf:
            - $ref: "#/components/schemas/SystemEventParty"
            - type: "null"
        value:
          type:
            - string
            - "null"
        icon_attachment_id:
          type:
            - string
            - "null"
          format: uuid
        contact_card:
          oneOf:
            - $ref: "#/components/schemas/ContactCardItem"
            - type: "null"
        call:
          oneOf:
            - $ref: "#/components/schemas/CallMarker"
            - type: "null"
          description: The ended Call this event marks. Null unless type is call_ended.
    CallMarker:
      type: object
      additionalProperties: false
      description: >-
        The outcome of an ended Call, carried by a call_ended system event so a
        client can draw the call in the chat history.
      required:
        - id
        - mode
        - end_reason
        - connected
        - duration_seconds
      properties:
        id:
          type: string
          format: uuid
          description: The Call's id.
        mode:
          type: string
          enum:
            - audio
        end_reason:
          type: string
          enum:
            - completed
            - declined
            - canceled
            - no_answer
            - disconnected
            - failed
          description: Why the Call ended. The same values as Call.end_reason, never null here.
        connected:
          type: boolean
          description: Whether the Call was answered (answered_at set).
        duration_seconds:
          type:
            - integer
            - "null"
          minimum: 0
          description: >-
            Whole seconds from answered to ended. Null when the Call was
            never answered.
    SystemEventParty:
      type: object
      additionalProperties: false
      required:
        - id
        - handle
        - kind
      properties:
        id:
          type: string
          format: uuid
        handle:
          type: string
        kind:
          type: string
          enum:
            - user
            - agent
    SystemPartResponse:
      type: object
      additionalProperties: false
      required:
        - type
        - value
        - reactions
      properties:
        type:
          type: string
          enum:
            - system
        value:
          type: string
        reactions:
          type: "null"
    TextPart:
      type: object
      required:
        - type
        - value
      properties:
        type:
          type: string
          enum:
            - text
          description: Indicates this is a text message part
        value:
          type: string
          description: Plain text content, measured in UTF-16 code units for mention ranges.
          minLength: 1
          maxLength: 10000
        mention:
          type:
            - string
            - "null"
          description: Relay Handle mentioned by this text part.
        mention_range:
          type:
            - array
            - "null"
          prefixItems:
            - type: integer
              minimum: 0
            - type: integer
              minimum: 1
          minItems: 2
          maxItems: 2
          description: UTF-16 [start,end) range of the mention inside value.
    TextPartResponse:
      type: object
      description: A text message part
      required:
        - type
        - value
        - reactions
      properties:
        type:
          type: string
          enum:
            - text
          description: Indicates this is a text message part
        value:
          type: string
          description: The text content
        mentions:
          type:
            - array
            - "null"
          description: Mentions ordered by position in the text; null when none. Handles reflect the participant's current handle.
          items:
            type: object
            required: [id, handle, is_me, range]
            properties:
              id:
                type: string
                format: uuid
                description: Stable participant Contact ID, unchanged when the handle changes.
              handle:
                type: string
                description: The target participant's current Relay Handle.
              is_me:
                type: boolean
                description: Whether the mention addresses the recipient reading this message.
              range:
                type: array
                items:
                  type: integer
                  minimum: 0
                minItems: 2
                maxItems: 2
                description: Inclusive-exclusive [start, end) UTF-16 code-unit range in value; the whole value when the send omitted mention_range.
        mention:
          deprecated: true
          type:
            - string
            - "null"
          description: Deprecated mirror of the first mention handle.
        mention_range:
          deprecated: true
          type:
            - array
            - "null"
          prefixItems:
            - type: integer
              minimum: 0
            - type: integer
              minimum: 1
          minItems: 2
          maxItems: 2
          description: Deprecated mirror of the first mention range; null when omitted on send.
        reactions:
          type:
            - array
            - "null"
          description: Reactions on this message part
          items:
            $ref: "#/components/schemas/Reaction"
    TypingContact:
      type: object
      additionalProperties: false
      required:
        - id
        - handle
        - kind
      description: Contact currently publishing typing state.
      properties:
        id:
          type: string
          format: uuid
          description: Contact identifier.
        handle:
          type: string
          description: Current Relay Handle.
        kind:
          type: string
          enum:
            - user
            - agent
          description: Whether the Contact is a user or an agent.
    UnblockHandleRequest:
      type: object
      required:
        - handle
      properties:
        handle:
          type: string
          description: Registered Relay Handle.
    UpdateChatRequest:
      type: object
      minProperties: 1
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 255
          description: New display name for the chat (group chats only)
        group_chat_icon:
          type:
            - string
            - "null"
          maxLength: 2048
          description: >-
            Group photo for the chat, in either of two forms. A completed image
            Attachment ID uses an image you already uploaded. Any publicly
            reachable HTTPS image address also works: Relay downloads it and
            serves a permanent copy of its own, so the address you supply does
            not have to stay up. Send null to clear the photo.
    UpdateContactCardRequest:
      type: object
      additionalProperties: false
      not:
        required: [image_url, attachment_id]
      dependentSchemas:
        image_recipe:
          anyOf:
            - required: [attachment_id]
            - required: [image_url]
              properties:
                image_url:
                  type: string
      properties:
        about:
          type: string
          minLength: 1
          maxLength: 60
          description: About text. Surrounding whitespace is trimmed.
        call_url:
          type:
            - string
            - "null"
          format: uri
          maxLength: 2048
          description: >-
            The one call address Relay dials when this agent is called: a
            wss:// URL. Relay opens a WebSocket to it signed with the
            agent's webhook secret (webhook-id, webhook-timestamp and
            webhook-signature headers over an empty body), then speaks
            Twilio Media Streams: connected, start (streamSid and callSid are
            the Call id; customParameters carry from, to, chat_id and
            direction), media (audio/x-mulaw, 8000 Hz, mono, base64) and
            stop; the agent answers with media, mark and clear. Answering the
            upgrade answers the Call; refusing it declines; closing the socket
            hangs up. Null clears the address. If omitted, the existing value
            is kept.
        first_name:
          type: string
          minLength: 1
          maxLength: 30
          description: Updated first name, at most 30 characters. If omitted, the existing value is kept.
        last_name:
          type:
            - string
            - "null"
          description: Updated last name. If omitted, the existing value is kept.
        image_url:
          type:
            - string
            - "null"
          description: >-
            Updated profile image. Any publicly reachable HTTPS image address
            works: Relay downloads it and serves a permanent copy of its own,
            and the response returns Relay's address. If omitted, the existing
            image is kept.
          format: uri
        attachment_id:
          type: string
          format: uuid
          description: >-
            This agent's completed image upload from the Attachments API.
            Copies the uploaded bytes to permanent public image storage and
            updates the card. Mutually exclusive with image_url, including null.
            Omit both to keep the existing image.
        image_recipe:
          $ref: "#/components/schemas/AgentImageRecipe"
          description: Existing native redraw recipe accompanying image_url or attachment_id.
    UpdateWebhookSubscriptionRequest:
      type: object
      properties:
        target_url:
          type: string
          format: uri
          description: New target URL for webhook events
        subscribed_events:
          type: array
          description: Updated list of event types to subscribe to
          minItems: 1
          items:
            $ref: "#/components/schemas/WebhookEventType"
        is_active:
          type: boolean
          description: Activate or deactivate the subscription
    VoiceMemoAttachment:
      type: object
      required:
        - id
        - url
        - filename
        - mime_type
        - size_bytes
      properties:
        id:
          type: string
          format: uuid
          description: Attachment identifier
        url:
          type: string
          format: uri
          description: Opaque Relay download URL for the voice memo Attachment.
        filename:
          type: string
          description: Original filename
        mime_type:
          type: string
          description: Audio MIME type
        size_bytes:
          type: integer
          description: File size in bytes
        duration_ms:
          type:
            - integer
            - "null"
          minimum: 0
          description: Audio or video duration in milliseconds when known.
        width:
          type:
            - integer
            - "null"
          minimum: 1
          description: Pixel width when known. Width and height are supplied together.
        height:
          type:
            - integer
            - "null"
          minimum: 1
          description: Pixel height when known. Width and height are supplied together.
    WebSocketAckFrame:
      type: object
      additionalProperties: false
      required:
        - type
        - through_sequence
      properties:
        type:
          type: string
          enum:
            - ack
        through_sequence:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
    WebSocketDisconnectFrame:
      type: object
      additionalProperties: false
      required:
        - type
        - reason
      properties:
        type:
          type: string
          enum:
            - disconnect
        reason:
          type: string
          enum:
            - revoked
            - heartbeat_timeout
            - restart
            - webhook_configured
    WebSocketErrorFrame:
      type: object
      additionalProperties: false
      required:
        - type
        - code
        - message
        - fatal
        - retryable
      properties:
        type:
          type: string
          enum:
            - error
        code:
          type: string
          enum:
            - invalid_frame
            - ack_out_of_range
            - stale_connection
            - ack_failed
            - delivery_failed
            - full_sync_required
            - full_sync_mismatch
        message:
          type: string
        fatal:
          type: boolean
        retryable:
          type: boolean
    WebSocketEventFrame:
      type: object
      additionalProperties: false
      required:
        - type
        - sequence
        - event
      properties:
        type:
          type: string
          enum:
            - event
        sequence:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
        event:
          $ref: "#/components/schemas/WebhookEnvelopeBase"
    WebSocketFullSyncCompleteFrame:
      type: object
      additionalProperties: false
      required:
        - type
        - through_sequence
      properties:
        type:
          type: string
          enum:
            - full_sync_complete
        through_sequence:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
    WebSocketFullSyncFrame:
      type: object
      additionalProperties: false
      required:
        - type
        - through_sequence
        - reason
      properties:
        type:
          type: string
          enum:
            - full_sync
        through_sequence:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
        reason:
          type: string
          enum:
            - checkpoint_outside_retention
    WebSocketPingFrame:
      type: object
      additionalProperties: false
      description: >-
        Heartbeat, client to server. Send this frame every
        heartbeat_interval_ms, serialized exactly as {"type":"ping"}. Relay
        answers it in the edge runtime without waking the Agent's connection
        state, so the reply costs nothing and arrives while the connection is
        otherwise idle. Relay never sends a ping frame.
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - ping
    WebSocketPongFrame:
      type: object
      additionalProperties: false
      description: >-
        Heartbeat reply, server to client, serialized exactly as
        {"type":"pong"}. It answers each ping frame. A client that stops
        sending pings is closed with 4408 after the heartbeat times out.
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - pong
    WebSocketReadyFrame:
      type: object
      additionalProperties: false
      required:
        - type
        - connection_id
        - acked_through
        - full_sync_required
        - full_sync_through
        - heartbeat_interval_ms
        - max_in_flight
      properties:
        type:
          type: string
          enum:
            - ready
        connection_id:
          type: string
          format: uuid
        acked_through:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
        full_sync_required:
          type: boolean
        full_sync_through:
          type:
            - string
            - "null"
          pattern: ^(0|[1-9][0-9]*)$
        heartbeat_interval_ms:
          type: integer
          minimum: 1
        max_in_flight:
          type: integer
          minimum: 1
    WebhookEnvelopeBase:
      type: object
      required:
