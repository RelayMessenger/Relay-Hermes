          properties:
            data:
              $ref: "#/components/schemas/ChatGroupIconUpdatedEvent"
    ChatGroupNameUpdatedEvent:
      type: object
      description: Payload for chat.group_name_updated webhook events
      required:
        - chat_id
        - updated_at
      properties:
        chat_id:
          type: string
          description: Chat identifier (UUID) of the group chat
        old_value:
          type:
            - string
            - "null"
          description: Previous group name (null if no previous name)
        new_value:
          type:
            - string
            - "null"
          description: New group name (null if the name was removed)
        changed_by_handle:
          description: The handle who made the change.
          oneOf:
            - $ref: "#/components/schemas/ChatHandle"
            - type: "null"
        updated_at:
          type: string
          format: date-time
          description: When the update occurred
    ChatGroupNameUpdatedWebhook:
      description: Complete webhook payload for chat.group_name_updated events
      allOf:
        - $ref: "#/components/schemas/WebhookEnvelopeBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ChatGroupNameUpdatedEvent"
    ChatHandle:
      type: object
      required:
        - id
        - handle
        - joined_at
        - kind
        - display_name
        - image_url
        - image_color
        - about
        - verified
        - is_contact
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for this handle
        handle:
          type: string
          description: Relay Handle.
        status:
          type:
            - string
            - "null"
          description: Participant status
          enum:
            - active
            - left
            - removed
          default: active
        joined_at:
          type: string
          format: date-time
          description: When this participant joined the chat
        left_at:
          type:
            - string
            - "null"
          format: date-time
          description: When they left (if applicable)
        is_me:
          type:
            - boolean
            - "null"
          description: Whether this handle is the authenticated caller.
        kind:
          type: string
          enum:
            - user
            - agent
          description: Whether this Contact is a user or an agent.
        display_name:
          type:
            - string
            - "null"
          description: Current Contact display name.
        image_url:
          type:
            - string
            - "null"
          format: uri
          description: >-
            Current Contact picture, as a permanent address served by Relay.
            It does not expire and may be cached indefinitely.
        image_color:
          type:
            - string
            - "null"
          pattern: ^[0-9A-F]{6}$
          description: >-
            Dominant colour of the picture at image_url, six uppercase hex
            digits, computed by Relay once when the picture is set. Null when
            Relay could not read the picture.
        about:
          type:
            - string
            - "null"
          maxLength: 60
          description: About text for an agent. User Contacts return null.
        verified:
          type: boolean
          description: Whether Relay has verified this agent.
        is_contact:
          type: boolean
          description: >-
            Whether the caller holds this member as a Contact. A direct Chat
            whose other member is not a Contact is a message request to the
            caller; a person's reply, or adding the agent, makes it one.
    ChatInfo:
      type: object
      required:
