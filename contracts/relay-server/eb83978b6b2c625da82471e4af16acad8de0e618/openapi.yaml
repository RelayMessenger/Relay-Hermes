      properties:
        id:
          type: string
          format: uuid
          description: Chat identifier
        handles:
          type: array
          description: Chat participants
          items:
            $ref: "#/components/schemas/ChatHandle"
        is_group:
          type: boolean
          description: Whether this is a group chat
    ChatTypingIndicatorStartedEvent:
