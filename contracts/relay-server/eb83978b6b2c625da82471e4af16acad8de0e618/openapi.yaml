        created_at:
          type: string
          format: date-time
          description: When the subscription was created
        updated_at:
          type: string
          format: date-time
          description: When the subscription was last updated
    WebhookSubscriptionResponse:
      type: object
      required:
        - id
        - target_url
        - subscribed_events
        - is_active
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: Unique identifier for the webhook subscription
        target_url:
          type: string
          format: uri
          description: URL where webhook events will be sent
        subscribed_events:
          type: array
          description: List of event types this subscription receives
          items:
            $ref: "#/components/schemas/WebhookEventType"
        is_active:
          type: boolean
          description: Whether this subscription is currently active
        created_at:
          type: string
          format: date-time
          description: When the subscription was created
        updated_at:
          type: string
          format: date-time
          description: When the subscription was last updated
    schemas-LinkPartResponse:
      type: object
