        - display_name
        - handles
        - is_group
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: Unique identifier for the chat
          format: uuid
        display_name:
          type:
            - string
            - "null"
          description: "Display name for the chat. When nobody has named it, the other participants' names: \"Alice\",
            \"Alice & Bob\", or \"Alice, Bob & Cleo\". Can be updated for group chats."
        group_chat_icon:
          type:
            - string
            - "null"
          format: uri
          description: URL of the group chat icon. Only set for group chats that have an icon; `null` otherwise.
        handles:
          type: array
          items:
            $ref: "#/components/schemas/ChatHandle"
        is_group:
          type: boolean
          description: Whether this is a group chat
          default: false
        created_at:
          type: string
          format: date-time
          description: When the chat was created
        updated_at:
          type: string
          format: date-time
          description: When the chat was last updated
    ChatCreatedEvent:
      type: object
      required:
        - id
        - display_name
        - handles
        - is_group
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: Unique identifier for the chat
          format: uuid
        display_name:
          type:
            - string
            - "null"
          description: "Display name for the chat. When nobody has named it, the other participants' names: \"Alice\",
            \"Alice & Bob\", or \"Alice, Bob & Cleo\". Can be updated for group chats."
        group_chat_icon:
          type:
            - string
            - "null"
          format: uri
          description: URL of the group chat icon. Only set for group chats that have an icon; `null` otherwise.
        handles:
          type: array
          items:
            $ref: "#/components/schemas/ChatHandle"
        is_group:
          type: boolean
          description: Whether this is a group chat
          default: false
        created_at:
          type: string
          format: date-time
          description: When the chat was created
        updated_at:
          type: string
          format: date-time
          description: When the chat was last updated
      description: Chat resource created for the receiving agent.
    ChatCreatedWebhook:
      description: Complete webhook payload for chat.created events
      allOf:
        - $ref: "#/components/schemas/WebhookEnvelopeBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ChatCreatedEvent"
    ChatGroupIconUpdatedEvent:
