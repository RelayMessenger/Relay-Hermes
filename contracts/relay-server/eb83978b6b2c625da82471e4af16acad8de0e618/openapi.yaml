              maxItems: 2
              items:
                type: string
              description: One existing Relay gradient pair, ordered top then base.
              enum:
                - ["EC8A3C", "C85F1C"]
                - ["E0567A", "AD2A52"]
                - ["D05FC6", "93217E"]
                - ["8F6CF2", "5F38CF"]
                - ["5B9BFA", "0B52C0"]
                - ["2596A6", "116A79"]
                - ["2FA46A", "137347"]
    AgentMonogramImageRecipe:
