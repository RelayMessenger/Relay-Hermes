  /v1/websocket:
    get:
      operationId: connectAgentWebSocket
      summary: Connect an Agent WebSocket
      tags:
        - WebSocket
      security:
        - BearerAuth: []
      parameters:
        - name: observe
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: >-
            Read-only diagnostic event view. The ready frame includes
            observational:true. Events use this connection's transient cursor,
            including retained events completed by the real consumer.
            ACK and full_sync_complete frames are rejected. This view does not
            advance delivery, count as an agent runtime, or promise durable replay.
      responses:
        "101":
          description: WebSocket connection accepted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
      description: >-
        Upgrade wss://api.relayapp.im/v1/websocket with Authorization: Bearer
        <Agent Token>. If the Agent has any saved webhook subscription, Relay
        returns 409. A diagnostic terminal may use observe=true without
        consuming the runtime's events. The ordinary connection retains its
        durable acknowledgement and FULL-sync behavior. The client owns the
        heartbeat: send {"type":"ping"} every heartbeat_interval_ms and Relay
        answers {"type":"pong"} from the edge runtime, without waking the
        Agent's connection state. Relay never sends a ping frame.
  /v1/chats/{chatId}/calls:
    post:
      operationId: createCall
      summary: Start an individual call
      tags:
        - Calls
      security:
        - BearerAuth: []
      description: Start an audio Call in an existing individual Chat containing one user and one agent. The caller comes from authentication. The user must have added the agent; sending or replying to a Message establishes that relationship. A block in either direction prevents the call. A group Chat is rejected even when it has only two current members. Reuse the same Idempotency-Key and body after an uncertain response. Relay opens a WebSocket to the agent's call address (call_url) in Twilio Media Streams' shape, signed like a webhook; a 101 within the 10-second ring lease answers the Call (status active), any other reply declines it, and silence ends it no_answer. An answered Call has no duration limit.
      parameters:
        - name: chatId
          in: path
          required: true
          schema: &a1
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallCreateRequest"
      responses:
        "200":
          description: The original Call for the same idempotent request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallResult"
        "201":
          description: Call created and ringing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: The Chat cannot take a Call. The agent has no call address, so nothing would answer (error code `2031`, "This agent has no call address."); or the Chat is not an individual Chat of one user and one agent (error code `1005`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
    get:
      operationId: listCalls
      summary: List calls in a chat
      tags:
        - Calls
      security:
        - BearerAuth: []
      description: Read retained call history for a Chat you belong to.
      parameters:
        - name: chatId
          in: path
          required: true
          schema: *a1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Operation completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallListResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/calls/{callId}:
    get:
      operationId: getCall
      summary: Retrieve a call
      tags:
        - Calls
      security:
        - BearerAuth: []
      description: Only a Contact in the Call can retrieve it.
      parameters:
        - name: callId
          in: path
          required: true
          schema: *a1
      responses:
        "200":
          description: Operation completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/calls/{callId}/end:
    post:
      operationId: endCall
      summary: End a call
      tags:
        - Calls
      security:
        - BearerAuth: []
      description: Either Contact ends the Call. A ringing Call ends canceled when its caller ends it and declined when its recipient does; an answered Call ends completed. An agent declines by refusing the upgrade at its call address, and hangs up by closing that socket. Cleanup remains available after a block or removal. Repeated terminal actions never restart the Call.
      parameters:
        - name: callId
          in: path
          required: true
          schema: *a1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallEmptyRequest"
      responses:
        "200":
          description: Operation completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  schemas:
    CallContact:
      type: object
      additionalProperties: false
      required:
