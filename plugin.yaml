name: relayapp-platform
label: Relay
kind: platform
version: 1.0.0
description: >
  Relay messenger platform adapter for Hermes Agent. The always-on Hermes
  gateway receives events through Relay WebSocket. It commits each complete
  event to a durable SQLite inbox before cumulative ACK, deduplicates event_id,
  processes after acceptance, and replies through idempotent v1 REST.
author: Companion, Inc.
homepage: https://github.com/relaymessenger/hermes-relay-plugin
license: MIT
requires_env:
  - name: RELAY_AGENT_TOKEN
    description: "Relay Agent Token"
    prompt: "Relay Agent Token"
    url: "https://docs.relayapp.im/getting-started/authentication"
    password: true
optional_env:
  - name: RELAY_BASE_URL
    description: "Relay API origin (default: https://api.relayapp.im). HTTPS is required except on loopback."
    prompt: "Relay API base URL"
    password: false
  - name: RELAY_ALLOWED_USERS
    description: "Optional comma-separated Relay Contact ids allowed to talk to the agent"
    prompt: "Allowed Relay Contact ids"
    password: false
  - name: RELAY_STATE_DIR
    description: "Directory holding the durable SQLite inbox (default: ~/.hermes/relay)"
    prompt: "Relay state directory"
    password: false
  - name: RELAY_REPLY_TO_MODE
    description: "Reply threading: off | first | all | auto"
    prompt: "Reply threading mode"
    password: false
  - name: RELAY_GROUP_REPLY_POLICY
    description: "Group policy: mentions | all"
    prompt: "Group reply policy"
    password: false
  - name: RELAY_HOME_CHANNEL
    description: "Default Chat id for cron and notification delivery"
    prompt: "Home Chat id"
    password: false
  - name: RELAY_HOME_CHANNEL_NAME
    description: "Human label for the home Chat"
    prompt: "Home Chat name"
    password: false
