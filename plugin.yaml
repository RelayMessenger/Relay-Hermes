manifest_version: 1
name: relay-hermes
label: Relay
kind: platform
version: 1.0.0-rc.3.dev.0
description: >
  Connect Hermes Agent to Relay as an always-on agent. Relay messages arrive
  on a live connection, are saved before they are answered, are never answered
  twice, and every reply is sent back to Relay.
author: Companion, Inc.
homepage: https://github.com/RelayMessenger/Relay-Hermes
license: MIT
tags:
  - messaging
  - relay
  - websocket
requires_env:
  - name: RELAY_AGENT_TOKEN
    description: "Relay Agent Token"
    prompt: "Relay Agent Token"
    url: "https://docs.relayapp.im/getting-started/authentication"
    password: true
optional_env:
  - name: RELAY_BASE_URL
    description: "Relay API origin (default: https://api.relayapp.im). HTTPS is required except on loopback."
    prompt: "Relay API base URL"
    password: false
  - name: RELAY_ALLOWED_CONTACTS
    description: "Optional comma-separated Relay Contact ids allowed to talk to the agent"
    prompt: "Allowed Relay Contact ids"
    password: false
  - name: RELAY_STATE_DIR
    description: "Directory holding this profile's durable SQLite inbox (default: <Hermes profile home>/relay)"
    prompt: "Relay state directory"
    password: false
  - name: RELAY_REPLY_TO_MODE
    description: "Reply threading: off | first | all | auto"
    prompt: "Reply threading mode"
    password: false
  - name: RELAY_GROUP_CHAT_POLICY
    description: "Group Chat policy: mentions | all"
    prompt: "Group Chat policy"
    password: false
  - name: RELAY_HOME_CHAT
    description: "Default Chat id for cron and notification delivery"
    prompt: "Home Chat id"
    password: false
  - name: RELAY_HOME_CHAT_NAME
    description: "Human label for the home Chat"
    prompt: "Home Chat name"
    password: false
