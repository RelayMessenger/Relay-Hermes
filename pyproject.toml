[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "relay-hermes"
version = "1.0.0rc2"
description = "Connect Hermes Agent to Relay as an always-on agent"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{ name = "Companion, Inc." }]
keywords = ["hermes", "hermes-agent", "relay", "messaging", "agent", "websocket"]
classifiers = [
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Chat",
]
dependencies = [
  "httpx>=0.27",
  "websockets>=14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6"]

[project.urls]
Homepage = "https://github.com/RelayMessenger/Relay-Hermes"
Documentation = "https://docs.relayapp.im"
Issues = "https://github.com/RelayMessenger/Relay-Hermes/issues"
Repository = "https://github.com/RelayMessenger/Relay-Hermes"

# Hermes discovers a pip-installed plugin through this entry point; a
# drop-in copy into ~/.hermes/plugins/Relay-Hermes is discovered by directory scan
# and needs no packaging at all.
[project.entry-points."hermes_agent.plugins"]
relay-hermes = "relay_hermes"

[tool.setuptools]
packages = ["relay_hermes"]
package-dir = { relay_hermes = "." }

[tool.setuptools.package-data]
relay_hermes = ["plugin.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo root is a Python package (it doubles as the plugin directory
# Hermes imports), so prepend import mode would try to import its __init__ and
# pull in the gateway. importlib mode imports each test file on its own.
addopts = "--import-mode=importlib"
