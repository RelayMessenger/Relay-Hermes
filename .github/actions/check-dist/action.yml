name: Check the distributions before publishing
description: >-
  The shell half of the publish step both release lanes share: rehash the
  retained distributions, run twine check, and refuse to continue when the
  publishing switch is unreadable or the token path has no token.

  The upload itself is pypa/gh-action-pypi-publish, called directly from
  each workflow job and never from here. It is a Docker action that names
  its image after the repository it runs from; inside a composite action
  that becomes the calling repository, and Docker refused
  ghcr.io/RelayMessenger/Relay-Hermes ("must be lowercase", run
  34290221859, 2026-09-08). Calling it from the job also keeps the OIDC
  claim on publish-staging.yml / release.yml, the workflow files the owner
  registers as trusted publishers.

  The switch is the repository variable PYPI_TRUSTED_PUBLISHING, passed in
  by the caller. Unset: the token path (PYPI_API_TOKEN, attestations off).
  "true": Trusted Publishing (OIDC, attestations on). Both workflows carry
  the same two gated upload steps; tests/test_plugin_manifest.py proves
  they are identical.

inputs:
  dist-dir:
    description: Directory holding exactly the wheel and sdist to upload
    required: true
  version:
    description: The PEP 440 version the two files must carry
    required: true
  forbid:
    description: A version no shipped file may still carry (the pre-release form)
    required: false
    default: ""
  trusted-publishing:
    description: The repository variable PYPI_TRUSTED_PUBLISHING; "true" or unset
    required: false
    default: ""
  token:
    description: The PYPI_API_TOKEN secret; used only while trusted-publishing is unset
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Refuse an unreadable publishing switch or a missing token
      shell: bash
      env:
        SWITCH: ${{ inputs.trusted-publishing }}
        TOKEN_PRESENT: ${{ inputs.token != '' }}
      run: |
        case "$SWITCH" in
          ("")
            if [ "$TOKEN_PRESENT" != "true" ]; then
              echo "PYPI_TRUSTED_PUBLISHING is unset and no PYPI_API_TOKEN reached the job." >&2
              echo "Add the secret at Settings -> Secrets and variables -> Actions," >&2
              echo "or register the trusted publisher and set PYPI_TRUSTED_PUBLISHING=true." >&2
              exit 1
            fi
            echo "publishing with the project-scoped API token, attestations off"
            ;;
          (true)
            echo "publishing through PyPI Trusted Publishing, attestations on"
            ;;
          (*)
            echo "PYPI_TRUSTED_PUBLISHING must be unset or exactly 'true', not '$SWITCH'" >&2
            exit 2
            ;;
        esac

    - name: Rehash and recheck the exact distributions
      shell: bash
      env:
        DIST_DIR: ${{ inputs.dist-dir }}
        DIST_VERSION: ${{ inputs.version }}
        DIST_FORBID: ${{ inputs.forbid }}
      run: |
        python -m pip install --disable-pip-version-check "twine==7.0.0"
        (
          cd "$DIST_DIR/.."
          sha256sum --check provenance/SHA256SUMS
        )
        if [ -n "$DIST_FORBID" ]; then
          python scripts/release_version.py verify-dist \
            --dist "$DIST_DIR" --version "$DIST_VERSION" --forbid "$DIST_FORBID"
        else
          python scripts/release_version.py verify-dist \
            --dist "$DIST_DIR" --version "$DIST_VERSION"
        fi
