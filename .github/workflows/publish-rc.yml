name: Publish release candidate

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character staging commit SHA to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-relay-hermes-rc
  cancel-in-progress: false

env:
  EXPECTED_PACKAGE_VERSION: 1.0.0rc1
  EXPECTED_MANIFEST_VERSION: 1.0.0-rc.1

jobs:
  build:
    name: Verify exact staging SHA and build provenance
    if: >-
      github.repository == 'RelayMessenger/hermes-relay-plugin' &&
      github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      EXPECTED_SHA: ${{ inputs.commit_sha }}
      EVENT_SHA: ${{ github.sha }}
      EVENT_REF: ${{ github.ref }}
      EVENT_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check out the requested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false

      - name: Refuse anything except the exact staging event SHA
        run: |
          case "$EXPECTED_SHA" in
            (""|*[!0-9a-f]*)
              echo "commit_sha must be a lowercase hexadecimal commit SHA" >&2
              exit 2
              ;;
          esac
          test "${#EXPECTED_SHA}" -eq 40
          test "$EVENT_REPOSITORY" = "RelayMessenger/hermes-relay-plugin"
          test "$EVENT_REF" = "refs/heads/staging"
          test "$EXPECTED_SHA" = "$EVENT_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Assert RC metadata and build distributions
        run: |
          python -m pip install --disable-pip-version-check "build==1.3.0" "PyYAML==6.0.3"
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          import yaml

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          manifest = yaml.safe_load(Path("plugin.yaml").read_text())
          assert project["name"] == "relay-hermes"
          assert project["version"] == os.environ["EXPECTED_PACKAGE_VERSION"]
          assert manifest["version"] == os.environ["EXPECTED_MANIFEST_VERSION"]
          PY
          python -m build
          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["EXPECTED_PACKAGE_VERSION"]
          assert sorted(path.name for path in Path("dist").iterdir()) == [
              f"relay_hermes-{version}-py3-none-any.whl",
              f"relay_hermes-{version}.tar.gz",
          ]
          PY
          mkdir provenance
          sha256sum dist/* > provenance/SHA256SUMS

      - name: Attest distribution build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*

      - name: Retain exact distributions and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-distributions
          path: |
            dist/
            provenance/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish approved RC to PyPI
    needs: build
    if: >-
      github.repository == 'RelayMessenger/hermes-relay-plugin' &&
      github.ref == 'refs/heads/staging' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi-rc
    permissions:
      id-token: write
    steps:
      - name: Download the attested distributions
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-candidate-distributions

      - name: Verify retained distribution checksums
        run: sha256sum --check provenance/SHA256SUMS

      - name: Publish through PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist
          repository-url: https://upload.pypi.org/legacy/
          attestations: true
          skip-existing: false
          verbose: false
          print-hash: true
