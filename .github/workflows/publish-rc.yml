name: Publish release candidate

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character staging commit SHA to validate and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-relay-hermes-rc
  cancel-in-progress: false

env:
  EXPECTED_PACKAGE_VERSION: 1.0.0rc2
  RELAY_OPENAPI_COMMIT: 1a2245dd775f781b57e0d1f6f3146ebd384c90c3
  RELAY_OPENAPI_SNAPSHOT: contracts/relay-server/1a2245dd775f781b57e0d1f6f3146ebd384c90c3/openapi.yaml
  VALIDATED_ARTIFACT_NAME: relay-hermes-validated-rc

jobs:
  preflight:
    name: Refuse anything except the exact canonical staging SHA
    if: >-
      github.repository == 'RelayMessenger/Relay-Hermes' &&
      github.ref == 'refs/heads/staging'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    env:
      EXPECTED_SHA: ${{ inputs.commit_sha }}
      EVENT_SHA: ${{ github.sha }}
      EVENT_REF: ${{ github.ref }}
      EVENT_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Verify SHA-safe inputs
        run: |
          case "$EXPECTED_SHA" in
            (""|*[!0-9a-f]*)
              echo "commit_sha must be a lowercase hexadecimal commit SHA" >&2
              exit 2
              ;;
          esac
          test "${#EXPECTED_SHA}" -eq 40
          test "$EVENT_REPOSITORY" = "RelayMessenger/Relay-Hermes"
          test "$EVENT_REF" = "refs/heads/staging"
          test "$EXPECTED_SHA" = "$EVENT_SHA"

  validate:
    name: Full exact-SHA CI
    needs: preflight
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      commit_sha: ${{ inputs.commit_sha }}

  contract:
    name: Verify the checked-in Relay contract snapshot
    needs: validate
    if: >-
      github.repository == 'RelayMessenger/Relay-Hermes' &&
      github.ref == 'refs/heads/staging' &&
      needs.validate.result == 'success'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    environment: release-candidate
    permissions:
      contents: read
    env:
      EXPECTED_SHA: ${{ inputs.commit_sha }}
    steps:
      - name: Check out the exact canonical plugin source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: RelayMessenger/Relay-Hermes
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false

      - name: Verify the plugin source
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Run the locked contract harness
        run: |
          python -m pip install --disable-pip-version-check "PyYAML==6.0.3"
          python scripts/check-openapi.py "$RELAY_OPENAPI_SNAPSHOT"

  provenance:
    name: Attest the exact CI-validated distributions
    needs: contract
    if: >-
      github.repository == 'RelayMessenger/Relay-Hermes' &&
      github.ref == 'refs/heads/staging' &&
      needs.contract.result == 'success'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    environment: release-candidate
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the exact distributions built by full CI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.VALIDATED_ARTIFACT_NAME }}
          path: release

      - name: Rehash the exact validated bytes
        run: |
          (
            cd release
            sha256sum --check provenance/SHA256SUMS
          )
          test -f "release/dist/relay_hermes-${EXPECTED_PACKAGE_VERSION}-py3-none-any.whl"
          test -f "release/dist/relay_hermes-${EXPECTED_PACKAGE_VERSION}.tar.gz"
          test "$(find release/dist -maxdepth 1 -type f | wc -l)" -eq 2

      - name: Attest distribution build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/dist/*

  publish:
    name: Publish approved RC to PyPI
    needs: provenance
    if: >-
      github.repository == 'RelayMessenger/Relay-Hermes' &&
      github.ref == 'refs/heads/staging' &&
      needs.provenance.result == 'success'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    environment: pypi-rc
    permissions:
      contents: read
    steps:
      - name: Download the validated and attested distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.VALIDATED_ARTIFACT_NAME }}
          path: release

      - name: Verify retained distribution checksums
        run: |
          (
            cd release
            sha256sum --check provenance/SHA256SUMS
          )
          test "$(find release/dist -maxdepth 1 -type f | wc -l)" -eq 2

      - name: Publish with the project-scoped PyPI API token
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: release/dist
          repository-url: https://upload.pypi.org/legacy/
          # PEP 740 attestations only work through Trusted Publishing, so an
          # API token turns them off. Build provenance is still attested by
          # the provenance job above.
          attestations: false
          skip-existing: false
          verbose: false
          print-hash: true
