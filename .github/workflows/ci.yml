name: CI

on:
  pull_request:
  push:
    branches: [main, staging]
  workflow_call:
    inputs:
      commit_sha:
        description: Exact commit to validate; defaults to the event SHA
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.commit_sha || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ inputs.commit_sha || github.sha }}
  HERMES_AGENT_COMMIT: b2aa855b626ff8688eb34b95c60ee8b6a4af3679
  HERMES_AGENT_SRC: ${{ github.workspace }}/_hermes-agent
  RELAY_OPENAPI_SNAPSHOT: contracts/relay-server/1a2245dd775f781b57e0d1f6f3146ebd384c90c3/openapi.yaml
  VALIDATED_ARTIFACT_NAME: relay-hermes-validated-rc

jobs:
  build:
    name: Build exact distributions once
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Check out the exact plugin source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Verify the exact source SHA
        run: |
          case "$SOURCE_SHA" in
            (""|*[!0-9a-f]*)
              echo "SOURCE_SHA must be a lowercase hexadecimal commit SHA" >&2
              exit 2
              ;;
          esac
          test "${#SOURCE_SHA}" -eq 40
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Set up build Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Read the package version from the tree
        # The staging lane rewrites the version on every publish, so no
        # workflow names it. plugin.yaml must carry the same version in its
        # manifest form, or this step fails.
        run: python scripts/release_version.py show | tee -a "$GITHUB_ENV"

      - name: Install pinned build and contract dependencies
        run: |
          python -m pip install --disable-pip-version-check "build==1.6.0" "PyYAML==6.0.3"

      - name: Validate the exact checked-in Relay contract snapshot
        run: |
          python scripts/check-openapi.py "$RELAY_OPENAPI_SNAPSHOT"

      - name: Build pinned wheel and sdist
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          import yaml

          metadata = tomllib.loads(Path("pyproject.toml").read_text())
          manifest = yaml.safe_load(Path("plugin.yaml").read_text())
          assert metadata["build-system"]["requires"] == ["setuptools==84.0.0"]
          assert metadata["project"]["version"] == os.environ["EXPECTED_PACKAGE_VERSION"]
          assert manifest["version"] == os.environ["EXPECTED_MANIFEST_VERSION"]
          PY
          mkdir -p release/dist release/provenance
          python -m build --outdir release/dist
          test -f "release/dist/relay_hermes-${EXPECTED_PACKAGE_VERSION}-py3-none-any.whl"
          test -f "release/dist/relay_hermes-${EXPECTED_PACKAGE_VERSION}.tar.gz"
          tar -tzf "release/dist/relay_hermes-${EXPECTED_PACKAGE_VERSION}.tar.gz" |
            grep "/scripts/check-openapi.py$"
          (
            cd release
            sha256sum dist/* > provenance/SHA256SUMS
            sha256sum --check provenance/SHA256SUMS
          )

      - name: Retain the distributions before validation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.VALIDATED_ARTIFACT_NAME }}
          path: release/
          if-no-files-found: error
          retention-days: 14

  test:
    name: Validate exact distributions on Python ${{ matrix.python-version }}
    needs: build
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      MATRIX_PYTHON_VERSION: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out the exact plugin source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Verify the exact source SHA
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Check out the pinned Hermes source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ env.HERMES_AGENT_COMMIT }}
          path: _hermes-agent
          persist-credentials: false

      - name: Verify the Hermes source
        run: |
          test "$(git -C "$HERMES_AGENT_SRC" rev-parse HEAD)" = "$HERMES_AGENT_COMMIT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            _hermes-agent/pyproject.toml

      - name: Read the package version from the tree
        run: python scripts/release_version.py show | tee -a "$GITHUB_ENV"

      - name: Install the pinned Hermes runtime and the plugin
        # The tests import Hermes itself (gateway, hermes_cli), so the
        # environment carries every dependency Hermes declares at the pinned
        # commit, read from its own pyproject.toml rather than a hand-kept
        # list here. Hermes refuses wheel builds by design (setup.py guard);
        # the editable install is its supported path.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "$HERMES_AGENT_SRC"
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Download the one CI-built distribution pair
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.VALIDATED_ARTIFACT_NAME }}
          path: release

      - name: Verify the exact distribution bytes
        run: |
          (
            cd release
            sha256sum --check provenance/SHA256SUMS
          )
          test -f "release/dist/relay_hermes-${EXPECTED_PACKAGE_VERSION}-py3-none-any.whl"
          test -f "release/dist/relay_hermes-${EXPECTED_PACKAGE_VERSION}.tar.gz"

      - name: Run the full Hermes integration suite
        run: python -m pytest -q

      - name: Test the staging helper fail-closed guards
        run: |
          sh -n scripts/run-staging.sh
          set +e
          env -u RELAY_AGENT_TOKEN sh scripts/run-staging.sh >"$RUNNER_TEMP/no-token.log" 2>&1
          no_token_rc=$?
          RELAY_AGENT_TOKEN=dummy RELAY_BASE_URL=https://api.relayapp.im sh scripts/run-staging.sh >"$RUNNER_TEMP/wrong-origin.log" 2>&1
          wrong_origin_rc=$?
          set -e
          test "$no_token_rc" -ne 0
          test "$wrong_origin_rc" -eq 2

      - name: Run Hermes Plugin Doctor on the exact sdist
        run: |
          doctor_root="${RUNNER_TEMP}/relay-hermes-doctor-${MATRIX_PYTHON_VERSION}"
          mkdir -p "$doctor_root"
          tar -xzf "release/dist/relay_hermes-${EXPECTED_PACKAGE_VERSION}.tar.gz" \
            -C "$doctor_root"
          plugin_dir="${doctor_root}/relay_hermes-${EXPECTED_PACKAGE_VERSION}"
          test -d "$plugin_dir"
          cd "$HERMES_AGENT_SRC"
          SDIST_PLUGIN_DIR="$plugin_dir" PYTHONPATH="$HERMES_AGENT_SRC" python - <<'PY'
          import os
          from hermes_cli.plugins_cmd import cmd_plugin_doctor

          cmd_plugin_doctor(os.environ["SDIST_PLUGIN_DIR"], ci=True)
          PY

      - name: Clean-install the exact wheel and sdist
        run: |
          wheel_venv="${RUNNER_TEMP}/relay-hermes-wheel-${MATRIX_PYTHON_VERSION}"
          sdist_venv="${RUNNER_TEMP}/relay-hermes-sdist-${MATRIX_PYTHON_VERSION}"
          python -m venv "$wheel_venv"
          python -m venv "$sdist_venv"
          "$wheel_venv/bin/python" -m pip install -e "$HERMES_AGENT_SRC"
          "$wheel_venv/bin/python" -m pip install \
            "release/dist/relay_hermes-${EXPECTED_PACKAGE_VERSION}-py3-none-any.whl"
          "$sdist_venv/bin/python" -m pip install \
            "release/dist/relay_hermes-${EXPECTED_PACKAGE_VERSION}.tar.gz"
          "$wheel_venv/bin/python" -m pip check
          "$sdist_venv/bin/python" -m pip check
          for clean_venv in "$wheel_venv" "$sdist_venv"; do
            (
              cd "$RUNNER_TEMP"
              "$clean_venv/bin/python" - <<'PY'
          import os
          from importlib.metadata import entry_points, version

          installed = version("relay-hermes")
          assert installed == os.environ["EXPECTED_PACKAGE_VERSION"]
          entrypoint = next(
              item
              for item in entry_points().select(group="hermes_agent.plugins")
              if item.name == "relay-hermes"
          )
          assert entrypoint.value == "relay_hermes"
          assert callable(entrypoint.load().register)
          PY
            )
          done

      - name: Run Hermes against the exact clean wheel
        run: |
          wheel_venv="${RUNNER_TEMP}/relay-hermes-wheel-${MATRIX_PYTHON_VERSION}"
          hermes_home="${RUNNER_TEMP}/hermes-wheel-home-${MATRIX_PYTHON_VERSION}"
          mkdir -p "$hermes_home"
          printf 'plugins:\n  enabled:\n    - relay-hermes\n' > "$hermes_home/config.yaml"
          cd "$HERMES_AGENT_SRC"
          HERMES_HOME="$hermes_home" \
          RELAY_AGENT_TOKEN=relay-test-token \
          RELAY_BASE_URL=https://api.staging.relayapp.im \
          RELAY_STATE_DIR="$hermes_home/relay-state" \
          PYTHONPATH="$HERMES_AGENT_SRC" \
          "$wheel_venv/bin/python" - <<'PY'
          from gateway.platform_registry import platform_registry
          from hermes_cli.plugins import PluginManager

          manager = PluginManager()
          manager.discover_and_load()
          plugin = next(
              item
              for item in manager.list_plugins()
              if item["name"] == "relay-hermes"
              and item["source"] == "entrypoint"
          )
          entry = platform_registry.get("relayapp")
          assert plugin["enabled"] is True
          assert plugin["error"] is None
          assert entry is not None
          assert entry.required_env == ["RELAY_AGENT_TOKEN"]
          PY

  # The staging release proves itself before it can run: the version
  # decision publish-staging.yml would commit, derived here against live
  # PyPI and written nowhere. Its decision table is unit-tested first.
  staging-bump-dry-run:
    name: Rehearse the staging bump
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Check out the exact plugin source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Verify the exact source SHA
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install the pinned build tools
        run: |
          python -m pip install --disable-pip-version-check \
            "build==1.6.0" "PyYAML==6.0.3" "pytest>=8"

      - name: Prove the version derivation
        run: python -m pytest -q tests/test_release_version.py

      - name: Rehearse the staging bump
        run: python scripts/release_version.py staging --dry-run

      - name: Verify the rehearsal wrote nothing tracked
        run: test -z "$(git status --porcelain)"

  # The production release proves itself the same way: the derivation, the
  # build of a scratch copy, `twine check`, and the stale-version scan that
  # release.yml performs on a push to main, here on every change. GitHub only
  # dispatches a workflow that already exists on the default branch, so this
  # is also the only way a change to the release itself is rehearsed before
  # it merges.
  release-dry-run:
    name: Rehearse the release
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Check out the exact plugin source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Verify the exact source SHA
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install the pinned build tools
        run: |
          python -m pip install --disable-pip-version-check \
            "build==1.6.0" "twine==7.0.0" "PyYAML==6.0.3" "pytest>=8"

      - name: Prove the version derivation
        run: python -m pytest -q tests/test_release_version.py

      - name: Rehearse a skip for a target PyPI already has
        run: |
          set -euo pipefail
          # The plan against live PyPI, whatever it says today...
          python scripts/release_version.py release --dry-run --plan-only | tee plan-a.txt
          grep -q '^release plan only: ' plan-a.txt
          # ...and the same plan told the target is on PyPI must say skip.
          # (tests/test_release_version.py proves the derivation itself; this
          # proves the wiring in CI.)
          target="$(python scripts/release_version.py show | sed -n 's/^RELEASE_TARGET_VERSION=//p')"
          test -n "$target"
          python scripts/release_version.py release --dry-run --plan-only \
            --assume-published "$target" | tee plan-b.txt
          grep -q '^release plan only: skip$' plan-b.txt
          rm -f plan-a.txt plan-b.txt

      - name: Rehearse the release
        run: python scripts/release_version.py release --dry-run

      - name: Verify the rehearsal wrote nothing tracked
        run: test -z "$(git status --porcelain)"
