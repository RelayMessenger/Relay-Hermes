name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HERMES_AGENT_COMMIT: 04224b2f82aabbe89525451089eb2677edfae179
  HERMES_AGENT_SRC: ${{ github.workspace }}/_hermes-agent
  EXPECTED_PACKAGE_VERSION: 1.0.0rc1

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MATRIX_PYTHON_VERSION: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out the plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check out the pinned Hermes source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ env.HERMES_AGENT_COMMIT }}
          path: _hermes-agent
          persist-credentials: false

      - name: Verify the Hermes source
        run: |
          test "$(git -C "$HERMES_AGENT_SRC" rev-parse HEAD)" = "$HERMES_AGENT_COMMIT"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Run tests against Hermes
        run: python -m pytest -q

      - name: Build and install the wheel
        run: |
          python -m build
          test -f "dist/relay_hermes-${EXPECTED_PACKAGE_VERSION}-py3-none-any.whl"
          test -f "dist/relay_hermes-${EXPECTED_PACKAGE_VERSION}.tar.gz"
          clean_venv="${RUNNER_TEMP}/relay-hermes-wheel-${MATRIX_PYTHON_VERSION}"
          python -m venv "$clean_venv"
          "$clean_venv/bin/python" -m pip install "dist/relay_hermes-${EXPECTED_PACKAGE_VERSION}-py3-none-any.whl"
          "$clean_venv/bin/python" -m pip check
          "$clean_venv/bin/python" -c "import os; from importlib.metadata import version; assert version('relay-hermes') == os.environ['EXPECTED_PACKAGE_VERSION']"
